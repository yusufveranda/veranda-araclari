<!DOCTYPE html>
<html lang="tr" data-tema="gunduz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Muzayede: ressamı ve fiyatı bil</title>
<meta name="description" content="Bir tablo gör, gerçek mi çakma mı anla, fiyatını ve ressamını tahmin et.">
<meta property="og:image" content="https://verandatools.com/gorsel/doku.jpg">
<meta name="theme-color" content="#1C1510">
<meta property="og:title" content="Muzayede">
<meta property="og:description" content="Bir tablo gör, gerçek mi çakma mı anla, fiyatını ve ressamını tahmin et.">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%231C1510'/%3E%3Crect x='16' y='12' width='32' height='26' rx='2' fill='none' stroke='%23ECCF92' stroke-width='3'/%3E%3Ccircle cx='32' cy='25' r='5' fill='%23D7261D'/%3E%3Cpath d='M16 46 H48' stroke='%23ECCF92' stroke-width='3' stroke-linecap='round'/%3E%3C/svg%3E">
<link rel="apple-touch-icon" href="gorsel/favicon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,700;0,800;1,600&family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&display=swap">
<link rel="stylesheet" href="../ortak/stil.css">
<style>
:root{
  --kagit:#F3E7CC; --kart:#FBF3DE; --cizgi:#D8C39A;
  --murekkep:#221A14; --soluk:#7C6A4C; --cok-soluk:#A99873;
  --altin:#B8863A; --kirmizi:#D7261D; --turuncu:#C97418; --zeytin:#5F6B37;
  --golge:rgba(28,21,16,.20); --golge-sert:rgba(28,21,16,.30);
  --dogru:#5F6B37; --dogru-bg:rgba(95,107,55,.14);
  --yanlis:#D7261D; --yanlis-bg:rgba(215,38,29,.11);
}
[data-tema="gece"]{
  --kagit:#1C1510; --kart:#241C15; --cizgi:#3A2E1F;
  --murekkep:#EFE0C0; --soluk:#9C8A6C; --cok-soluk:#6B5C42;
  --altin:#D9B257; --kirmizi:#E8472E; --turuncu:#F0A94E; --zeytin:#8AA05C;
  --golge:rgba(0,0,0,.5); --golge-sert:rgba(0,0,0,.62);
  --dogru:#8AA05C; --dogru-bg:rgba(138,160,92,.16);
  --yanlis:#E8472E; --yanlis-bg:rgba(232,71,46,.16);
}

*{box-sizing:border-box}
body{
  background:var(--kagit); color:var(--murekkep);
  font-family:'Libre Baskerville',Georgia,serif; font-size:16px; line-height:1.55;
  min-height:100vh; position:relative;
  transition:background .4s,color .4s;
}
body::before{
  content:""; position:fixed; inset:0; z-index:-1; pointer-events:none;
  background:url(../gorsel/doku.jpg) center/cover; opacity:.10; mix-blend-mode:soft-light;
}
[data-tema="gece"] body::before{ opacity:.16; }

.sarmal{ width:min(720px,94vw); margin:0 auto; padding:18px 0 70px; }

.ust{ display:flex; align-items:center; gap:10px; flex-wrap:wrap; }
.ust-sag{ margin-left:auto; display:flex; gap:8px; }
.eve-don{
  display:inline-flex; align-items:center; gap:7px; text-decoration:none;
  background:var(--kirmizi); color:#F7ECD6; font-size:14px; font-family:'Libre Baskerville',serif;
  padding:7px 15px 7px 12px; border-radius:20px; box-shadow:2px 3px 0 var(--golge);
  transition:transform .12s,box-shadow .12s;
}
.eve-don:hover{ transform:translateY(-1px); box-shadow:2px 4px 0 var(--golge); }
.ikonbtn{
  background:var(--kart); border:1px solid var(--cizgi); border-radius:18px;
  padding:6px 14px; font-size:13.5px; color:var(--soluk); font-family:'Libre Baskerville',serif;
  cursor:pointer; transition:border-color .15s,color .15s;
}
.ikonbtn:hover{ border-color:var(--altin); color:var(--murekkep); }

.marka{ margin:22px 0 20px; display:flex; align-items:flex-end; gap:14px; flex-wrap:wrap; }
.amblem{ width:44px; height:44px; flex:none; }
.marka h1{
  font-family:'Playfair Display',Georgia,serif; font-weight:700; font-size:clamp(28px,4.4vw,40px);
  line-height:1; letter-spacing:-.5px; color:var(--murekkep); margin:0;
}
.marka .tag{
  color:var(--soluk); font-style:italic; font-family:'Libre Baskerville',Georgia,serif;
  font-size:14.5px; padding-bottom:4px;
}

/* çerçeveli tablo levhası */
.levha{
  background:var(--kart); padding:16px 16px 0; border-radius:5px;
  box-shadow:6px 8px 0 var(--golge-sert); border:1px solid var(--cizgi);
  position:relative; transform:rotate(-.4deg);
}
.cerceve{
  position:relative; overflow:hidden; border-radius:2px;
  background:var(--kagit); border:7px solid var(--altin);
  box-shadow:inset 0 0 0 2px var(--kart), inset 0 0 14px var(--golge-sert);
  display:flex; align-items:center; justify-content:center;
  min-height:220px;
}
.cerceve img{
  display:block; max-width:100%; max-height:min(75vh,620px); width:auto; height:auto;
  opacity:0; transition:opacity .5s;
}
.cerceve img[src]:not([src=""]){ opacity:1; }
.plaka{
  font-family:'Libre Baskerville',serif; font-size:11.5px; letter-spacing:.08em; text-transform:uppercase;
  color:var(--soluk); text-align:center; padding:11px 4px 13px;
}

#adminKutu{
  display:flex; justify-content:center; gap:8px; margin-top:10px;
}
#adminSecici{
  font-family:'Libre Baskerville',serif; font-size:13px;
  color:var(--murekkep); background:var(--kart); border:1px solid var(--cizgi); border-radius:8px; padding:6px 10px;
}

#gercekAsama, #fiyatAsama, #ressamAsama{ margin-top:22px; }

.soru{
  font-family:'Playfair Display',serif; font-weight:700; font-size:16.5px; color:var(--murekkep);
  margin-bottom:10px;
}

.gercek-secim{ display:flex; gap:10px; flex-wrap:wrap; }

.giris-satiri{ display:flex; gap:8px; flex-wrap:wrap; }
.giris-satiri input{
  flex:1; min-width:160px; font-family:'Libre Baskerville',serif; font-size:15px;
  padding:11px 14px; border:1.5px solid var(--cizgi); border-radius:9px;
  background:var(--kart); color:var(--murekkep);
}
.giris-satiri input::placeholder{ color:var(--cok-soluk); font-style:italic; }
.giris-satiri input:focus{ outline:none; border-color:var(--altin); }
.giris-satiri input:disabled{ opacity:.5; }

button{ font:inherit; cursor:pointer; }
.btn-ana{
  font-family:'Playfair Display',serif; font-weight:700; font-size:14.5px; color:#fff;
  background:var(--kirmizi); border:none; border-radius:9px; padding:11px 20px;
  box-shadow:2px 3px 0 var(--golge); transition:transform .12s,box-shadow .12s; white-space:nowrap;
}
.btn-ana:hover:not(:disabled){ transform:translateY(-1px); box-shadow:2px 4px 0 var(--golge); }
.btn-ana:active:not(:disabled){ transform:translate(1px,2px); box-shadow:1px 1px 0 var(--golge); }
.btn-ana:disabled{ opacity:.45; cursor:default; box-shadow:none; transform:none; }

.btn-ikincil{
  font-family:'Libre Baskerville',serif; font-size:13px; color:var(--soluk);
  background:none; border:1px solid var(--cizgi); border-radius:8px; padding:10px 15px;
}
.btn-ikincil:hover:not(:disabled){ border-color:var(--kirmizi); color:var(--kirmizi); }
.btn-ikincil:disabled{ opacity:.45; cursor:default; }

#ipucuAlanlari{ display:flex; flex-wrap:wrap; gap:7px; margin:12px 0 4px; }
.ipucu-btn{
  font-family:'Libre Baskerville',serif; font-size:12.5px; color:var(--turuncu);
  background:var(--kart); border:1px solid var(--cizgi); border-radius:20px;
  padding:6px 13px; transition:border-color .15s,transform .1s;
}
.ipucu-btn:hover:not(:disabled){ border-color:var(--turuncu); transform:translateY(-1px); }
.ipucu-btn:disabled{ color:var(--cok-soluk); opacity:.55; cursor:default; }
.ipucu-btn[data-acik="1"]{
  opacity:1; pointer-events:none; color:var(--murekkep); background:var(--kagit);
  border-color:var(--cizgi); border-style:dashed;
}
#ipucuAlanlari[data-kredi="1"] .ipucu-btn:not(:disabled):not([data-acik="1"]){
  border-color:var(--turuncu); animation:nabiz 1.3s ease-in-out infinite;
}
@keyframes nabiz{
  0%,100%{ box-shadow:0 0 0 0 rgba(201,116,24,0); }
  50%{ box-shadow:0 0 0 3px rgba(201,116,24,.28); }
}
@media(prefers-reduced-motion:reduce){
  #ipucuAlanlari[data-kredi="1"] .ipucu-btn:not(:disabled):not([data-acik="1"]){ animation:none; }
}
#ipucuDurum{
  min-height:1.3em; margin:12px 0 0; font-size:12.5px; color:var(--soluk); font-style:italic;
}

#ressamMesaj, #fiyatMesaj, #gercekMesaj{ min-height:1.4em; margin-top:10px; font-size:14.5px; }
#ressamMesaj.dogru, #fiyatMesaj.dogru, #gercekMesaj.dogru{ color:var(--dogru); font-weight:700; }
#ressamMesaj.yanlis{ animation:sars .35s; }
@keyframes sars{ 0%,100%{transform:translateX(0)} 25%{transform:translateX(-5px)} 75%{transform:translateX(5px)} }
@media(prefers-reduced-motion:reduce){ #ressamMesaj.yanlis{ animation:none; } }

/* fiyat çarkı: her hane ayrı ayrı yukarı/aşağı ile ayarlanır */
.fiyat-gosterim{
  font-family:'Playfair Display',serif; font-weight:800; font-size:30px; color:var(--altin);
  text-align:center; margin-bottom:14px;
}
.fiyat-cark{ display:flex; justify-content:center; gap:2px; flex-wrap:wrap; margin-bottom:16px; }
.hane{ display:flex; flex-direction:column; align-items:center; gap:2px; }
.hane.virgul-sonrasi{ margin-right:8px; }
.hane-yukari, .hane-asagi{
  width:26px; height:18px; border:1px solid var(--cizgi); background:var(--kart); color:var(--soluk);
  border-radius:4px; font-size:9px; line-height:1; cursor:pointer; padding:0;
}
.hane-yukari:hover, .hane-asagi:hover{ border-color:var(--altin); color:var(--murekkep); }
.hane-basamak{
  width:26px; text-align:center; font-family:'Playfair Display',serif; font-weight:700; font-size:17px;
  color:var(--murekkep); background:var(--kagit); border:1px solid var(--cizgi); border-radius:4px; padding:3px 0;
}

#sonucKutu{
  display:none; margin-top:20px; background:var(--kart); border:1px solid var(--cizgi);
  border-left:4px solid var(--altin); border-radius:0 12px 12px 0;
  padding:18px 20px; animation:bel .3s ease;
}
@media(prefers-reduced-motion:reduce){ #sonucKutu{ animation:none; } }
@keyframes bel{ from{opacity:0;transform:translateY(6px)} to{opacity:1;transform:none} }
@keyframes patla{ 0%{transform:scale(.7); opacity:0} 60%{transform:scale(1.08); opacity:1} 100%{transform:scale(1)} }
@media(prefers-reduced-motion:reduce){ #sonucKutu .seviye{ animation:none !important; } }
#sonucKutu .tablo-adi-etiket{
  font-family:'Libre Baskerville',serif; font-style:italic; font-size:13.5px; color:var(--soluk); margin-bottom:6px;
}
#sonucKutu .seviye{
  font-family:'Playfair Display',serif; font-weight:800; font-size:24px; letter-spacing:.02em;
  animation:patla .5s ease;
}
#sonucKutu .seviye.yuksek{ color:var(--dogru); }
#sonucKutu .seviye.orta{ color:var(--turuncu); }
#sonucKutu .seviye.dusuk{ color:var(--yanlis); }
#sonucKutu .fiyat-etiket{
  font-family:'Playfair Display',serif; font-weight:700; font-size:22px; color:var(--murekkep); margin-top:4px;
}
#sonucKutu .kaynak-satiri{ font-size:13px; color:var(--soluk); margin-top:4px; }
#sonucKutu .kaynak-satiri a{ color:var(--altin); }
#sonucKutu .puan-satiri{
  margin-top:14px; padding-top:12px; border-top:1px dashed var(--cizgi);
  font-family:'Libre Baskerville',serif; font-size:14px; color:var(--murekkep); display:flex; gap:16px; flex-wrap:wrap;
}
#sonucKutu .puan-satiri b{ font-family:'Playfair Display',serif; font-size:17px; color:var(--altin); }
#sonucKutu .toplam-satiri{
  font-family:'Playfair Display',serif; font-weight:800; font-size:20px; color:var(--murekkep); margin-top:6px;
}
#sonucKutu .toplam-satiri b{ color:var(--altin); font-size:26px; }

footer{
  margin-top:60px; color:var(--soluk); font-size:12.5px; border-top:1px solid var(--cizgi);
  padding-top:14px; text-align:center; line-height:1.7;
}
</style>
</head>
<body>
<div id="navYer"></div>
<div class="sarmal">

  <div class="ust">
    <a class="eve-don" href="../">veranda</a>
    <div class="ust-sag">
      <button class="ikonbtn" id="girisDug" type="button">Google ile giriş</button>
      <button class="ikonbtn" id="temaBtn" type="button" aria-label="gündüz / gece">gece</button>
    </div>
  </div>

  <header class="marka">
    <svg class="amblem" viewBox="0 0 64 64" aria-hidden="true">
      <rect x="14" y="10" width="36" height="28" rx="2" fill="none" stroke="var(--altin)" stroke-width="3"/>
      <circle cx="32" cy="24" r="6" fill="var(--kirmizi)"/>
      <path d="M14 46 H50" stroke="var(--altin)" stroke-width="3" stroke-linecap="round"/>
      <path d="M22 46 L22 52 M42 46 L42 52" stroke="var(--altin)" stroke-width="3" stroke-linecap="round"/>
    </svg>
    <h1>Muzayede</h1>
    <div class="tag">gerçek mi çakma mı, kaça satıldı, kimin eseri</div>
  </header>

  <main>
    <div class="levha">
      <div class="cerceve">
        <img id="tabloGorsel" alt="günün tablosu" src="">
      </div>
      <p class="plaka">günün tablosu</p>
    </div>

    <div id="adminKutu" style="display:none">
      <select id="adminSecici" aria-label="bulmaca seç (admin)"></select>
      <button class="ikonbtn" id="adminRastgeleBtn" type="button">rastgele</button>
    </div>

    <div id="gercekAsama">
      <p class="soru">bu, gerçek ve tanınmış bir eser mi; yoksa değersiz ya da çakma bir tablo mu?</p>
      <div class="gercek-secim">
        <button class="btn-ana" id="gercekBtn" type="button">gerçek eser</button>
        <button class="btn-ikincil" id="cakmaBtn" type="button">değersiz / çakma</button>
      </div>
      <p id="gercekMesaj"></p>
    </div>

    <div id="fiyatAsama" style="display:none">
      <p class="soru">bu tablo gerçekte kaç dolara satıldı?</p>
      <div class="fiyat-gosterim" id="fiyatGosterim">$0</div>
      <div class="fiyat-cark" id="fiyatCarki"></div>
      <button class="btn-ana" id="fiyatGonderBtn" type="button">tahmin et</button>
      <p id="fiyatMesaj"></p>
    </div>

    <div id="ressamAsama" style="display:none">
      <div class="giris-satiri">
        <input id="ressamGiris" type="text" placeholder="ressam adı" list="ressamListesi">
        <datalist id="ressamListesi"></datalist>
        <button class="btn-ana" id="ressamGonderBtn">tahmin et</button>
        <button class="btn-ikincil" id="pesEtBtn">pes et</button>
      </div>
      <p id="ipucuDurum"></p>
      <div id="ipucuAlanlari"></div>
      <p id="ressamMesaj"></p>
    </div>

    <div id="sonucKutu"></div>
  </main>

  <footer>Muzayede · veranda</footer>
</div>

<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>

<script src="./gunler.js"></script>
<script>
(function(){
  function temaKur(t){
    document.documentElement.setAttribute('data-tema', t);
    document.getElementById('temaBtn').textContent = t === 'gece' ? 'gündüz' : 'gece';
    try{ localStorage.setItem('muzayede:tema', t); }catch(e){}
  }
  let baslangicTema;
  try{ baslangicTema = localStorage.getItem('muzayede:tema'); }catch(e){}
  temaKur(baslangicTema === 'gece' ? 'gece' : 'gunduz');
  document.getElementById('temaBtn').addEventListener('click', () =>
    temaKur(document.documentElement.getAttribute('data-tema') === 'gece' ? 'gunduz' : 'gece'));
})();

(function(){
  const q = new URLSearchParams(location.search);
  const GOMULU = q.has('gomulu');
  const _METAB = q.has('meta') && q.has('bulmaca') ? parseInt(q.get('bulmaca'), 10) : null;

  function gunNo(){
    const ep = Date.parse(MUZAYEDE_GUNLER.epoch + 'T00:00:00');
    const now = new Date();
    const bugun = Date.UTC(now.getFullYear(), now.getMonth(), now.getDate());
    return Math.floor((bugun - ep) / 86400000);
  }
  const GUN = gunNo();

  function bugunTabloId(){
    const sira = MUZAYEDE_GUNLER.sira;
    const key = (_METAB !== null) ? _METAB : GUN;
    return sira[((key % sira.length) + sira.length) % sira.length];
  }

  let RESSAMLAR = [], TABLOLAR = [];

  function veriYukle(){
    return Promise.all([
      fetch('./data/ressamlar.json').then(r => r.json()),
      fetch('./data/tablolar.json').then(r => r.json())
    ]).then(([ressamlar, tablolar]) => {
      RESSAMLAR = ressamlar;
      TABLOLAR = tablolar;
      window.MUZ = { GUN, _METAB, GOMULU, RESSAMLAR, TABLOLAR, bugunTabloId };
      baslat();
    });
  }

  function baslat(){
    const tabloId = bugunTabloId();
    const tablo = TABLOLAR.find(t => t.id === tabloId);
    document.getElementById('tabloGorsel').src = tablo.gorsel;
    document.getElementById('tabloGorsel').alt = 'günün tablosu';
    window.MUZ.tablo = tablo;
    window.MUZ.ressam = RESSAMLAR.find(r => r.id === tablo.ressam_id);

    const geriYuklendi = yukle();
    if(!geriYuklendi){
      window.MUZ.state = varsayilanDurum();
    }

    document.getElementById('ressamListesi').innerHTML =
      RESSAMLAR.slice().sort((a, b) => a.isim.localeCompare(b.isim, 'tr'))
        .map(r => '<option value="' + r.isim + '"></option>').join('');

    document.getElementById('gercekBtn').addEventListener('click', () => gercekTahminYap(true));
    document.getElementById('cakmaBtn').addEventListener('click', () => gercekTahminYap(false));
    document.getElementById('ressamGonderBtn').addEventListener('click', ressamGonder);
    document.getElementById('ressamGiris').addEventListener('keydown', e => {
      if(e.key === 'Enter') ressamGonder();
    });
    document.getElementById('pesEtBtn').addEventListener('click', pesEt);
    document.getElementById('fiyatGonderBtn').addEventListener('click', fiyatGonder);

    fiyatCarkiCiz();
    ipucularinCiz();
    ipucuButonlariniGuncelle();
    adminSeciciDoldur();

    if(geriYuklendi) durumuUygula();
  }

  function bulmacayaGit(i){
    const q2 = new URLSearchParams(location.search);
    q2.set('meta', '1');
    q2.set('bulmaca', String(i));
    location.search = q2.toString();
  }

  function adminSeciciDoldur(){
    const sec = document.getElementById('adminSecici');
    const sira = MUZAYEDE_GUNLER.sira;
    // cevabı ele vermemek için seçenekler sadece sıra numarası gösterir,
    // ressam/tablo adı yazmaz
    sec.innerHTML = '<option value="">sonsuz mod: bulmaca seç</option>' +
      sira.map((id, i) => '<option value="' + i + '">bulmaca ' + (i + 1) + '</option>').join('');
    sec.value = (_METAB !== null) ? String(_METAB) : '';
    sec.addEventListener('change', () => {
      if(sec.value === '') return;
      bulmacayaGit(parseInt(sec.value, 10));
    });
    document.getElementById('adminRastgeleBtn').addEventListener('click', () => {
      const sira2 = MUZAYEDE_GUNLER.sira;
      let i;
      do{ i = Math.floor(Math.random() * sira2.length); }while(i === GUN % sira2.length && sira2.length > 1);
      bulmacayaGit(i);
    });
  }

  veriYukle();
})();

function varsayilanDurum(){
  return {
    gercekTahmin: null, gercekPuan: undefined,
    fiyatBasamaklari: [0, 0, 0, 0, 0, 0, 0, 0, 0], fiyatTahminEdildi: false, fiyatPuan: undefined,
    ressamBulundu: false, pesEdildi: false, hintCount: 0, hintsAcik: {}, ipucuKredi: 0, denenenler: [],
    toplamPuan: undefined
  };
}

const GERCEK_PUAN_DEGERI = 50;

function isimNormallestir(s){
  return s.toLocaleLowerCase('tr').trim()
    .replace(/[̇]/g, '')
    .normalize('NFD').replace(/[̀-ͯ]/g, '');
}

function gercekTahminYap(cevap){
  const st = window.MUZ.state;
  if(st.gercekTahmin !== null) return;
  st.gercekTahmin = cevap;
  const dogruMu = cevap === window.MUZ.tablo.gercek;
  st.gercekPuan = dogruMu ? GERCEK_PUAN_DEGERI : 0;

  const msg = document.getElementById('gercekMesaj');
  document.getElementById('gercekBtn').disabled = true;
  document.getElementById('cakmaBtn').disabled = true;

  if(window.MUZ.tablo.gercek){
    msg.textContent = dogruMu ? 'doğru, bu gerçek ve tanınmış bir eser.' : 'yanılmışsın, bu gerçek ve tanınmış bir eser.';
    msg.className = dogruMu ? 'dogru' : '';
    fiyatAsamasiniAc();
  } else {
    msg.textContent = dogruMu ? 'doğru, bu değersiz/çakma bir tablo.' : 'yanılmışsın, bu değersiz/çakma bir tablo.';
    msg.className = dogruMu ? 'dogru' : '';
    turuSonlandirCakma();
  }
  kaydet();
}

function fiyatCarkiCiz(){
  const alan = document.getElementById('fiyatCarki');
  alan.innerHTML = '';
  const n = window.MUZ.state.fiyatBasamaklari.length;
  for(let i = 0; i < n; i++){
    const hane = document.createElement('div');
    hane.className = 'hane';
    if(i < n - 1 && (i + 1) % 3 === 0) hane.classList.add('virgul-sonrasi');
    hane.innerHTML =
      '<button type="button" class="hane-yukari" data-i="' + i + '" aria-label="basamağı artır">&#9650;</button>' +
      '<span class="hane-basamak" data-i="' + i + '">' + window.MUZ.state.fiyatBasamaklari[i] + '</span>' +
      '<button type="button" class="hane-asagi" data-i="' + i + '" aria-label="basamağı azalt">&#9660;</button>';
    alan.appendChild(hane);
  }
  alan.querySelectorAll('.hane-yukari').forEach(b => b.addEventListener('click', () => haneDegistir(+b.dataset.i, 1)));
  alan.querySelectorAll('.hane-asagi').forEach(b => b.addEventListener('click', () => haneDegistir(+b.dataset.i, -1)));
  fiyatGosterimGuncelle();
}

function haneDegistir(i, yon){
  if(window.MUZ.state.fiyatTahminEdildi) return;
  const basamaklar = window.MUZ.state.fiyatBasamaklari;
  basamaklar[i] = (basamaklar[i] + yon + 10) % 10;
  document.querySelector('.hane-basamak[data-i="' + i + '"]').textContent = basamaklar[i];
  fiyatGosterimGuncelle();
  kaydet();
}

function fiyatDegeriOku(){
  return parseInt(window.MUZ.state.fiyatBasamaklari.join(''), 10);
}

function fiyatGosterimGuncelle(){
  document.getElementById('fiyatGosterim').textContent = '$' + fiyatDegeriOku().toLocaleString('en-US');
}

function fiyatPuanHesapla(tahmin, gercek){
  if(tahmin <= 0 || gercek <= 0) return 0;
  const fark = Math.abs(Math.log10(tahmin) - Math.log10(gercek));
  return Math.max(0, Math.round(100 * (1 - fark)));
}

function fiyatAsamasiniAc(){
  document.getElementById('fiyatAsama').style.display = '';
}

function fiyatGonder(){
  const st = window.MUZ.state;
  if(st.fiyatTahminEdildi) return;
  const tahmin = fiyatDegeriOku();
  if(!(tahmin > 0)){
    document.getElementById('fiyatMesaj').textContent = 'önce hanelerden bir tutar seç';
    return;
  }
  const gercek = window.MUZ.tablo.fiyat_usd;
  st.fiyatPuan = fiyatPuanHesapla(tahmin, gercek);
  st.fiyatTahminEdildi = true;

  document.querySelectorAll('.hane-yukari,.hane-asagi').forEach(el => el.disabled = true);
  document.getElementById('fiyatGonderBtn').disabled = true;
  document.getElementById('fiyatMesaj').textContent =
    'gerçek fiyat: $' + gercek.toLocaleString('en-US') + ' (fiyat puanı: ' + st.fiyatPuan + ')';
  document.getElementById('fiyatMesaj').className = st.fiyatPuan >= 60 ? 'dogru' : '';

  ressamAsamasiniAc();
  kaydet();
}

function ressamAsamasiniAc(){
  document.getElementById('ressamAsama').style.display = '';
}

function ressamGonder(){
  const st = window.MUZ.state;
  if(st.ressamBulundu || st.pesEdildi) return;
  pesOnayiSifirla();
  const girisEl = document.getElementById('ressamGiris');
  const giris = girisEl.value;
  const dogru = window.MUZ.ressam.isim;
  const msg = document.getElementById('ressamMesaj');
  if(!giris.trim()){
    msg.textContent = 'önce bir isim yaz';
    msg.className = '';
    return;
  }
  if(isimNormallestir(giris) === isimNormallestir(dogru)){
    st.ressamBulundu = true;
    msg.textContent = 'doğru: ' + dogru;
    msg.className = 'dogru';
    document.getElementById('ressamAsama').querySelectorAll('input,button').forEach(el => el.disabled = true);
    ipucuButonlariniGuncelle();
    turuSonlandir();
    kaydet();
  } else {
    const n = isimNormallestir(giris);
    if(!st.denenenler) st.denenenler = [];
    if(st.denenenler.indexOf(n) !== -1){
      msg.textContent = 'bunu zaten denedin';
    } else {
      st.denenenler.push(n);
      if(st.hintCount + st.ipucuKredi < IPUCU_KATEGORILERI.length){
        st.ipucuKredi++;
        msg.textContent = 'yanlış, bir ipucu hakkı kazandın';
      } else {
        msg.textContent = 'yanlış, tekrar dene';
      }
      ipucuButonlariniGuncelle();
      kaydet();
    }
    msg.className = 'yanlis';
    msg.classList.remove('yanlis'); void msg.offsetWidth; msg.classList.add('yanlis');
    girisEl.select();
  }
}

let pesOnay = false;
function pesOnayiSifirla(){
  pesOnay = false;
  const b = document.getElementById('pesEtBtn');
  if(b) b.textContent = 'pes et';
}

function pesEt(){
  const st = window.MUZ.state;
  if(st.ressamBulundu || st.pesEdildi) return;
  if(!pesOnay){
    pesOnay = true;
    document.getElementById('pesEtBtn').textContent = 'emin misin?';
    return;
  }
  pesOnayiSifirla();
  st.pesEdildi = true;
  const msg = document.getElementById('ressamMesaj');
  msg.textContent = 'doğru: ' + window.MUZ.ressam.isim;
  msg.className = '';
  document.getElementById('ressamAsama').querySelectorAll('input,button').forEach(el => el.disabled = true);
  ipucuButonlariniGuncelle();
  turuSonlandir();
  kaydet();
}

const IPUCU_KATEGORILERI = [
  { id: 'donem', etiket: 'dönem', metin: r => (Math.floor(parseInt(r.dogum_olum.split('-')[0], 10) / 100) + 1) + '. yüzyıl civarı' },
  { id: 'ulke', etiket: 'ülke', metin: r => r.ulke },
  { id: 'akim', etiket: 'sanat akımı', metin: r => r.akim },
  { id: 'tablo', etiket: 'tablo adı + baş harf', metin: (r, t) => t.tablo_adi + ' (' + t.tablo_yili + ') - ' + r.isim[0] + '.' }
];

function ipucularinCiz(){
  const alan = document.getElementById('ipucuAlanlari');
  alan.innerHTML = '';
  IPUCU_KATEGORILERI.forEach(k => {
    const b = document.createElement('button');
    b.className = 'ipucu-btn';
    b.textContent = 'ipucu: ' + k.etiket;
    b.dataset.kategori = k.id;
    b.addEventListener('click', () => ipucuAc(k.id));
    alan.appendChild(b);
  });
}

function ipucuAc(kategoriId){
  const st = window.MUZ.state;
  if(st.ressamBulundu || st.pesEdildi) return;
  if(st.hintsAcik[kategoriId]) return;
  if(st.ipucuKredi <= 0) return;
  st.ipucuKredi--;
  st.hintsAcik[kategoriId] = true;
  st.hintCount++;
  ipucuGoster(kategoriId);
  ipucuButonlariniGuncelle();
  kaydet();
}

function ipucuButonlariniGuncelle(){
  const st = window.MUZ.state;
  const bitti = st.ressamBulundu || st.pesEdildi;
  const alan = document.getElementById('ipucuAlanlari');
  alan.dataset.kredi = (!bitti && st.ipucuKredi > 0) ? '1' : '0';
  document.querySelectorAll('.ipucu-btn').forEach(b => {
    if(b.dataset.acik === '1') return;
    const kilitli = bitti || st.ipucuKredi <= 0;
    b.disabled = kilitli;
    b.title = (kilitli && !bitti) ? 'kilitli, bir yanlış tahmin gerek' : '';
  });
  const durum = document.getElementById('ipucuDurum');
  if(bitti){
    durum.textContent = '';
  } else if(st.ipucuKredi > 0){
    durum.textContent = st.ipucuKredi === 1
      ? 'bir ipucu hakkın var, birini seç'
      : st.ipucuKredi + ' ipucu hakkın var, seç';
  } else if(st.hintCount === 0){
    durum.textContent = 'ipuçları kilitli, her yanlış tahmin bir ipucu hakkı verir';
  } else if(st.hintCount >= IPUCU_KATEGORILERI.length){
    durum.textContent = 'tüm ipuçları açık';
  } else {
    durum.textContent = 'yeni ipucu için bir tahmin daha gerek';
  }
}

function ipucuGoster(kategoriId){
  const k = IPUCU_KATEGORILERI.find(x => x.id === kategoriId);
  const btn = document.querySelector('.ipucu-btn[data-kategori="' + kategoriId + '"]');
  btn.dataset.acik = '1';
  btn.textContent = k.etiket + ': ' + k.metin(window.MUZ.ressam, window.MUZ.tablo);
}

function ressamPuanHesapla(){
  if(!window.MUZ.state.ressamBulundu) return 0;
  return Math.max(0, 100 - 25 * window.MUZ.state.hintCount);
}

function puanSeviyesi(toplam, maxToplam){
  const oran = toplam / maxToplam;
  if(oran >= 0.85) return { sinif: 'yuksek', metin: 'MÜKEMMEL TAKDİR' };
  if(oran >= 0.6) return { sinif: 'yuksek', metin: 'İYİ GÖZ' };
  if(oran >= 0.35) return { sinif: 'orta', metin: 'FENA DEĞİL' };
  return { sinif: 'dusuk', metin: 'ACEMİ İŞİ' };
}

function sayacAnimasyonu(el, hedef){
  const azaltilmisHareket = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  if(azaltilmisHareket || hedef === 0){
    el.textContent = hedef;
    return;
  }
  const adim = 18;
  let i = 0;
  const zamanlayici = setInterval(() => {
    i++;
    el.textContent = Math.round((hedef * i) / adim);
    if(i >= adim){
      el.textContent = hedef;
      clearInterval(zamanlayici);
    }
  }, 22);
}

function turuSonlandirCakma(){
  const st = window.MUZ.state;
  const tablo = window.MUZ.tablo;
  const sonuc = document.getElementById('sonucKutu');
  sonuc.style.display = 'block';
  const seviye = puanSeviyesi(st.gercekPuan, GERCEK_PUAN_DEGERI);
  sonuc.innerHTML =
    '<div class="tablo-adi-etiket">' + tablo.tablo_adi + ' (' + tablo.tablo_yili + '), çakma/değersiz bir eser</div>' +
    '<div class="seviye ' + seviye.sinif + '">' + seviye.metin + '</div>' +
    '<div class="fiyat-etiket">gerçek değeri: $' + tablo.fiyat_usd.toLocaleString('en-US') + '</div>' +
    '<div class="kaynak-satiri">' + tablo.muzayede_evi + ', ' + tablo.satis_yili +
    ' · <a href="' + tablo.kaynak_url + '" target="_blank" rel="noopener">kaynak</a></div>' +
    '<div class="toplam-satiri">toplam <b id="sayacToplam">0</b></div>';
  sayacAnimasyonu(document.getElementById('sayacToplam'), st.gercekPuan);
  st.toplamPuan = st.gercekPuan;
  kaydet();
}

function turuSonlandir(){
  const st = window.MUZ.state;
  const tablo = window.MUZ.tablo;
  const ressamPuan = ressamPuanHesapla();
  const toplam = st.gercekPuan + st.fiyatPuan + ressamPuan;
  const maxToplam = GERCEK_PUAN_DEGERI + 100 + 100;

  const sonuc = document.getElementById('sonucKutu');
  sonuc.style.display = 'block';
  const seviye = puanSeviyesi(toplam, maxToplam);
  sonuc.innerHTML =
    '<div class="tablo-adi-etiket">' + tablo.tablo_adi + ' (' + tablo.tablo_yili + ')</div>' +
    '<div class="seviye ' + seviye.sinif + '">' + seviye.metin + '</div>' +
    '<div class="fiyat-etiket">$' + tablo.fiyat_usd.toLocaleString('en-US') + '</div>' +
    '<div class="kaynak-satiri">' + tablo.muzayede_evi + ', ' + tablo.satis_yili +
    ' · <a href="' + tablo.kaynak_url + '" target="_blank" rel="noopener">kaynak</a></div>' +
    '<div class="puan-satiri"><span>gerçek/çakma <b>' + st.gercekPuan + '</b></span>' +
    '<span>fiyat <b>' + st.fiyatPuan + '</b></span>' +
    '<span>ressam <b>' + ressamPuan + '</b></span></div>' +
    '<div class="toplam-satiri">toplam <b id="sayacToplam">0</b> / ' + maxToplam + '</div>';
  sayacAnimasyonu(document.getElementById('sayacToplam'), toplam);

  st.toplamPuan = toplam;
  kaydet();
}

function kaydet(){
  if(window.MUZ.GOMULU) return;
  if(window.MUZ._METAB !== null) return;
  try{
    localStorage.setItem('muzayede:gun', JSON.stringify({
      gun: window.MUZ.GUN, tabloId: window.MUZ.tablo.id, state: window.MUZ.state
    }));
  }catch(e){}
}

function yukle(){
  if(window.MUZ.GOMULU) return false;
  if(window.MUZ._METAB !== null) return false;
  try{
    const v = JSON.parse(localStorage.getItem('muzayede:gun'));
    if(!v || v.gun !== window.MUZ.GUN || v.tabloId !== window.MUZ.tablo.id) return false;
    const varsayilan = varsayilanDurum();
    window.MUZ.state = Object.assign(varsayilan, v.state);
    if(!Array.isArray(window.MUZ.state.fiyatBasamaklari) || window.MUZ.state.fiyatBasamaklari.length !== 9){
      window.MUZ.state.fiyatBasamaklari = varsayilan.fiyatBasamaklari;
    }
    return true;
  }catch(e){ return false; }
}

function durumuUygula(){
  const st = window.MUZ.state;

  if(st.gercekTahmin !== null){
    document.getElementById('gercekBtn').disabled = true;
    document.getElementById('cakmaBtn').disabled = true;
    const dogruMu = st.gercekTahmin === window.MUZ.tablo.gercek;
    const msg = document.getElementById('gercekMesaj');
    if(window.MUZ.tablo.gercek){
      msg.textContent = dogruMu ? 'doğru, bu gerçek ve tanınmış bir eser.' : 'yanılmışsın, bu gerçek ve tanınmış bir eser.';
    } else {
      msg.textContent = dogruMu ? 'doğru, bu değersiz/çakma bir tablo.' : 'yanılmışsın, bu değersiz/çakma bir tablo.';
    }
    msg.className = dogruMu ? 'dogru' : '';
  }

  if(!window.MUZ.tablo.gercek){
    if(st.gercekTahmin !== null) turuSonlandirCakma();
    return;
  }

  if(st.gercekTahmin !== null) fiyatAsamasiniAc();

  if(st.fiyatTahminEdildi){
    document.querySelectorAll('.hane-yukari,.hane-asagi').forEach(el => el.disabled = true);
    document.getElementById('fiyatGonderBtn').disabled = true;
    document.getElementById('fiyatMesaj').textContent =
      'gerçek fiyat: $' + window.MUZ.tablo.fiyat_usd.toLocaleString('en-US') + ' (fiyat puanı: ' + st.fiyatPuan + ')';
    document.getElementById('fiyatMesaj').className = st.fiyatPuan >= 60 ? 'dogru' : '';
    ressamAsamasiniAc();
  }

  Object.keys(st.hintsAcik).forEach(kategoriId => {
    if(st.hintsAcik[kategoriId]) ipucuGoster(kategoriId);
  });
  ipucuButonlariniGuncelle();

  if(st.ressamBulundu || st.pesEdildi){
    const msg = document.getElementById('ressamMesaj');
    msg.textContent = 'doğru: ' + window.MUZ.ressam.isim;
    msg.className = st.ressamBulundu ? 'dogru' : '';
    document.getElementById('ressamAsama').querySelectorAll('input,button').forEach(el => el.disabled = true);
  }

  if(st.toplamPuan !== undefined) turuSonlandir();
}
