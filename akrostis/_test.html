<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<title>akrostiş test</title>
</head>
<body>
<pre id="cikti">çalışıyor…</pre>
<script src="../ortak/akrostis-kafiye.js"></script>
<script src="../ortak/akrostis-uret.js"></script>
<script>
const sonuclar = [];
function esit(ad, gercek, beklenen){
  const ok = JSON.stringify(gercek) === JSON.stringify(beklenen);
  sonuclar.push((ok ? 'PASS ' : 'FAIL ') + ad + ' -> gercek:' + JSON.stringify(gercek) + ' beklenen:' + JSON.stringify(beklenen));
}
function dogru(ad, kosul){
  sonuclar.push((kosul ? 'PASS ' : 'FAIL ') + ad);
}

try {
  esit('pozisyonTuruBelirle(1)', AkrostisUret.pozisyonTuruBelirle(1), ['kapanis']);
  esit('pozisyonTuruBelirle(2)', AkrostisUret.pozisyonTuruBelirle(2), ['kapanis','kapanis']);
  esit('pozisyonTuruBelirle(3)', AkrostisUret.pozisyonTuruBelirle(3), ['genel','kapanis','kapanis']);
  esit('pozisyonTuruBelirle(4)', AkrostisUret.pozisyonTuruBelirle(4), ['genel','genel','kapanis','kapanis']);
  esit('pozisyonTuruBelirle(6)', AkrostisUret.pozisyonTuruBelirle(6), ['genel','genel','genel','gecis','kapanis','kapanis']);
  esit('pozisyonTuruBelirle(8)', AkrostisUret.pozisyonTuruBelirle(8), ['genel','genel','genel','gecis','genel','genel','kapanis','kapanis']);
  esit('pozisyonTuruBelirle(12)', AkrostisUret.pozisyonTuruBelirle(12), ['genel','genel','genel','gecis','genel','genel','genel','gecis','genel','genel','kapanis','kapanis']);
} catch(e){ sonuclar.push('FAIL pozisyonTuruBelirle hata: ' + e.message); }

try {
  esit('kelimeSinirlariBul tek kelime', AkrostisUret.kelimeSinirlariBul('Ali'), []);
  esit('kelimeSinirlariBul iki kelime', AkrostisUret.kelimeSinirlariBul('Ali Veli'), [3]);
  esit('kelimeSinirlariBul fazla bosluk', AkrostisUret.kelimeSinirlariBul('Ali   Veli  Can'), [3, 7]);
  esit('kelimeSinirlariBul harfsiz kelime atlanir', AkrostisUret.kelimeSinirlariBul('123 Ali'), []);
  esit('kelimeSinirlariBul bos girdi', AkrostisUret.kelimeSinirlariBul(''), []);
} catch(e){ sonuclar.push('FAIL kelimeSinirlariBul hata: ' + e.message); }

try {
  // GENEL/KAPANIS/GECIS uc katmanli fixture; ABABAB (6 harf) uzerinden
  // genel-genel, genel-gecis (karisik), kapanis-kapanis eslesmelerini test eder.
  const GENEL = {
    A: ['Akşam ışığı sessizce söner', 'Ay parlak ama uzakta kalır'],
    B: ['Bahar geldi yeniden bugün']
  };
  const KAPANIS = {
    A: ['Artık sözler bitti burada'],
    B: ['Böylece huzur buldu yürek']
  };
  const GECIS = {
    B: ['Bir de rüzgar yön değiştirdi']
  };
  const KUME = {genel: GENEL, kapanis: KAPANIS, gecis: GECIS};

  const siir1 = AkrostisUret.uretSiir('ABABAB', KUME);
  esit('ABABAB dize sayisi', siir1.dizeler.length, 6);
  dogru('pos0/pos2 farkli genel A dizesi', siir1.dizeler[0].metin !== siir1.dizeler[2].metin);
  dogru('pos0 GENEL.A havuzundan', GENEL.A.includes(siir1.dizeler[0].metin));
  dogru('pos2 GENEL.A havuzundan', GENEL.A.includes(siir1.dizeler[2].metin));
  esit('pos1 genel B', siir1.dizeler[1].metin, 'Bahar geldi yeniden bugün');
  esit('pos3 gecis B', siir1.dizeler[3].metin, 'Bir de rüzgar yön değiştirdi');
  esit('pos4 kapanis A', siir1.dizeler[4].metin, 'Artık sözler bitti burada');
  esit('pos5 kapanis B', siir1.dizeler[5].metin, 'Böylece huzur buldu yürek');

  // Bos katman (kapanis'ta A yok) genele dusmeli.
  const GENEL2 = {A: ['Akşam ışığı sessizce söner', 'Ay parlak ama uzakta kalır']};
  const siir2 = AkrostisUret.uretSiir('AA', {genel: GENEL2, kapanis: {}, gecis: {}});
  esit('AA dize sayisi', siir2.dizeler.length, 2);
  dogru('AA pos0 genele dustu', GENEL2.A.includes(siir2.dizeler[0].metin));
  dogru('AA pos1 genele dustu', GENEL2.A.includes(siir2.dizeler[1].metin));
  dogru('AA farkli dizeler', siir2.dizeler[0].metin !== siir2.dizeler[1].metin);
} catch(e){ sonuclar.push('FAIL uretSiir tur-secimi hata: ' + e.message); }

document.getElementById('cikti').textContent = sonuclar.join('\n');
console.log(sonuclar.join('\n'));
console.log('TOPLAM:', sonuclar.filter(s=>s.startsWith('FAIL')).length, 'FAIL /', sonuclar.length);
</script>
</body>
</html>
