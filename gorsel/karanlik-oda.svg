<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 410" width="800" height="410">
  <defs>
    <linearGradient id="kagit3" x1="0" y1="0" x2="0.25" y2="1">
      <stop offset="0" stop-color="#F4EAD0"/>
      <stop offset="1" stop-color="#E4D2AC"/>
    </linearGradient>
    <radialGradient id="lamba" cx="50%" cy="0%" r="80%">
      <stop offset="0" stop-color="#C2331F" stop-opacity="0.55"/>
      <stop offset="0.45" stop-color="#C2331F" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#C2331F" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="banyo1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2A2017"/>
      <stop offset="1" stop-color="#4A3A2A"/>
    </linearGradient>
    <linearGradient id="banyo2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3A2E20"/>
      <stop offset="0.6" stop-color="#6B5942"/>
      <stop offset="1" stop-color="#8A7458"/>
    </linearGradient>
    <radialGradient id="vinyet3" cx="48%" cy="42%" r="78%">
      <stop offset="0.55" stop-color="#000" stop-opacity="0"/>
      <stop offset="1" stop-color="#3A2A14" stop-opacity="0.24"/>
    </radialGradient>
    <filter id="kumas3" x="-2%" y="-2%" width="104%" height="104%">
      <feTurbulence type="fractalNoise" baseFrequency="0.014 0.02" numOctaves="2" seed="23" result="n"/>
      <feColorMatrix in="n" type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.06"/></feComponentTransfer>
      <feComposite operator="over" in2="SourceGraphic"/>
    </filter>
  </defs>

  <rect width="800" height="410" fill="url(#kagit3)"/>
  <rect width="800" height="410" fill="url(#kagit3)" filter="url(#kumas3)" opacity="0.9"/>

  <!-- kırmızı emniyet lambası -->
  <rect x="368" y="18" width="64" height="14" rx="7" fill="#4A3A2A"/>
  <path d="M382,32 Q400,58 418,32 Z" fill="#C2331F"/>
  <ellipse cx="400" cy="40" rx="330" ry="230" fill="url(#lamba)"/>

  <!-- gergin ip -->
  <path d="M60,96 Q400,132 740,96" fill="none" stroke="#5A4632" stroke-width="5" stroke-linecap="round"/>

  <!-- asılı fotoğraflar: soldan sağa banyo ilerliyor -->
  <g transform="rotate(-4 190 220)">
    <rect x="182" y="104" width="7" height="26" rx="3" fill="#6B5942"/>
    <rect x="120" y="126" width="140" height="180" rx="3" fill="#F4EAD0"/>
    <rect x="130" y="136" width="120" height="146" fill="url(#banyo1)"/>
  </g>
  <g transform="rotate(2 400 240)">
    <rect x="396" y="116" width="7" height="26" rx="3" fill="#6B5942"/>
    <rect x="330" y="138" width="140" height="180" rx="3" fill="#F4EAD0"/>
    <rect x="340" y="148" width="120" height="146" fill="url(#banyo2)"/>
    <circle cx="378" cy="204" r="17" fill="#2A2017" opacity="0.55"/>
    <path d="M340,268 L376,232 L404,258 L426,238 L460,270 L460,294 L340,294 Z" fill="#2A2017" opacity="0.5"/>
  </g>
  <g transform="rotate(-2 610 220)">
    <rect x="606" y="102" width="7" height="26" rx="3" fill="#6B5942"/>
    <rect x="540" y="124" width="140" height="180" rx="3" fill="#F4EAD0"/>
    <rect x="550" y="134" width="120" height="146" fill="#E4D2AC"/>
    <circle cx="588" cy="188" r="16" fill="#4A3A2A"/>
    <path d="M550,252 L586,216 L614,242 L636,222 L670,254 L670,280 L550,280 Z" fill="#5A4632"/>
    <path d="M550,134 h120 v146 h-120 Z" fill="#C2331F" opacity="0.10"/>
  </g>

  <!-- banyo küveti -->
  <rect x="286" y="352" width="228" height="34" rx="6" fill="#5A4632"/>
  <rect x="294" y="348" width="212" height="12" rx="5" fill="#2A2017"/>

  <rect width="800" height="410" fill="url(#vinyet3)"/>
</svg>
