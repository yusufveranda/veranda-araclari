<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 410" width="800" height="410">
  <defs>
    <linearGradient id="kagit2" x1="0" y1="0" x2="0.25" y2="1">
      <stop offset="0" stop-color="#F4EAD0"/>
      <stop offset="1" stop-color="#E4D2AC"/>
    </linearGradient>
    <radialGradient id="kor" cx="50%" cy="78%" r="55%">
      <stop offset="0" stop-color="#FBD877" stop-opacity="0.95"/>
      <stop offset="0.4" stop-color="#E8862C" stop-opacity="0.75"/>
      <stop offset="0.75" stop-color="#C2331F" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#C2331F" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="vinyet2" cx="48%" cy="42%" r="78%">
      <stop offset="0.55" stop-color="#000" stop-opacity="0"/>
      <stop offset="1" stop-color="#3A2A14" stop-opacity="0.24"/>
    </radialGradient>
    <filter id="kumas2" x="-2%" y="-2%" width="104%" height="104%">
      <feTurbulence type="fractalNoise" baseFrequency="0.014 0.02" numOctaves="2" seed="11" result="n"/>
      <feColorMatrix in="n" type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.06"/></feComponentTransfer>
      <feComposite operator="over" in2="SourceGraphic"/>
    </filter>
  </defs>

  <rect width="800" height="410" fill="url(#kagit2)"/>
  <rect width="800" height="410" fill="url(#kagit2)" filter="url(#kumas2)" opacity="0.9"/>

  <!-- şömine çerçevesi -->
  <path d="M243,360 L243,196 Q243,92 400,92 Q557,92 557,196 L557,360"
        fill="none" stroke="#6B5942" stroke-width="20" stroke-linecap="round"/>
  <rect x="206" y="64" width="388" height="28" rx="5" fill="#5A4632"/>
  <rect x="206" y="64" width="388" height="6" rx="3" fill="#6E5640"/>
  <rect x="196" y="356" width="408" height="18" rx="4" fill="#4A3A2A"/>

  <!-- ocak iç karanlığı -->
  <path d="M262,358 L262,200 Q262,112 400,112 Q538,112 538,200 L538,358 Z" fill="#1B1510"/>

  <!-- köz ışığı -->
  <ellipse cx="400" cy="320" rx="150" ry="120" fill="url(#kor)"/>

  <!-- kütükler -->
  <g>
    <rect x="306" y="330" width="188" height="20" rx="10" fill="#2A2017" transform="rotate(-7 400 340)"/>
    <rect x="306" y="342" width="188" height="20" rx="10" fill="#332619" transform="rotate(6 400 352)"/>
    <circle cx="312" cy="336" r="6" fill="#E8862C" opacity="0.8" transform="rotate(-7 400 340)"/>
    <circle cx="490" cy="350" r="5" fill="#C2331F" opacity="0.8" transform="rotate(6 400 352)"/>
  </g>

  <!-- alevler (kırmızı → turuncu → altın) -->
  <path d="M400,338 C352,300 358,236 400,168 C442,236 448,300 400,338 Z" fill="#C2331F"/>
  <path d="M398,336 C364,304 368,256 400,206 C434,256 432,302 398,336 Z" fill="#E07B2E"/>
  <path d="M401,332 C380,310 382,278 402,242 C422,280 420,310 401,332 Z" fill="#F0C25A"/>
  <path d="M355,340 C330,318 334,286 356,256 C378,286 378,318 355,340 Z" fill="#E07B2E" opacity="0.92"/>
  <path d="M447,342 C428,324 430,298 448,272 C467,298 466,324 447,342 Z" fill="#D85B25" opacity="0.9"/>

  <rect width="800" height="410" fill="url(#vinyet2)"/>
</svg>
