<body>

<!-- ————— TANITIM (ilk girişte) ————— -->
<div class="modal-perde" id="girisPerde" hidden>
  <div class="modal" role="dialog" aria-modal="true" aria-label="Nasıl oynanır">
    <button class="modal-kapat" id="girisKapat" aria-label="kapat">✕</button>
    <div class="slayt-akis" id="slaytAkis"></div>
    <div class="slayt-nokta" id="slaytNokta"></div>
    <div class="slayt-alt">
      <button class="baglanti" id="slaytAtla">atla</button>
      <div class="slayt-yon">
        <button class="dugme sade" id="slaytGeri" hidden>geri</button>
        <button class="dugme" id="slaytIleri">ileri</button>
      </div>
    </div>
  </div>
</div>

<!-- ————— GÜN PANOSU ————— -->
<main class="pano" id="pano">
  <div class="ust">
    <a class="eve-don" href="../">veranda</a>
    <div class="ust-sag">
      <button class="ikonbtn" id="nasilBtn" type="button">nasıl oynanır</button>
      <button class="ikonbtn" id="temaBtn" type="button">gece</button>
      <button class="ikonbtn" id="rastgeleBtn" type="button" title="rastgele gün — sadece debug" hidden>🎲 rastgele</button>
    </div>
  </div>

  <header class="baslik">
    <div class="baslik-yaz">
      <h1>Takımyıldız</h1>
      <div class="tarih" id="tarih"></div>
    </div>
    <div class="gun-olcer" id="gunOlcer" title="günlük yıldızların"></div>
  </header>

  <p class="giris-not">Her biri ayrı bir alandan. Doğru cevaplar <b>yıldız</b> doldurur, yanlışlar <b>kalp</b> götürür — <b>6 yıldız</b> topla, günü kazan.</p>

  <div class="kartlar" id="kartlar"></div>

  <div class="kazandin" id="kazandin" hidden></div>

  <footer class="pano-alt">
    <div>Takımyıldız · veranda</div>
    <div class="ince">bulmacalar mevcut oyunlardan derlenir — her gün başka bir seçki</div>
  </footer>
</main>

<!-- ————— OYUN EKRANI (bulmacaya girince) ————— -->
<section class="oyun-ekran" id="oyunEkran" hidden>
  <div class="oyun-ust">
    <button class="geri-btn" id="geriBtn">← gün panosu</button>
    <div class="oyun-kimlik">
      <span class="oyun-ad" id="oyunAd"></span>
      <span class="oyun-alt" id="oyunAlt"></span>
    </div>
    <div class="oyun-durum">
      <span class="olcer yildiz-olcer" id="oyunYildiz"></span>
      <span class="olcer kalp-olcer" id="oyunKalp"></span>
    </div>
  </div>
  <div class="oyun-kural" id="oyunKural"></div>
  <div class="oyun-kap" id="oyunKap"></div>
</section>

<!-- ————— KAZANDIN bildirimi ————— -->
<div class="modal-perde" id="kazanPerde" hidden>
  <div class="modal kazan-modal" role="dialog" aria-modal="true" aria-label="Günü kazandın">
    <div id="kazanIcerik"></div>
  </div>
</div>

<div id="toast"></div>

<script src="motor.js?v=16"></script>
