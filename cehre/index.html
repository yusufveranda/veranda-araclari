<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<script src="../ortak/analitik.js"></script>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Çehre: Ünlüyü yüzünden tanı</title>
<meta name="description" content="Sansürlü yüz kesitinden günün ünlüsünü çıkar. Yanlış tahminde yeni bir bölge açılır.">
<meta name="theme-color" content="#0c0a09">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Special+Elite&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box; margin:0; padding:0;}
  html{color-scheme:dark;}
  :root{
    --bg:#0c0a09; --card:#1a1614; --border:#2e2724;
    --paper:#efe9dc; --text:#ece7de; --muted:#94897c;
    --accent:#e2a13f; --ok:#7cb46b; --bad:#e5382e;
  }
  body{background:var(--bg); color:var(--text); font-family:"Inter",-apple-system,sans-serif;
    min-height:100dvh; padding:22px clamp(12px,3vw,44px) 90px;}
  .wrap{max-width:min(96vw, 1900px); margin:0 auto;}
  h1{font-family:"Special Elite",cursive; font-size:30px; color:var(--accent); margin-bottom:4px;}
  .tagline{font-size:13px; color:var(--muted); margin-bottom:22px;}
  .ust{display:flex; justify-content:space-between; align-items:flex-start; flex-wrap:wrap; gap:10px;}
  .ust-dugmeler{display:flex; gap:8px;}
  .mini-btn{background:var(--card); color:var(--text); border:1px solid var(--border); border-radius:6px;
    padding:8px 12px; font-size:13px; cursor:pointer;}
  .mini-btn:hover{border-color:var(--accent); color:var(--accent);}

  .oyun-alan{display:grid; grid-template-columns: minmax(320px, 600px) minmax(320px, 460px); gap:40px; align-items:start; margin-top:22px;}
  @media(max-width:760px){ .oyun-alan{grid-template-columns:1fr;} }

  /* Kesit kartı: fotoğraf normal boyutunda kalır, etrafı paspartu gibi dokulu bir
     zeminle doldurulur - görsel ekranı doldurmak için zorla büyütülmüyor. */
  .kesit-kart{
    background:
      radial-gradient(120% 140% at 30% 20%, rgba(226,161,63,0.07), transparent 60%),
      linear-gradient(160deg, #1e1a16, #14110e);
    border:1px solid var(--border); border-radius:10px;
    padding:clamp(20px,4vw,40px);
    display:flex; align-items:center; justify-content:center;
    min-height:420px;
    box-shadow: inset 0 0 60px rgba(0,0,0,.4);
  }
  /* Tüm kesitler aynı sabit oranla üretiliyor (yuz_kesit.py: PAY_SOL_SAG/PAY_UST/PAY_ALT
     katsayıları herkes için aynı) - kartın oranını buna sabitlemek, SVG maskesinin
     fotoğrafla piksel piksel örtüşmesini garantiliyor. */
  .kesit-buyuk{position:relative; width:min(100%, 420px); aspect-ratio:3.4/3.9; max-height:64vh;
    border:5px solid var(--paper); border-radius:4px; overflow:hidden; background:#000;
    box-shadow:0 14px 40px rgba(0,0,0,.6);}
  .kesit-buyuk img{width:100%; height:100%; object-fit:cover; display:block;}
  .kesit-buyuk svg{position:absolute; inset:0; width:100%; height:100%; display:block;}

  .bilgi-panel{display:flex; flex-direction:column; gap:16px; padding-top:6px;}
  .netlik-label{font-size:12px; color:var(--muted); letter-spacing:1px; text-transform:uppercase;}
  .netlik-dots{display:flex; gap:6px;}
  .netlik-dots i{width:26px; height:6px; border-radius:3px; background:var(--border); display:block;}
  .netlik-dots i.acik{background:var(--accent);}
  .can-dots{display:flex; gap:5px; font-size:18px; letter-spacing:2px;}

  .guess-row{display:flex; gap:8px; position:relative; flex-wrap:wrap;}
  .guess-row input{flex:1; min-width:180px; background:var(--card); border:1px solid var(--border); color:var(--text);
    border-radius:6px; padding:14px 16px; font-size:16px; outline:none;}
  .guess-row button{background:var(--accent); color:#1a1614; border:none; border-radius:6px;
    padding:0 22px; font-weight:600; cursor:pointer;}
  .guess-row button:disabled{opacity:.35; cursor:default;}
  .ac-list{position:absolute; top:56px; left:0; right:70px; background:var(--card);
    border:1px solid var(--border); border-radius:6px; max-height:260px; overflow-y:auto; z-index:5; display:none;}
  .ac-item{padding:10px 14px; cursor:pointer; font-size:14px;}
  .ac-item:hover, .ac-item.sel{background:var(--border);}

  .durum{font-size:14px; color:var(--muted); min-height:20px;}
  .durum.iyi{color:var(--ok);} .durum.kotu{color:var(--bad);}
  .puan{font-size:14px; color:var(--muted);}
  #shareBtn{align-self:flex-start; background:var(--card); color:var(--text); border:1px solid var(--border);
    border-radius:6px; padding:10px 18px; cursor:pointer; display:none;}
</style>
</head>
<body>
<div class="wrap">
  <header class="ust">
    <div>
      <h1>Çehre</h1>
      <p class="tagline">Yüz kesitinden günün ünlüsünü çıkar.</p>
    </div>
    <div class="ust-dugmeler">
      <button id="randomBtn" class="mini-btn" hidden>🎲 Rastgele</button>
      <button id="girisDug" class="mini-btn">Google ile giriş</button>
    </div>
  </header>

  <div class="oyun-alan">
    <div class="kesit-kart"><div class="kesit-buyuk" id="kesitBuyuk"></div></div>
    <div class="bilgi-panel">
      <div>
        <div class="netlik-label" id="netlikEtiket">1/3 bölge açık</div>
        <div class="netlik-dots" id="netlikDots"></div>
      </div>
      <div class="can-dots" id="canDots"></div>
      <div class="guess-row">
        <input type="text" id="guessInput" placeholder="İsim yaz…" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false">
        <button id="guessBtn" disabled>Tahmin</button>
        <button id="pesBtn" class="mini-btn">Pes et</button>
        <div class="ac-list" id="acList"></div>
      </div>
      <div class="durum" id="durum"></div>
      <div class="puan" id="puanAlan"></div>
      <button id="shareBtn">Paylaş</button>
    </div>
  </div>
</div>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
<script src="../ortak/firebase.js"></script>
<script src="puzzles.js"></script>
<script>
const $ = id => document.getElementById(id);
const esc = s => (s||"").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const EPOCH = new Date("2026-07-21T00:00:00");
const KISILER = window.CEHRE_KISILER || {};
const LISTE = window.CEHRE_LISTE || [];

function gunIndex(){
  const gun = Math.floor((Date.now() - EPOCH.getTime()) / 86400000);
  const n = LISTE.length;
  return n ? ((gun % n) + n) % n : 0;
}

function gununKisisi(){
  const qid = LISTE[gunIndex()];
  return {qid, ...KISILER[qid]};
}

// Admine özel sonsuz mod: rastgele bir kişi seçilince günün gerçek bulmacasının
// yerine geçici olarak bunu gösterir (kalıcı değil, sayfa yenilenince günün
// gerçek bulmacasına döner, localStorage'a yazılmaz).
let rastgele = null;
function aktifKisi(){
  return rastgele ? {qid: rastgele.qid, ...KISILER[rastgele.qid]} : gununKisisi();
}
function aktifDurum(){
  return rastgele ? rastgele.durum : state;
}
function pickRandom(){
  if (!LISTE.length) return;
  const simdiki = aktifKisi().qid;
  let qid;
  do { qid = LISTE[Math.floor(Math.random() * LISTE.length)]; }
  while (LISTE.length > 1 && qid === simdiki);
  rastgele = {qid, durum: bosDurum()};
  secilen = null;
  hideAc();
  renderPortre();
}

const PUAN = [100, 80, 60, 40, 25, 15];
const TUM_ISIMLER = Object.entries(KISILER).map(([qid, k]) => ({qid, isim: k.isim}));

const LS = "cehre_v1";
function loadSave(){ try{ return JSON.parse(localStorage.getItem(LS)) || {}; }catch(e){ return {}; } }
function persist(){
  if (rastgele) return;   // rastgele moddaki tahminler kalıcı olmaz
  const save = loadSave();
  save[gunIndex()] = {...state, qid: gununKisisi().qid};
  try{ localStorage.setItem(LS, JSON.stringify(save)); }catch(e){}
}
function state_yukle(){
  const save = loadSave();
  const kayit = save[gunIndex()];
  if (kayit && kayit.qid === gununKisisi().qid){
    const {qid, ...durum} = kayit;
    return durum;
  }
  return bosDurum();
}
let state = state_yukle();
function bosDurum(){ return {wrong: 0, solved: false, score: null, over: false}; }

// Kaç bölge açık: 0-1 yanlış -> yalnız burun, 2-3 -> +gözler, 4-5 -> +ağız (hepsi)
function bolgeSayisi(wrong){
  if (wrong >= 4) return 3;
  if (wrong >= 2) return 2;
  return 1;
}

// Pencere boyutları (yüzde, kesitin kendi genişlik/yüksekliğine göre) - burun dikey,
// gözler/ağız yatay. Konum (merkez) kişiye özel, kesitte kaydedilmiş yüzde-koordinat.
const PENCERE_BOYUT = {
  burun:  [16, 22],
  gozler: [46, 13],
  agiz:   [26, 13],
};

function pencereSvg(kisi, bolge){
  const organlar = ["burun", "gozler", "agiz"].slice(0, bolge);
  const delikler = organlar.map(organ => {
    const [cx, cy] = kisi.konum[organ];
    const [w, h] = PENCERE_BOYUT[organ];
    const x = Math.max(0, cx - w / 2), y = Math.max(0, cy - h / 2);
    return `<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="1.2" fill="black"/>`;
  }).join("");
  return `<svg viewBox="0 0 100 100" preserveAspectRatio="none">
    <defs><mask id="pm"><rect width="100" height="100" fill="white"/>${delikler}</mask></defs>
    <rect width="100" height="100" fill="#0c0a09" mask="url(#pm)"/>
  </svg>`;
}

function renderPortre(){
  const kisi = aktifKisi();
  const s = aktifDurum();
  const bolge = s.over ? 3 : bolgeSayisi(s.wrong);
  $("kesitBuyuk").innerHTML = `<img src="${kisi.g}" alt="yüz kesiti">` + pencereSvg(kisi, bolge);
  $("netlikEtiket").textContent = `${bolge}/3 bölge açık`;
  $("netlikDots").innerHTML = [1,2,3].map(i => `<i class="${i <= bolge ? "acik" : ""}"></i>`).join("");
  const kalanHak = PUAN.length - s.wrong;
  $("canDots").innerHTML = Array.from({length: PUAN.length}, (_,i) =>
    i < kalanHak ? "🤎" : "🖤").join("");
  $("guessInput").disabled = s.over;
  $("guessBtn").disabled = true;
  $("puanAlan").textContent = s.solved ? `Puanın: ${s.score}` : "";
  $("durum").textContent = "";
  $("durum").className = "durum";
  if (s.over && !s.solved) {
    $("durum").textContent = `Hakların bitti. Cevap: ${kisi.isim}`;
    $("durum").className = "durum kotu";
  }
  $("pesBtn").style.display = s.over ? "none" : "inline-block";
  shareGoster();
}

const fold = s => (s||"").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"");
let acResults = [], acIdx = -1;

function showAc(){
  const q = fold($("guessInput").value.trim());
  $("guessBtn").disabled = true;
  if (q.length < 2){ hideAc(); return; }
  const starts = [], contains = [];
  for (const p of TUM_ISIMLER){
    const t = fold(p.isim);
    if (t.startsWith(q)) starts.push(p);
    else if (t.includes(q)) contains.push(p);
    if (starts.length >= 8) break;
  }
  acResults = [...starts, ...contains].slice(0, 8);
  acIdx = -1;
  if (!acResults.length){ hideAc(); return; }
  $("acList").innerHTML = acResults.map((r,i) => `<div class="ac-item" data-i="${i}">${esc(r.isim)}</div>`).join("");
  $("acList").style.display = "block";
  $("acList").querySelectorAll(".ac-item").forEach(el =>
    el.addEventListener("click", () => choose(acResults[+el.dataset.i])));
}
function hideAc(){ $("acList").style.display = "none"; acResults = []; acIdx = -1; }
let secilen = null;
function choose(p){
  secilen = p;
  $("guessInput").value = p.isim;
  $("guessBtn").disabled = false;
  hideAc();
}

function bolgeEmoji(n){
  return ["🟥","🟨","🟩"].slice(0, n).join("") + "⬛".repeat(3 - n);
}
function shareText(){
  const bolge = state.solved ? bolgeSayisi(state.wrong) : 3;
  const puan = state.solved ? state.score : 0;
  return [
    `Çehre: Gün #${gunIndex() + 1}`,
    `${bolgeEmoji(bolge)} ${state.solved ? puan : "✗"}`,
  ].join("\n");
}
function tumuBitti(){
  return state.over;
}
function shareGoster(){
  $("shareBtn").style.display = tumuBitti() ? "inline-block" : "none";
}
$("shareBtn").addEventListener("click", async () => {
  try{ await navigator.clipboard.writeText(shareText()); $("shareBtn").textContent = "Kopyalandı ✓"; }
  catch(e){}
});

function submit(){
  const s = aktifDurum();
  if (s.over || !secilen) return;
  const kisi = aktifKisi();
  const secIsim = secilen.isim;
  let yanlisMesaj = null;
  if (secilen.qid === kisi.qid){
    s.solved = true; s.over = true; s.score = PUAN[s.wrong];
  } else {
    s.wrong++;
    if (s.wrong >= PUAN.length){
      s.over = true;
    } else {
      yanlisMesaj = `${secIsim} değil.`;
    }
  }
  secilen = null;
  $("guessInput").value = "";
  $("guessBtn").disabled = true;
  persist();
  shareGoster();
  renderPortre();
  if (s.solved){
    $("durum").textContent = `Doğru! ${kisi.isim}. ${s.score} puan.`;
    $("durum").className = "durum iyi";
  } else if (yanlisMesaj){
    $("durum").textContent = yanlisMesaj;
    $("durum").className = "durum kotu";
  }
}

$("guessInput").addEventListener("input", showAc);
$("guessBtn").addEventListener("click", submit);
$("guessInput").addEventListener("keydown", e => {
  if (e.key === "Enter" && !$("guessBtn").disabled) submit();
});

function pesEt(){
  const s = aktifDurum();
  if (s.over) return;
  s.over = true;
  persist();
  shareGoster();
  renderPortre();
}
$("pesBtn").addEventListener("click", pesEt);

$("randomBtn").addEventListener("click", pickRandom);

renderPortre();

/* ===================== admine özel: giriş + sonsuz mod ===================== */
const girisDug = $("girisDug");
girisDug.onclick = () => { if (window.VF && VF.kullanici) VF.cikisYap(); else if (window.VF) VF.girisYap().catch(e => console.error(e)); };
if (window.VF) VF.kullaniciDinle(u => {
  girisDug.textContent = u ? (u.ad + " · çıkış") : "Google ile giriş";
  if (VF.adminMi) $("randomBtn").hidden = false;
});
</script>
<script src="../ortak/nav-panel.js"></script>
</body>
</html>
