    b.textContent = lab; b.onclick = () => onSec(val, b);
    host.appendChild(b);
  });
}
function kurCiz(){
  cipler($('#kurKok'), PC_AD, v => kur.kok === v, v => { kur.kok = v; kurCiz(); kurOnizle(); });
  cipler($('#kurNitelik'), NITELIK, v => kur.nitelik === v, v => { kur.nitelik = v; kurCiz(); kurOnizle(); });
  cipler($('#kurYapi'), YAPI, v => kur.yapi === v, v => { kur.yapi = v; kurCiz(); kurOnizle(); });
  cipler($('#kurEk'), EK, v => kur.ek.has(v), v => { kur.ek.has(v) ? kur.ek.delete(v) : kur.ek.add(v); kurCiz(); kurOnizle(); }, true);
  kurOnizle();
}
function kurSembolDene(){
  // sembolü kur ve tonal'da geçerli bir varyant bul (sözlük değil; doğrulama)
  const adaylar = [];
  const base = kur.nitelik, yapi = kur.yapi, ek = [...kur.ek].join('');
  adaylar.push(kur.kok + base + yapi + ek);
  if (base === 'm' && yapi === 'maj7') adaylar.push(kur.kok + 'mM7' + ek, kur.kok + 'minMaj7' + ek);
  if (base === 'aug') adaylar.push(kur.kok + '+' + yapi + ek, kur.kok + 'aug' + yapi + ek);
  if (yapi === 'maj7') adaylar.push(kur.kok + base + 'M7' + ek);
  for (const a of adaylar){ const ch = Chord.get(a); if (!ch.empty && ch.notes.length) return { ok: true, symbol: ch.symbol || a, ch }; }
  return { ok: false };
}
function kurOnizle(){
  const r = kurSembolDene(), el = $('#kurSembol'), btn = $('#kurUygula');
  if (r.ok){ el.textContent = r.symbol; el.className = 'sembol'; btn.disabled = false; btn.dataset.symbol = r.symbol; }
  else { el.textContent = 'bu birleşim geçersiz'; el.className = 'sembol gecersiz'; btn.disabled = true; }
}
$('#kurUygula').onclick = e => { const s = e.target.dataset.symbol; if (s) akorUygula(s); };

/* ===================== favoriler · gam · öneri ===================== */
function kaydet(){
  if (!state.symbol && !state.notes.size) return;
  const sym = state.symbol;
  const noteNames = sym && !Chord.get(sym).empty ? Chord.get(sym).notes.map(simpleNote) : aktifBasOnce();
  const label = sym ? prettySym(sym) : noteNames.join(' ');
  // KESİN diziliş durumunu da sakla: o an görünen gitar perdeleri + piyano tuşları
  state.favorites.push({ symbol: sym, label, noteNames, gFrets: aktifGitarFrets(), pMidis: aktifPiyanoMidis() });
  persist(); favCiz();
}
/* kayıtlı akoru KESİN dizilişiyle geri yükle + ikisini de çal (ilerleme dinleme) */
function favYukle(f){
  if (!f.gFrets){ if (f.symbol) akorUygula(f.symbol); cikisCalAkor(aktifGitarMidis(), aktifPiyanoMidis()); return; } // eski kayıt yedeği
  state.notes.clear();
  state.symbol = f.symbol || null;
  const gen = f.symbol && !Chord.get(f.symbol).empty;
  state.gVoicings = [{ label: 'kayıtlı', manual: true, frets: f.gFrets.map(x => ({ ...x })) }, ...(gen ? gitarVoicings(f.symbol) : [])];
  state.pVoicings = [{ label: 'kayıtlı', manual: true, midis: f.pMidis.slice() }, ...(gen ? piyanoVoicings(f.symbol) : [])];
  state.gIndex = 0; state.pIndex = 0;
  state.detected = gen ? betterDetect(Chord.get(f.symbol).notes.map(n => PC_AD[Note.chroma(n)])) : [];
  ciz();
  cikisCalAkor(f.gFrets.map(x => x.midi), f.pMidis);
}
function favCiz(){
  const host = $('#favList');
  if (!state.favorites.length){ host.innerHTML = '<span class="fav-bos">Henüz kayıt yok — bir akor seçip ★ Kaydet de.</span>'; }
  else {
    host.innerHTML = '';
    state.favorites.forEach((f, i) => {
      const el = document.createElement('span'); el.className = 'fav'; el.title = 'yükle ve çal' + (i < 10 ? ` · ${(i + 1) % 10} tuşu` : '');
      const no = i < 10 ? (i + 1) % 10 : null;     // 1..9, 10. için 0
      el.innerHTML = `${no !== null ? `<span class="fav-no">${no}</span>` : ''}<b class="ac">${escapeHtml(f.label)}</b><button class="sil" title="sil">×</button>`;
      el.onclick = () => favYukle(f);
      el.querySelector('.sil').onclick = e => { e.stopPropagation(); state.favorites.splice(i, 1); persist(); favCiz(); };
      host.appendChild(el);
    });
  }
  gamCiz(); if (typeof poolCiz === 'function') poolCiz();
  if ($('#lanesIc') && looper.tracks.length) lanesCiz();   // havuz değişince timeline'daki ↑ butonlarını tazele
}
/* bir bloğun akoru havuzda (Kayıtlı akorlar) mı? (etikete göre) */
function akorHavuzdaMi(b){ return state.favorites.some(f => f.label === b.label); }
function favNesne(b){ return { symbol: b.symbol || null, label: b.label, noteNames: (b.noteNames || []).slice(), gFrets: (b.gFrets || []).map(x => ({ ...x })), pMidis: (b.pMidis || []).slice() }; }
/* bir timeline bloğunun akorunu havuza ekle ("yukarı at") — zaten varsa dokunma */
function havuzaEkle(b){
  if (!b || b.rest || b.perc || akorHavuzdaMi(b)) return false;
  state.favorites.push(favNesne(b)); persist(); favCiz(); return true;
}
/* yüklenen loop'taki ama havuzda OLMAYAN akorları havuza geri ekle (o şarkıyla çalışmak için) */
function loopAkorlariHavuza(){
  let n = 0;
  looper.tracks.forEach(tr => tr.blocks.forEach(b => {
    if (b.rest || b.perc || akorHavuzdaMi(b)) return;
    state.favorites.push(favNesne(b)); n++;
  }));
  if (n){ persist(); favCiz(); }
}
function tumNotalar(){
  const seen = new Set();
  state.favorites.forEach(f => (f.noteNames || []).forEach(n => seen.add(PC_AD[Note.chroma(n)])));
  return [...seen];
}
function looperNotalar(){
  const seen = new Set();
  looper.tracks.forEach(tr => tr.blocks.forEach(b => (b.noteNames || []).forEach(n => seen.add(PC_AD[Note.chroma(n)]))));
  return [...seen];
}
function gamCiz(){
  const sk = $('#skala'), on = $('#oneri');
  // solo rehberi gamı: ilerleme (looper) öncelikli, yoksa favoriler
  const hlPcs = looper.tracks.some(t => t.blocks.length) ? looperNotalar() : tumNotalar();
  state.gamChromas = null;
  if (hlPcs.length >= 2){ const sc = Scale.detect(hlPcs); if (sc.length) state.gamChromas = new Set(Scale.get(sc[0]).notes.map(n => Note.chroma(n))); }
  // skala metni + sıradaki akor önerisi (favorilerden)
  const pcs = tumNotalar();
  if (pcs.length < 2){ sk.textContent = '— en az iki farklı akor kaydet'; on.textContent = '—'; ciz(); return; }
  const scales = Scale.detect(pcs);
  sk.textContent = scales.length ? scales.slice(0, 3).join('  ·  ') : 'belirgin bir gam çıkmadı';
  const sug = oneriHesap(scales);
  if (!sug.length){ on.textContent = '—'; ciz(); return; }
  on.innerHTML = sug.map(s => `<button class="chip">${s}</button>`).join('');
  on.querySelectorAll('.chip').forEach(b => b.onclick = () => akorUygula(b.textContent));
  ciz();   // fretboard gam vurgusunu tazele
}
function oneriHesap(scales){
  if (!scales.length || !state.favorites.length) return [];
  const top = scales[0];                       // örn. "C major"
  const sp = top.split(' '); const tonic = sp[0]; const type = sp.slice(1).join(' ');
  let triads = null;
  if (type === 'major') triads = Key.majorKey(tonic).triads;
  else if (type === 'minor' || type === 'aeolian') triads = Key.minorKey(tonic).natural.triads;
  if (!triads) return [];
  const scaleNotes = Scale.get(top).notes;
  const son = state.favorites[state.favorites.length - 1];
  const kok = son.symbol ? (Chord.get(son.symbol).tonic || son.noteNames[0]) : son.noteNames[0];
  let deg = scaleNotes.findIndex(n => Note.chroma(n) === Note.chroma(kok));
  // yaygın ilerleme hareketleri (derece → hedef dereceler)
  const HAREKET = { 0: [3, 4, 5], 1: [4, 0], 2: [5, 3], 3: [4, 1, 0], 4: [0, 5, 3], 5: [3, 1, 4], 6: [0] };
  const hedef = (deg >= 0 ? HAREKET[deg] : [4, 5, 3]) || [4, 5, 3];
  const out = [];
  hedef.forEach(d => { if (triads[d] && !out.includes(triads[d])) out.push(triads[d]); });
  return out.slice(0, 3);
}

/* ===================== looper / sequencer (iki kanal) ===================== */
/* bir favorinin KESİN dizilişini çıkar (yoksa sembolün varsayılanı) */
function favVoicing(f){
  if (f.gFrets && f.pMidis) return { gFrets: f.gFrets.map(x => ({ ...x })), pMidis: f.pMidis.slice() };
  if (f.symbol && !Chord.get(f.symbol).empty){
    const gv = gitarVoicings(f.symbol), pv = piyanoVoicings(f.symbol);
    return { gFrets: gv[0] ? gv[0].frets.map(x => ({ s: x.s, f: x.f, midi: x.midi })) : [], pMidis: pv[0] ? pv[0].midis.slice() : [] };
  }
  return { gFrets: [], pMidis: [] };
}
/* ----- geri al (Ctrl/Cmd+Z) ----- */
const dkopya = a => JSON.parse(JSON.stringify(a));
function gecmisAl(){ gecmis.push({ tracks: dkopya(looper.tracks), sel: looper.selId, act: looper.activeTrackId }); if (gecmis.length > 80) gecmis.shift(); }
function geriAl(){
  const s = gecmis.pop(); if (!s) return;
  looper.tracks = dkopya(s.tracks); looper.selId = s.sel; looper.activeTrackId = s.act; idleriTazele();
  if (looper.playing) looperBaslat();
  lanesCiz(); gamCiz(); blokGorunur();
}
/* JSON'dan geri yüklemeden sonra id sayaçlarını en büyüğe çek (çakışmasın) */
function idleriTazele(){
  looper.tracks.forEach(tr => { if (tr.id > trackId) trackId = tr.id; tr.blocks.forEach(b => { if (b.id > blokId) blokId = b.id; }); });
}
/* zaman çizelgesini seçili bloğa kaydır */
function blokGorunur(){
  const el = document.querySelector('.lane-blok.secili'); const l = $('#lanes'); if (!el || !l) return;
  const er = el.getBoundingClientRect(), lr = l.getBoundingClientRect();
  if (er.right > lr.right - 12) l.scrollLeft += er.right - lr.right + 48;
  else if (er.left < lr.left + LABEL_W + 12) l.scrollLeft -= (lr.left + LABEL_W) - er.left + 48;
}

/* ----- kanal (track) yönetimi ----- */
function trackNesne(instrument){ return { id: ++trackId, instrument: instrument || 'gitar', vol: 0.9, blocks: [] }; }
function aktifTrack(){
  let tr = looper.tracks.find(t => t.id === looper.activeTrackId) || looper.tracks[0];
  if (!tr){ tr = trackNesne('gitar'); looper.tracks.push(tr); looper.activeTrackId = tr.id; }
  return tr;
}
function trackEkle(instrument){
  gecmisAl();
  const tr = trackNesne(instrument);
  looper.tracks.push(tr); looper.activeTrackId = tr.id;
  if (looper.playing) looperBaslat();
  lanesCiz(); gamCiz();
}
function trackSil(id){
  gecmisAl();
  looper.tracks = looper.tracks.filter(t => t.id !== id);
  if (looper.activeTrackId === id) looper.activeTrackId = looper.tracks[0] ? looper.tracks[0].id : null;
  if (looper.selId && !bulBlok(looper.selId)) looper.selId = null;
  if (looper.playing) looper.tracks.some(t => t.blocks.length) ? looperBaslat() : looperDur();
  lanesCiz(); gamCiz();
}
function trackEnstruman(id, inst){
  const tr = looper.tracks.find(t => t.id === id); if (!tr || tr.instrument === inst) return;
  gecmisAl();
  tr.instrument = inst;
  looper.activeTrackId = id;
  if (looper.playing) looperBaslat();
  lanesCiz(); gamCiz();
}
function trackVol(id, v){
  const tr = looper.tracks.find(t => t.id === id); if (!tr) return;
  tr.vol = v;   // gitar/piyano/perc hepsi velocity ile çalınır → sonraki çalışta uygulanır
}

/* kanalın enstrümanı + ses düzeyiyle (velocity) tek nota / akor tetikle */
function trackNota(tr, midi, time){ if (tr.instrument === 'gitar') pluk(midi, time, tr.vol, '8n'); else piyanoSes.triggerAttackRelease(Note.fromMidi(midi), '8n', time, tr.vol); }
function trackTetikle(tr, midis, time){
  const ms = [...midis].sort((a, b) => a - b); if (!ms.length) return;
  if (tr.instrument === 'gitar') ms.forEach((m, i) => pluk(m, time + i * 0.06, tr.vol, '2n'));           // strum (akustik Sampler)
  else ms.forEach((m, i) => piyanoSes.triggerAttackRelease(Note.fromMidi(m), '1n', time + i * 0.02, tr.vol));
}
/* bir bloğun KENDİ kanal enstrümanını anında çal (ön dinleme; es ise sessiz) */
function blokSesCal(blk, tr){
  if (blk.rest) return;
  if (blk.perc){ percOnizleBir(blk); return; }                 // perc: deseni tek tur ön dinle
  if (tr.instrument === 'gitar') calMidis(blk.gFrets.map(x => x.midi), 'gitar');
  else calMidis(blk.pMidis, 'piyano');
}

/* ----- ekleme / düzenleme (AKILLI SEÇİM: seçili bloğun SAĞINA ekle, yeni blok seçili olur) ----- */
function blokNesne(f, ref){
  const v = favVoicing(f);
  return { id: ++blokId, symbol: f.symbol || null, label: f.label, noteNames: f.noteNames || [],
    gFrets: v.gFrets.map(x => ({ ...x })), pMidis: v.pMidis.slice(), dur: ref ? ref.dur : 4,
    arp: ref ? !!ref.arp : false, hits: ref && ref.hits ? ref.hits : 4 };
}
/* ekleme hedefi DAİMA AKTİF KANAL (W/S ya da tıkla ile seçilen şerit):
   seçili blok aktif kanaldaysa onun SAĞINA, değilse aktif kanalın SONUNA */
function eklemeHedef(){
  let track = aktifTrack();
  if (track.instrument === 'perc'){                            // havuz akoru perc kanalına düşmez → bir akor kanalına yönlendir
    track = looper.tracks.find(t => t.instrument !== 'perc');
    if (!track){ track = trackNesne('gitar'); looper.tracks.push(track); looper.activeTrackId = track.id; }
  }
  const sel = looper.selId ? bulBlok(looper.selId) : null;
  if (sel && sel.track === track) return { track, idx: sel.idx + 1 };
  return { track, idx: track.blocks.length };
}
function poolEkle(f){
  gecmisAl();
  const { track, idx } = eklemeHedef();
  const blk = blokNesne(f, track.blocks[idx - 1]);
  track.blocks.splice(idx, 0, blk);
  looper.selId = blk.id; looper.activeTrackId = track.id;
  blokSesCal(blk, track);                    // tek seferlik ön dinleme (kanalın enstrümanı)
  if (looper.playing) looperBaslat();
  lanesCiz(); gamCiz(); blokGorunur();
}
/* es / boşluk ekle (seçili bloğun sağına; süresi komşusundan; çalarken sessizdir) */
function boslukEkle(){
  gecmisAl();
  const { track, idx } = eklemeHedef();
  const ref = track.blocks[idx - 1];
  const blk = { id: ++blokId, rest: true, symbol: null, label: '·', noteNames: [], gFrets: [], pMidis: [], dur: ref ? ref.dur : 4, arp: false };
  track.blocks.splice(idx, 0, blk);
  looper.selId = blk.id; looper.activeTrackId = track.id;
  if (looper.playing) looperBaslat();
  lanesCiz(); blokGorunur();
}
/* seçili bloğun ardına kopyalanan bloğu yapıştır */
function blokYapistir(){
  if (!clip) return;
  gecmisAl();
  const yeni = Object.assign(dkopya(clip), { id: ++blokId });
  let track, idx;
  if (clip.perc){                                         // ritim deseni KENDİ (perc) şeridine yapışsın
    const sel = looper.selId ? bulBlok(looper.selId) : null;
    if (sel && sel.track.instrument === 'perc'){ track = sel.track; idx = sel.idx + 1; }
    else { track = looper.tracks.find(t => t.instrument === 'perc') || (looper.tracks.push(trackNesne('perc')), looper.tracks[looper.tracks.length - 1]); idx = track.blocks.length; }
  } else { const h = eklemeHedef(); track = h.track; idx = h.idx; }
  track.blocks.splice(idx, 0, yeni);
  looper.selId = yeni.id; looper.activeTrackId = track.id;
  if (looper.playing) looperBaslat();
  lanesCiz(); gamCiz(); blokGorunur();
}
/* bir bloğu kendi şeridinde sağına çoğalt (ritim desenini yan yana dizmek için) */
function blokKopyala(b, tr){
  gecmisAl();
  const idx = tr.blocks.indexOf(b);
  const yeni = Object.assign(dkopya(b), { id: ++blokId });
  tr.blocks.splice(idx + 1, 0, yeni);
  looper.selId = yeni.id; looper.activeTrackId = tr.id;
  if (looper.playing) looperBaslat();
  lanesCiz(); gamCiz(); blokGorunur();
}
/* seçili bloğu sil → seçim SOLDAKİ bloğa kayar */
function blokSil(track, idx){
  gecmisAl();
  const arr = track.blocks;
  arr.splice(idx, 1);
  const komsu = arr[idx - 1] || arr[idx] || null;   // önce sol, yoksa sağa kayan
  looper.selId = komsu ? komsu.id : null;
  if (looper.playing) looperBaslat();
  lanesCiz(); gamCiz(); blokGorunur();
}
/* WASD ile seçim gezintisi (A/D yatay, W/S kanallar arası) */
function nav(key){
  const f = looper.selId ? bulBlok(looper.selId) : null;
  if (!f){ const tr = looper.tracks.find(t => t.blocks.length); if (tr){ looper.selId = tr.blocks[0].id; looper.activeTrackId = tr.id; lanesCiz(); blokGorunur(); } return; }
  let track = f.track, idx = f.idx;
  const ti = looper.tracks.indexOf(track);
  if (key === 'a') idx = Math.max(0, idx - 1);
  else if (key === 'd') idx = Math.min(track.blocks.length - 1, idx + 1);
  else if (key === 'w'){ for (let t = ti - 1; t >= 0; t--){ if (looper.tracks[t].blocks.length){ track = looper.tracks[t]; idx = Math.min(idx, track.blocks.length - 1); break; } } }
  else if (key === 's'){ for (let t = ti + 1; t < looper.tracks.length; t++){ if (looper.tracks[t].blocks.length){ track = looper.tracks[t]; idx = Math.min(idx, track.blocks.length - 1); break; } } }
  const blk = track.blocks[idx]; if (blk){ looper.selId = blk.id; looper.activeTrackId = track.id; lanesCiz(); blokGorunur(); }
}
function looperTemizle(){

function bulBlok(id){
  for (const track of looper.tracks){ const idx = track.blocks.findIndex(b => b.id === id); if (idx >= 0) return { track, idx, arr: track.blocks, blk: track.blocks[idx] }; }

}

const beatToTime = beat => { const bar = Math.floor(beat / 4), r = beat - bar * 4, b = Math.floor(r); return `${bar}:${b}:${Math.round((r - b) * 4)}`; };
/* çalan blokları işaretle (looper.calan kanal id -> blok id; tam yeniden çizimden bağımsız) */
function calanIsaretle(){
  document.querySelectorAll('.lane-track[data-tid]').forEach(h => {
    const cur = looper.calan[+h.dataset.tid];

/* bir bloğu tıklamak/çalmak HEM gitar perdesini HEM piyano tuşunu Çevirici'de vurgular
   (kanalın enstrümanı ne olursa olsun — blok iki dizilişi de taşır) */
function liveSyncBlok(b){
  if (!b || b.rest || b.perc) return;
  state.symbol = b.symbol || null;
  const gen = b.symbol && !Chord.get(b.symbol).empty;
  state.gVoicings = [{ label: 'looper', manual: true, frets: (b.gFrets || []).map(x => ({ ...x })) }, ...(gen ? gitarVoicings(b.symbol) : [])];
  state.pVoicings = [{ label: 'looper', manual: true, midis: (b.pMidis || []).slice() }, ...(gen ? piyanoVoicings(b.symbol) : [])];
  state.gIndex = 0; state.pIndex = 0;
  state.detected = gen ? betterDetect(Chord.get(b.symbol).notes.map(n => PC_AD[Note.chroma(n)])) : [];
  ciz();
}
let playheadRAF = 0;
function playheadDongu(totalBeats){
  const ph = $('#playhead'), lanes = $('#lanes');
  cancelAnimationFrame(playheadRAF);
  const tik = () => {
    if (!looper.playing || !ph){ if (ph) ph.style.opacity = '0'; return; }
    const prog = (Tone && Tone.Transport) ? Tone.Transport.progress : 0;
    const x = LABEL_W + prog * totalBeats * PXB;
    ph.style.left = x + 'px'; ph.style.opacity = '1';
    if (lanes){ const vw = lanes.clientWidth, sl = lanes.scrollLeft; if (x < sl + LABEL_W + 30 || x > sl + vw - 50) lanes.scrollLeft = Math.max(0, x - vw * 0.45); }
    playheadRAF = requestAnimationFrame(tik);
  };
  tik();
}
/* arpej: bloğun TÜM notalarını pesten tize sırala (örn. D A C E B → 5 nota) */
function arpDizi(midis){ return [...new Set(midis)].sort((a, b) => a - b); }
async function looperBaslat(){
  if (!looper.tracks.some(t => t.blocks.length)) return;
  if (!(await sesHazir())) return;
  if (looper.tracks.some(t => t.blocks.some(b => b.perc))) await percHazir();   // vurmalı synth'leri hazırla
  Tone.Transport.stop(); Tone.Transport.cancel(); Tone.Transport.position = 0;
  Tone.Transport.bpm.value = looper.bpm;
  let total = 4;
  const tekLi = looper.tracks.filter(t => t.blocks.length).length === 1;        // tek dolu kanal → onu senkrla
  looper.tracks.forEach(tr => {
    let beat = 0;
    tr.blocks.forEach(b => {
      Tone.Transport.schedule(time => {
        if (b.perc) percCal(tr, b, time);
        else if (!b.rest){
          const baseM = tr.instrument === 'gitar' ? b.gFrets.map(x => x.midi) : b.pMidis;
          if (b.arp){
            let arp = arpDizi(baseM);                                         // voicing'in MUTLAK perdeleri (oktavlar ayrı)
            if (b.arpOff && b.arpOff.length){                                 // voicing: kapatılan MUTLAK perdeleri çıkar (oktav duyarlı)
              const off = new Set(b.arpOff);
              const f = arp.filter(m => !off.has(m));
              if (f.length) arp = f;                                          // hepsi kapalıysa sessizlik olmasın
            }
            if (arp.length){
              const n = Math.max(1, Math.min(16, b.hits || 4));               // TAM olarak n vuruş (seçiciden)
              const blokSec = b.dur * 60 / looper.bpm, adim = blokSec / n;     // n nota blok boyunca eşit dağılır
              for (let k = 0; k < n; k++) trackNota(tr, arp[k % arp.length], time + k * adim);  // perdeleri döngüleyerek çal
            }
          } else trackTetikle(tr, baseM, time);
        }
        Tone.Draw.schedule(() => {
          looper.calan[tr.id] = b.id; calanIsaretle();
          if (!b.rest && (tr.id === looper.activeTrackId || tekLi)) liveSyncBlok(b);   // Çevirici'de iki enstrümanı vurgula
        }, time);
      }, beatToTime(beat));
      beat += b.dur;
    });
    total = Math.max(total, beat);
  });
  Tone.Transport.loopStart = 0; Tone.Transport.loopEnd = beatToTime(total); Tone.Transport.loop = looper.loop;
  if (!looper.loop) Tone.Transport.scheduleOnce(time => Tone.Draw.schedule(() => looperDur(), time), beatToTime(total));
  if (looper.drum) Tone.Transport.scheduleRepeat(time => {
    const inBar = Math.round(Tone.Transport.getTicksAtTime(time) / Tone.Transport.PPQ) % 4;
    kick.triggerAttackRelease(inBar === 0 ? 'C2' : 'C1', '8n', time);
    if (inBar === 1 || inBar === 3) snare.triggerAttackRelease('16n', time);
  }, '4n', 0);
  Tone.Transport.start();
  looper.playing = true; $('#lpPlay').classList.add('aktif');
  playheadDongu(total);
}
function looperDur(){
  if (sesAcik){ Tone.Transport.stop(); Tone.Transport.cancel(); Tone.Transport.position = 0; sesKes(); }   // SERT DUR: kuyrukları kes
  looper.playing = false; looper.calan = {};
  $('#lpPlay').classList.remove('aktif');
  cancelAnimationFrame(playheadRAF);
  const ph = $('#playhead'); if (ph) ph.style.opacity = '0';
  document.querySelectorAll('.lane-blok.oynuyor').forEach(el => el.classList.remove('oynuyor'));
}

/* A/B anlık fotoğraf: o anki diziler (akorlar + süreler + arp) + BPM */
const snap = { A: null, B: null };
let snapAktif = null;
function snapAl(slot){ snap[slot] = { tracks: dkopya(looper.tracks), bpm: looper.bpm }; }
function snapYukle(slot){

}
function abTik(slot){
  if (!snap[slot]) snapAl(slot);              // boş → şu anki hâli kaydet
  else if (snapAktif === slot) snapAl(slot);   // zaten etkin → üzerine kaydet (güncelle)
  else snapYukle(slot);                        // dolu ve başka → o hâle anında geç
  snapAktif = slot; abCiz();
}
function abCiz(){
  ['A', 'B'].forEach(s => {
    const b = $('#ab' + s); if (!b) return;
    b.classList.toggle('dolu', !!snap[s]); b.classList.toggle('aktif', snapAktif === s);
    b.title = snap[s] ? (snapAktif === s ? 'tıkla: üzerine kaydet' : 'tıkla: bu hâle geç') : 'tıkla: şu anki hâli kaydet';
  });
}
/* ===================== özel vurmalı (custom percussion) =====================
   Tone.js gömülü synth'ler (örnek dosyası yok). Mevcut motor (akor/arpej) DEĞİŞMEZ; bunlar EK.
   Kick = MembraneSynth · Snare + Hi-Hat = NoiseSynth (hi-hat'e highpass). */
const perc = { ready: false, kick: null, snare: null, hihat: null, hhf: null };
async function percHazir(){
  if (!(await sesHazir())) return false;                  // Tone.start + temel motor (yeniden kurmaz)
  if (perc.ready) return true;
  perc.kick = new Tone.MembraneSynth({ octaves: 7, pitchDecay: 0.045, envelope: { attack: 0.001, decay: 0.34, sustain: 0 } }).toDestination();
  perc.kick.volume.value = -3;
  perc.snare = new Tone.NoiseSynth({ noise: { type: 'white' }, envelope: { attack: 0.001, decay: 0.18, sustain: 0 } }).toDestination();
  perc.snare.volume.value = -11;
  perc.hhf = new Tone.Filter(8000, 'highpass').toDestination();
  perc.hihat = new Tone.NoiseSynth({ noise: { type: 'white' }, envelope: { attack: 0.001, decay: 0.045, sustain: 0 } }).connect(perc.hhf);
  perc.hihat.volume.value = -15;
  perc.ready = true;
  return true;
}
const PERC_STEP_BEAT = 0.25;        // 1 adım = 1/16 nota → 4 adım = 1 vuruş; 14 adım = 7/8, 18 = 9/8
const PERC_ROWS = [['kick', 'Kick', '🥁'], ['snare', 'Snare', '🪘'], ['hihat', 'Hi-Hat', '🎩']];
function percVurStep(pattern, s, time, vel){
  if (pattern.kick[s])  perc.kick.triggerAttackRelease('C1', '8n', time, vel);
  if (pattern.snare[s]) perc.snare.triggerAttackRelease('16n', time, vel);
  if (pattern.hihat[s]) perc.hihat.triggerAttackRelease('32n', time, vel * 0.8);
}
/* looper: deseni blok süresi boyunca DÖNGÜLEYEREK çal (14/16/18… adım fark etmez) */
function percCal(tr, b, time){
  if (!perc.ready || !b.steps) return;
  const secB = 60 / looper.bpm, stepSec = PERC_STEP_BEAT * secB, blockSec = b.dur * secB;
  let i = 0;
  for (let t = 0; t < blockSec - 1e-3; t += stepSec){ percVurStep(b.pattern, i % b.steps, time + t, tr.vol); i++; }
}
/* perc bloğunu tıklayınca deseni tek tur ön dinle */
async function percOnizleBir(b){
  if (!(await percHazir())) return;
  const secB = 60 / looper.bpm, stepSec = PERC_STEP_BEAT * secB, t0 = Tone.now() + 0.05;
  for (let i = 0; i < b.steps; i++) percVurStep(b.pattern, i, t0 + i * stepSec, 0.95);
}
function percMiniHTML(b){
  let html = `<div class="lb-perc-mini" style="--adim:${b.steps}">`;
  PERC_ROWS.forEach(([r]) => { for (let i = 0; i < b.steps; i++) html += `<span class="${b.pattern[r][i] ? 'on ' + r : ''}"></span>`; });
  return html + '</div>';
}

/* ----- desen düzenleyici (modal) ----- */
const editor = { steps: 16, pattern: { kick: [], snare: [], hihat: [] }, blokId: null };
let percOnizleTimer = null, percOnizleStep = 0;
function varsayilanDesen(steps){
  const k = new Array(steps).fill(0), s = new Array(steps).fill(0), h = new Array(steps).fill(0);
  for (let i = 0; i < steps; i++){ if (i % 4 === 0) k[i] = 1; if (i % 2 === 0) h[i] = 1; }
  s[Math.min(steps - 1, Math.max(0, Math.round(steps / 8) * 4 || 4))] = 1;   // ortaya yakın bir vuruşta snare
  return { kick: k, snare: s, hihat: h };
}
function drumAcik(){ const m = $('#drumModal'); return !!(m && m.classList.contains('acik')); }
function drumAc(blokId){
  onizleDurdur();
  const f = blokId ? bulBlok(blokId) : null;
  if (f && f.blk.perc){ editor.blokId = blokId; editor.steps = f.blk.steps; editor.pattern = dkopya(f.blk.pattern); }
  else { editor.blokId = null; editor.steps = 16; editor.pattern = varsayilanDesen(16); }
  $('#drumAdim').value = editor.steps;
  $('#drumEkle').textContent = editor.blokId ? 'Güncelle' : 'Diziye ekle';
  gridCiz();
  const m = $('#drumModal'); m.classList.add('acik'); m.setAttribute('aria-hidden', 'false');
}
function drumKapat(){ onizleDurdur(); const m = $('#drumModal'); if (m){ m.classList.remove('acik'); m.setAttribute('aria-hidden', 'true'); } }
function adimAyarla(n){
  n = Math.max(1, Math.min(32, Math.round(+n) || 16));
  PERC_ROWS.forEach(([r]) => {
    const old = editor.pattern[r] || [], arr = new Array(n).fill(0);
    for (let i = 0; i < Math.min(n, old.length); i++) arr[i] = old[i];
    editor.pattern[r] = arr;
  });
  editor.steps = n; if ($('#drumAdim')) $('#drumAdim').value = n;
  gridCiz();
}
function gridCiz(){
  const host = $('#drumGrid'); if (!host) return;
  host.style.setProperty('--adim', editor.steps);
  let html = '<div class="dg-row dg-no"><span class="dg-lab"></span>';
  for (let i = 0; i < editor.steps; i++) html += `<span class="dg-num${i % 4 === 0 ? ' vurus' : ''}" data-i="${i}">${i + 1}</span>`;
  html += '</div>';
  PERC_ROWS.forEach(([r, ad, em]) => {
    html += `<div class="dg-row" data-row="${r}"><span class="dg-lab">${em} ${ad}</span>`;
    for (let i = 0; i < editor.steps; i++) html += `<button type="button" class="dg-cell${editor.pattern[r][i] ? ' on' : ''}${i % 4 === 0 ? ' vurus' : ''}" data-row="${r}" data-i="${i}" aria-pressed="${editor.pattern[r][i] ? 'true' : 'false'}"></button>`;
    html += '</div>';
  });
  host.innerHTML = html;
  host.querySelectorAll('.dg-cell').forEach(c => c.onclick = () => {
    const r = c.dataset.row, i = +c.dataset.i, v = editor.pattern[r][i] ? 0 : 1;
    editor.pattern[r][i] = v; c.classList.toggle('on', !!v); c.setAttribute('aria-pressed', v ? 'true' : 'false');
  });
}
function gridSutunVurgu(s){ const host = $('#drumGrid'); if (host) host.querySelectorAll('[data-i]').forEach(el => el.classList.toggle('calan', +el.dataset.i === s)); }
function onizleBaslat(){
  onizleDurdur();
  percHazir().then(ok => {
    if (!ok || !drumAcik()) return;
    percOnizleStep = 0;
    const stepMs = Math.max(45, PERC_STEP_BEAT * 60 / looper.bpm * 1000);
    const tik = () => { const s = percOnizleStep % editor.steps; percVurStep(editor.pattern, s, Tone.now() + 0.02, 0.95); gridSutunVurgu(s); percOnizleStep++; };
    tik(); percOnizleTimer = setInterval(tik, stepMs);
  });
}
function onizleDurdur(){ if (percOnizleTimer){ clearInterval(percOnizleTimer); percOnizleTimer = null; } gridSutunVurgu(-1); }
function percEkle(){
  onizleDurdur();
  if (editor.blokId){                                          // mevcut bloğu güncelle
    const f = bulBlok(editor.blokId);
    if (f && f.blk.perc){ gecmisAl(); f.blk.steps = editor.steps; f.blk.pattern = dkopya(editor.pattern); f.blk.label = '🥁 ' + editor.steps; looper.selId = f.blk.id; if (looper.playing) looperBaslat(); lanesCiz(); blokGorunur(); }
    drumKapat(); return;
  }
  gecmisAl();
  let track = looper.tracks.find(t => t.instrument === 'perc');     // varsa perc kanalına ekle, yoksa oluştur
  if (!track){ track = trackNesne('perc'); looper.tracks.push(track); }
  const blk = { id: ++blokId, perc: true, label: '🥁 ' + editor.steps, steps: editor.steps, pattern: dkopya(editor.pattern), dur: 4, noteNames: [] };
  track.blocks.push(blk);
  looper.selId = blk.id; looper.activeTrackId = track.id;
  if (looper.playing) looperBaslat();
  lanesCiz(); blokGorunur(); drumKapat();
}

/* ===================== arpej voicing (hangi notalar çalınacak) ===================== */
/* bloğun ÇALINAN voicing'inin MUTLAK perdelerini ver — oktavlar AYRI kalır
   (A2, E3, A3, C4, E4 → her tel/tuş ayrı düğme). Perde sınıfına EZİLMEZ. */
function blokNotalari(b, tr){
  const baseM = tr.instrument === 'gitar' ? (b.gFrets || []).map(x => x.midi) : (b.pMidis || []);
  const yazim = new Map();   // akor adlarından perde-sınıfı → doğru yazım (Bb vs A#)
  (b.noteNames || []).forEach(n => { const s = simpleNote(n); yazim.set(Note.chroma(s), s); });
  // arpDizi yalnız TAM aynı midi'leri tekler (oktavları korur) → mutlak perde listesi
  return arpDizi(baseM).map(m => ({ midi: m, ad: (yazim.get(chromaOf(m)) || PC_AD[chromaOf(m)]) + (Math.floor(m / 12) - 1) }));
}
let arpPop = null;   // { b, tr }
function arpPopAc(b, tr, anchorEl){
  arpPop = { b, tr };
  const pop = $('#arpPop'); if (!pop) return;
  const notes = blokNotalari(b, tr);
  const off = new Set(b.arpOff || []);   // MUTLAK MIDI kümesi (perde sınıfı değil)
  pop.innerHTML =
    `<div class="ap-bas">Arpej notaları<small>${escapeHtml(b.label || '')}</small></div>` +
    `<div class="ap-notes">${notes.map(n => `<button type="button" class="ap-nota${off.has(n.midi) ? '' : ' on'}" data-m="${n.midi}">${escapeHtml(n.ad)}</button>`).join('')}</div>` +
    `<div class="ap-ipucu">${b.arp ? 'Açık notalar arpejde sırayla çalınır.' : 'Önce bloğun arpejini aç (≈).'} Vuruş sayısı not sayısından azsa açık notalar döngülenir.</div>`;
  pop.querySelectorAll('.ap-nota').forEach(btn => btn.onclick = e => { e.stopPropagation(); arpNotaToggle(+btn.dataset.m); });
  pop.classList.add('acik'); pop.setAttribute('aria-hidden', 'false');
  const r = anchorEl.getBoundingClientRect(), w = pop.offsetWidth || 232, h = pop.offsetHeight || 120;
  pop.style.left = Math.max(8, Math.min(window.innerWidth - w - 8, r.left)) + 'px';
  let top = r.bottom + 6; if (top + h > window.innerHeight - 8) top = Math.max(8, r.top - h - 6);
  pop.style.top = top + 'px';
}
function arpNotaToggle(midi){
  if (!arpPop) return;
  const b = arpPop.b;
  gecmisAl();
  b.arpOff = b.arpOff || [];
  const idx = b.arpOff.indexOf(midi);   // MUTLAK perde aç/kapa (oktav bağımsız)
  if (idx >= 0) b.arpOff.splice(idx, 1); else b.arpOff.push(midi);
  if (looper.playing) looperBaslat();
  lanesCiz();
  const el = document.querySelector(`.lane-blok[data-bid="${b.id}"]`);
  if (el) arpPopAc(b, arpPop.tr, el); else arpPopKapat();
}
function arpPopKapat(){ const pop = $('#arpPop'); if (pop){ pop.classList.remove('acik'); pop.setAttribute('aria-hidden', 'true'); } arpPop = null; }

function looperKur(){
  // sekme geçişi
  document.querySelectorAll('.tab-tus').forEach(t => t.onclick = () => {
    document.querySelectorAll('.tab-tus').forEach(x => x.classList.toggle('aktif', x === t));
    document.querySelectorAll('.tab-panel').forEach(p => p.classList.toggle('aktif', p.id === 'tab-' + t.dataset.tab));
  });
  $('#lpPlay').onclick = () => looperBaslat();
  $('#lpStop').onclick = () => looperDur();
  $('#lpBpm').oninput = e => { looper.bpm = +e.target.value; $('#lpBpmVal').textContent = looper.bpm; if (sesAcik) Tone.Transport.bpm.value = looper.bpm; };
  $('#lpLoop').onchange = e => { looper.loop = e.target.checked; if (looper.playing) looperBaslat(); };
  $('#lpDrum').onchange = e => { looper.drum = e.target.checked; if (looper.playing) looperBaslat(); };
  // çıkış anahtarı: artık YALNIZ Çevirici sekmesinde (looper'da kanal başına enstrüman var)
  document.querySelectorAll('[data-cikis] button').forEach(b => b.onclick = () => { state.output = b.dataset.o; cikisCiz(); });
  $('#abA').onclick = () => abTik('A');
  $('#abB').onclick = () => abTik('B');
  $('#lpTemizle').onclick = looperTemizle;
  $('#lpBosluk').onclick = boslukEkle;
  // kanal ekle (enstrümanı seçerek) + döngü kütüphanesi
  $('#izGitar') && ($('#izGitar').onclick = e => { e.currentTarget.blur(); trackEkle('gitar'); });
  $('#izPiyano') && ($('#izPiyano').onclick = e => { e.currentTarget.blur(); trackEkle('piyano'); });
  $('#loopKaydetBtn') && ($('#loopKaydetBtn').onclick = e => { e.currentTarget.blur(); loopKaydet(); });
  $('#loopAd') && ($('#loopAd').onkeydown = e => { if (e.key === 'Enter'){ e.preventDefault(); loopKaydet(); e.target.blur(); } });
  // ritim deseni düzenleyici (modal)
  $('#izDavul') && ($('#izDavul').onclick = e => { e.currentTarget.blur(); drumAc(); });
  $('#drumKapat') && ($('#drumKapat').onclick = () => drumKapat());
  $('#drumArka') && ($('#drumArka').onclick = () => drumKapat());
  $('#drumAdim') && ($('#drumAdim').onchange = e => adimAyarla(e.target.value));
  $('#drumPresets') && $('#drumPresets').querySelectorAll('button').forEach(b => b.onclick = () => { b.blur(); adimAyarla(+b.dataset.n); });
  $('#drumOnizle') && ($('#drumOnizle').onclick = e => { e.currentTarget.blur(); onizleBaslat(); });
  $('#drumOnizleDur') && ($('#drumOnizleDur').onclick = e => { e.currentTarget.blur(); onizleDurdur(); });
  $('#drumEkle') && ($('#drumEkle').onclick = e => { e.currentTarget.blur(); percEkle(); });
  // modal açıkken looper kısayollarını (Boşluk/WASD/sayı/oklar) engelle + Esc ile kapat —
  // capture+stopImmediatePropagation ile mevcut keydown'a DOKUNMADAN
  document.addEventListener('keydown', e => {
    if (!drumAcik()) return;
    if (e.key === 'Escape'){ e.preventDefault(); drumKapat(); }
    e.stopImmediatePropagation();
  }, true);
  // arpej voicing popover: dışarı tıkla / Esc ile kapat
  document.addEventListener('mousedown', e => { if (arpPop && !e.target.closest('#arpPop') && !e.target.closest('.lb-disli')) arpPopKapat(); });
  document.addEventListener('keydown', e => { if (arpPop && e.key === 'Escape'){ e.stopImmediatePropagation(); arpPopKapat(); } }, true);
  const lanesEl = $('#lanes'); if (lanesEl) lanesEl.addEventListener('scroll', () => { if (arpPop) arpPopKapat(); });
  // Boşluk tuşunun odaktaki düğmeyi YENİDEN tetiklemesini engelle (keyup'taki etkinleştirmeyi de bastır)
  const bosTus = e => (e.code === 'Space' || e.key === ' ');
  const yaziAlani = () => { const t = document.activeElement && document.activeElement.tagName; return t === 'INPUT' || t === 'TEXTAREA' || t === 'SELECT'; };
  document.addEventListener('keyup', e => { if (bosTus(e) && !yaziAlani()) e.preventDefault(); });
  // klavye-öncelikli besteleme (WASD gez · oklar düzenle · Q arpej · Ctrl/Cmd+C/V · Backspace · Boşluk)
  document.addEventListener('keydown', e => {
    const yaziyor = yaziAlani();
    // Boşluk: SADECE tüm zaman çizelgesini çal/durdur (her sekmede); odaktaki düğmeyi tetiklemesin
    if (bosTus(e) && !yaziyor){
      e.preventDefault();
      const ae = document.activeElement; if (ae && /^(BUTTON|A)$/.test(ae.tagName)) ae.blur();
      looper.playing ? looperDur() : looperBaslat();
      return;
    }
    // Çevirici sekmesi: 1-9,0 → kenardaki "Kayıtlı akorlar"ı yükle + çal
    const ceviriciAktif = $('#tab-cevirici') && $('#tab-cevirici').classList.contains('aktif');
    if (ceviriciAktif && !yaziyor && /^[0-9]$/.test(e.key) && !e.ctrlKey && !e.metaKey){
      const idx = e.key === '0' ? 9 : (+e.key - 1);
      if (state.favorites[idx]){ e.preventDefault(); favYukle(state.favorites[idx]); }
      return;
    }
    const looperAktif = $('#tab-looper') && $('#tab-looper').classList.contains('aktif');
    if (!looperAktif || yaziyor) return;
    const key = e.key.toLowerCase();
    // sayı tuşları 1-9,0 → havuzdaki o akoru seçili bloğun sağına HEMEN enjekte et
    if (/^[0-9]$/.test(e.key) && !e.ctrlKey && !e.metaKey){
      const idx = e.key === '0' ? 9 : (+e.key - 1);
      if (state.favorites[idx]){ e.preventDefault(); poolEkle(state.favorites[idx]); }
      return;
    }
    // geri al (Ctrl/Cmd+Z) · kopyala/yapıştır (Ctrl/Cmd+C/V)
    if (e.ctrlKey || e.metaKey){
      if (key === 'z'){ e.preventDefault(); geriAl(); return; }
      if (key === 'c'){ const f = bulBlok(looper.selId); if (f){ clip = dkopya(f.blk); e.preventDefault(); } return; }
      if (key === 'v'){ if (clip){ e.preventDefault(); blokYapistir(); } return; }
    }
    // WASD seçim gezintisi
    if (['w', 'a', 's', 'd'].includes(key)){ e.preventDefault(); nav(key); return; }
    // manipülasyon (seçili blok gerekir)
    if (!looper.selId) return;
    const f = bulBlok(looper.selId); if (!f) return;
    if (!['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'Backspace', 'Delete'].includes(e.key) && key !== 'q') return;
    e.preventDefault();
    if (e.key === 'Backspace' || e.key === 'Delete') blokSil(f.track, f.idx);   // seçim soldaki bloğa kayar (gecmisAl içeride)
    else if (e.key === 'ArrowLeft') blokTasi(f.track, f.idx, -1);               // diziyi yeniden sırala
    else if (e.key === 'ArrowRight') blokTasi(f.track, f.idx, 1);
    else if (key === 'q'){ gecmisAl(); f.blk.arp = !f.blk.arp; if (looper.playing) looperBaslat(); lanesCiz(); }   // arpej aç/kapa
    else { gecmisAl(); const di = DUR_BEATS.indexOf(f.blk.dur); f.blk.dur = DUR_BEATS[e.key === 'ArrowUp' ? Math.min(DUR_BEATS.length - 1, di + 1) : Math.max(0, di - 1)]; if (looper.playing) looperBaslat(); lanesCiz(); }
  });
  // varsayılan kanallar: bir gitar + bir piyano (kullanıcı ekleyip silebilir)
  if (!looper.tracks.length){ looper.tracks.push(trackNesne('gitar'), trackNesne('piyano')); looper.activeTrackId = looper.tracks[0].id; }
  loopLibCiz();
  cikisCiz(); abCiz(); lanesCiz();
}

/* ===================== başlat ===================== */
fretboardKur();
piyanoKur();
kurCiz();
favCiz();
looperKur();
ciz();
$('#yukleniyor')?.remove();
</script>
