<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>nota çevirici — gitar ↔ piyano</title>
<meta name="description" content="Gitar ve piyano arasında nota ve akor çevirici. Perdeye ya da tuşa bas, akoru bul; akor ara ya da kur; çevrimleri ve pozisyonları gör, çal, kaydet.">
<meta name="theme-color" content="#1f6f5c">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%231f6f5c'/%3E%3Cpath d='M24 16h22v6l-15 3v18a7 6 0 1 1-6-6c2 0 4 .7 5 1.8V16Z' fill='%23F2E6CE'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600;700&family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&display=swap">
<link rel="stylesheet" href="../ortak/stil.css">
<script src="../ortak/adlar.js"></script>
<style>
/* ===== araca özgü tema belirteçleri ===== */
body{
  --ahsap:#d8c19a; --ahsap-cizgi:#b79b6f; --tel:#9a8a72; --nut:#3a2e22;
  --perde-isaret:#bfa87f; --aktif:var(--acc); --aktif-yum:var(--acc-soft);
  --kok:#c8743c; --kok-yum:rgba(200,116,60,.16);
  --beyaz:#fffdf8; --siyah:#2a2620; --tus-cizgi:#cdbfa6;
  touch-action:manipulation; -webkit-tap-highlight-color:transparent;
}
body.gece{
  --bg:#16110C; --card:#241C14; --ink:#EFE2C6; --muted:#9C8C70; --line:#3A2E20;
  --acc:#86B98E; --acc-soft:rgba(134,185,142,.16); --vurgu:#E0935A; --shadow:rgba(0,0,0,.4);
  --ahsap:#3a2e20; --ahsap-cizgi:#54422c; --tel:#7a6a52; --nut:#caa56f;
  --perde-isaret:#6a583c; --kok:#E0935A; --kok-yum:rgba(224,147,90,.18);
  --beyaz:#2b261d; --siyah:#0d0a07; --tus-cizgi:#473a28;
}

.nota-wrap{max-width:1040px}
.bar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:6px}
.gece-tus{margin-left:auto;background:var(--card);border:1px solid var(--line);color:var(--ink);border-radius:18px;padding:4px 12px;font-size:14px}

/* ===== okuma kartı (akor adı + bilgi) ===== */
.okuma{background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:0 3px 12px var(--shadow);padding:16px 18px;margin-top:18px;display:flex;gap:18px;align-items:center;flex-wrap:wrap}
.okuma .ad{font-family:'Playfair Display',Georgia,serif;font-size:34px;line-height:1.05;color:var(--acc);min-width:120px}
.okuma .ad small{display:block;font-family:Georgia,serif;font-size:13px;color:var(--muted);font-style:italic;margin-top:2px}
.okuma .bilgi{font-size:14px;color:var(--ink);line-height:1.6;flex:1;min-width:180px}
.okuma .bilgi .et{color:var(--muted)}
.okuma .alt-akorlar{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.okuma .alt-akorlar button{font-size:12.5px;color:var(--muted);background:transparent;border:1px solid var(--line);border-radius:14px;padding:2px 10px}
.okuma .alt-akorlar button:hover{border-color:var(--acc);color:var(--acc)}
.okuma .eylem{display:flex;gap:8px;flex-wrap:wrap}
.okuma .eylem button{border:none;border-radius:20px;padding:9px 16px;font-size:14px;font-weight:600}
.cal{background:var(--acc);color:#fff}
.cal:hover{filter:brightness(1.05)}
.kaydet{background:var(--vurgu);color:#fff}
.kaydet:hover{filter:brightness(1.05)}
.temizle{background:transparent;color:var(--muted);border:1px solid var(--line)!important}
.temizle:hover{color:var(--ink)}

/* ===== enstrüman sahnesi ===== */
.sahne{display:grid;gap:18px;margin-top:18px}
.enstruman{background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:0 3px 12px var(--shadow);padding:14px 16px 18px;min-width:0}
.sahne>*,.paneller>*{min-width:0}
.enst-bas{display:flex;align-items:flex-start;justify-content:space-between;gap:10px 14px;flex-wrap:wrap;margin-bottom:12px}
.enst-bas h3{font-family:'Playfair Display',Georgia,serif;font-weight:600;font-size:19px;color:var(--ink)}
.enst-sol{display:flex;align-items:center;gap:11px}
.enst-cal{background:var(--acc);color:#fff;border:none;border-radius:16px;padding:6px 14px;font-size:13.5px;font-weight:600;white-space:nowrap}
.enst-cal:hover{filter:brightness(1.06)}
.enst-cal:active{transform:translateY(1px)}
.enst-sag{display:flex;flex-direction:column;align-items:flex-end;gap:7px}
.enst-sag .ipucu{font-size:12.5px;color:var(--muted);font-style:italic}
.cycler{display:inline-flex;align-items:center;gap:6px}
.cycler .ok{width:28px;height:28px;border-radius:50%;border:1px solid var(--line);background:var(--card);color:var(--ink);font-size:15px;line-height:1;display:flex;align-items:center;justify-content:center;padding:0}
.cycler .ok:disabled{opacity:.35;cursor:default}
.cycler .ok:not(:disabled):hover{border-color:var(--acc);color:var(--acc)}
.cyc-lab{font-size:12px;color:var(--muted);min-width:132px;text-align:center}
@media(max-width:560px){.cyc-lab{min-width:92px;font-size:11px}.enst-sag .ipucu{display:none}}
.kaydir{overflow-x:auto;-webkit-overflow-scrolling:touch;padding-bottom:4px}

/* fretboard */
.fretboard{display:grid;gap:0;background:var(--ahsap);border-radius:8px;padding:0;min-width:760px;border:1px solid var(--ahsap-cizgi)}
.fb-row{display:grid;grid-template-columns:34px 44px repeat(15,minmax(40px,1fr))}
.fb-num{height:22px;display:flex;align-items:center;justify-content:center;font-size:11px;color:var(--muted)}
.fb-num.mark{color:var(--kok);font-weight:700}
.fb-name{display:flex;align-items:center;justify-content:center;font-size:13px;color:var(--muted);background:var(--card);font-weight:700}
.cell{position:relative;height:42px;border:none;background:transparent;display:flex;align-items:center;justify-content:center;border-left:2px solid var(--ahsap-cizgi)}
.cell.acik{border-left:none;border-right:4px solid var(--nut)} /* açık tel sütunu, nut çizgisi sağda */
.cell::before{content:"";position:absolute;left:0;right:0;top:50%;height:var(--telk,2px);background:var(--tel);transform:translateY(-50%)}
.cell.acik::before{right:4px}
.fb-row:nth-child(2) .cell{--telk:1.4px}
.fb-row:nth-child(3) .cell{--telk:1.7px}
.fb-row:nth-child(4) .cell{--telk:2px}
.fb-row:nth-child(5) .cell{--telk:2.4px}
.fb-row:nth-child(6) .cell{--telk:2.9px}
.fb-row:nth-child(7) .cell{--telk:3.4px}
.cell .dot{position:relative;z-index:2;width:30px;height:30px;border-radius:50%;display:none;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:#fff;background:var(--aktif);box-shadow:0 1px 3px rgba(0,0,0,.35)}
.cell.on .dot{display:flex}
.cell.kok .dot{background:var(--kok)}
.cell:hover::after{content:"";position:absolute;z-index:1;width:26px;height:26px;border-radius:50%;border:2px dashed var(--tel)}
.cell.on:hover::after{display:none}
/* perde işaret noktaları */
.fb-dots{display:grid;grid-template-columns:34px 44px repeat(15,minmax(40px,1fr));height:0}
.fb-dots span{position:relative}

/* piyano */
.piano-wrap{position:relative}
.piano{position:relative;height:158px;display:flex;user-select:none}
.wkey{position:relative;height:100%;background:var(--beyaz);border:1px solid var(--tus-cizgi);border-top:none;border-radius:0 0 6px 6px;display:flex;align-items:flex-end;justify-content:center;padding-bottom:6px}
.wkey:active{background:var(--acc-soft)}
.wkey.on{background:var(--aktif-yum);box-shadow:inset 0 0 0 2px var(--aktif)}
.wkey.on.kok{background:var(--kok-yum);box-shadow:inset 0 0 0 2px var(--kok)}
.bkey{position:absolute;top:0;height:62%;background:var(--siyah);border-radius:0 0 5px 5px;z-index:3;display:flex;align-items:flex-end;justify-content:center;padding-bottom:5px}
.bkey.on{background:var(--aktif)}
.bkey.on.kok{background:var(--kok)}
.klab{font-size:10px;font-weight:700;color:var(--muted);pointer-events:none}
.wkey.on .klab{color:var(--aktif)}
.wkey.on.kok .klab{color:var(--kok)}
.bkey .klab{color:#cdbfa6}
.bkey.on .klab{color:#fff}
.do-isaret{color:var(--muted);opacity:.7}

/* ===== paneller ===== */
.paneller{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:18px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:0 3px 12px var(--shadow);padding:16px 18px}
.panel h3{font-family:'Playfair Display',Georgia,serif;font-weight:600;font-size:18px;color:var(--ink);margin-bottom:12px}
.panel.kayit{grid-column:1 / -1}
@media(max-width:760px){.paneller{grid-template-columns:1fr}}

.ara input{width:100%;padding:11px 14px;border:1px solid var(--line);border-radius:12px;font-size:16px;background:var(--bg);color:var(--ink)}
.ara input:focus{outline:none;border-color:var(--acc)}
.ara .mesaj{font-size:13px;margin-top:8px;min-height:18px}
.ara .mesaj.hata{color:#c0392b}
.ara .mesaj.ok{color:var(--acc)}
.ornekler{margin-top:10px;display:flex;gap:6px;flex-wrap:wrap}
.ornekler button{font-size:13px;color:var(--acc);background:var(--acc-soft);border:none;border-radius:14px;padding:4px 11px}
.ornekler button:hover{filter:brightness(.97)}

.kur .grup{margin-bottom:12px}
.kur .grup>label{display:block;font-size:12.5px;color:var(--muted);margin-bottom:6px;text-transform:uppercase;letter-spacing:.04em}
.cipler{display:flex;gap:6px;flex-wrap:wrap}
.cip{font-size:13.5px;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:14px;padding:5px 11px}
.cip:hover{border-color:var(--acc)}
.cip.sec{background:var(--acc);border-color:var(--acc);color:#fff}
.cip.ek.sec{background:var(--vurgu);border-color:var(--vurgu)}
.kur .onizleme{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-top:6px;border-top:1px dashed var(--line);padding-top:12px}
.kur .onizleme .sembol{font-family:'Playfair Display',Georgia,serif;font-size:24px;color:var(--acc)}
.kur .onizleme .sembol.gecersiz{color:#c0392b;font-size:16px;font-family:Georgia,serif;font-style:italic}
.kur .onizleme button{margin-left:auto;background:var(--acc);color:#fff;border:none;border-radius:18px;padding:8px 16px;font-size:14px;font-weight:600}
.kur .onizleme button:disabled{opacity:.4}

.fav-list{display:flex;gap:8px;flex-wrap:wrap;min-height:10px}
.fav{display:inline-flex;align-items:center;gap:8px;background:var(--bg);border:1px solid var(--line);border-radius:16px;padding:6px 8px 6px 13px;font-size:14px}
.fav b{font-family:'Playfair Display',Georgia,serif;color:var(--acc);font-weight:600}
.fav .ac{cursor:pointer}
.fav .sil{border:none;background:transparent;color:var(--muted);font-size:16px;line-height:1;padding:0 2px}
.fav .sil:hover{color:#c0392b}
.fav-bos{font-size:13.5px;color:var(--muted);font-style:italic}
.skala,.oneri{font-size:14px;margin-top:14px;line-height:1.7}
.skala b,.oneri b{color:var(--ink);font-weight:600}
.skala span{color:var(--muted)}
.oneri .chip{display:inline-block;background:var(--acc-soft);color:var(--acc);border:none;border-radius:14px;padding:4px 12px;font-size:14px;margin:0 4px 4px 0;font-weight:600}
.oneri .chip:hover{filter:brightness(.97)}

.yukleniyor{padding:40px;text-align:center;color:var(--muted);font-style:italic}
</style>
</head>

<script type="module">
/* ============================================================
   nota çevirici — gitar ↔ piyano
   Tek doğruluk kaynağı: MIDI nota numarası (mutlak perde).
   Her perde ve her tuş tek bir tamsayıya iner; iki enstrüman da
   state.notes'un saf izdüşümüdür → çift yönlü senkron, döngü yok.
   ============================================================ */

const $ = (s, r=document) => r.querySelector(s);
const yuk = $('#yukleniyor');

let Note, Chord, Scale, Key, ChordType, Tone;
try {
  const tonal = await import('https://esm.sh/tonal@6.4.0');
  ({ Note, Chord, Scale, Key, ChordType } = tonal);
  // tonal'da bulunmayan ama kullanıcıların yazdığı birkaç türü kütüphaneye ekle
  // (sözlük gömmek değil — tonal'ın kendi tür kaydına genişletme)
  ChordType.add(['1P', '3M', '5P', '7M', '9M', '11P'], ['maj11', 'Maj11', 'M11'], 'major eleventh');
} catch (e) {
  yuk.textContent = 'Müzik kütüphanesi yüklenemedi — internet bağlantısını kontrol et.';
  throw e;
}
try { Tone = await import('https://esm.sh/tone@14.8.49'); } catch (e) { Tone = null; }

/* ---- sabitler ---- */
const OPEN = [40, 45, 50, 55, 59, 64];           // tepeden alta: kalın Mi → ince mi
const TEL_AD = ['E', 'A', 'D', 'G', 'B', 'e'];
const FRET = 15;
const P_LOW = 36, P_HIGH = 84;                    // C2 … C6
const PC_AD = ['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'];
const SIYAH_PC = new Set([1, 3, 6, 8, 10]);
const ISARET = new Set([3, 5, 7, 9, 12, 15]);

/* interval token → kısa derece etiketi (akor sözlüğü değil, sadece gösterim) */
const IV = {'1P':'R','2m':'♭9','2M':'9','3m':'♭3','3M':'3','4P':'11','4A':'♯11',
  '5d':'♭5','5P':'5','5A':'♯5','6m':'♭13','6M':'13','7m':'♭7','7M':'7',
  '8P':'R','9m':'♭9','9M':'9','9A':'♯9','11P':'11','11A':'♯11','13m':'♭13','13M':'13'};

/* ---- durum ----
   Bir akor tanındığında (yazılı/kurulu ya da tıklamayla tespit) gitar ve
   piyano BAĞIMSIZ diziliş listeleri üretilir; kumandalar HEMEN etkindir.
   gIndex/pIndex = -1 → "çalınan" (kullanıcının elle koyduğu notalar);
   ≥0 → o üretilmiş diziliş. İki enstrüman birbirini etkilemez. */
const state = {
  notes: new Map(),        // elle seçim: midi -> {s,f} | null
  symbol: null,            // okumada gösterilecek akor
  detected: [],            // tespit alternatifleri
  gVoicings: [], gIndex: -1,
  pVoicings: [], pIndex: -1,
  favorites: load(),
};
function load(){ try { return JSON.parse(localStorage.getItem('nota-favoriler')) || []; } catch { return []; } }
function persist(){ try { localStorage.setItem('nota-favoriler', JSON.stringify(state.favorites)); } catch {} }

/* ---- arayüzü kur ---- */
const app = $('#uygulama');
app.innerHTML = '';
app.appendChild($('#govde').content.cloneNode(true));
if (window.adlariUygula) window.adlariUygula();

/* gece modu */
const geceTus = $('#geceTus');
if (localStorage.getItem('nota-gece') === '1') document.body.classList.add('gece');
geceTus.onclick = () => {
  document.body.classList.toggle('gece');
  localStorage.setItem('nota-gece', document.body.classList.contains('gece') ? '1' : '0');
};

/* ===================== yardımcılar ===================== */
const chromaOf = m => ((m % 12) + 12) % 12;
const pcName = m => PC_AD[chromaOf(m)];

/* gitar gösterimi: açık perde tıklamaları kendi telinde sabit kalır;
   yerleşimsiz (piyanodan gelen) notalar aynı tele düşmeyecek biçimde,
   pesten tize tek tek boş tellere dağıtılır. */
function guitarPlacements(){
  const res = new Map(), used = new Set();
  for (const [midi, fr] of state.notes){ if (fr){ res.set(midi, fr); used.add(fr.s); } }
  const bos = [...state.notes.entries()].filter(([, fr]) => !fr).map(([m]) => m).sort((a, b) => a - b);
  for (const midi of bos){
    let best = null;
    for (let s = 0; s < 6; s++){
      if (used.has(s)) continue;
      const f = midi - OPEN[s];
      if (f >= 0 && f <= FRET && (best === null || f < best.f)) best = { s, f };
    }
    if (best){ res.set(midi, best); used.add(best.s); }   // boş tel kalmazsa gitarda gösterilmez
  }
  return res;
}

/* tonal akor sembolünü okunaklı biçime çevir (CM → C, Cm → Cm, A/E bası korunur) */
function prettySym(sym){
  if (!sym) return sym;
  const slash = sym.includes('/') ? '/' + sym.split('/')[1] : '';
  const base = sym.split('/')[0];
  const ch = Chord.get(base);
  if (ch.empty) return sym;
  let core;
  if (ch.type === 'major') core = ch.tonic;
  else if (ch.type === 'minor') core = ch.tonic + 'm';
  else core = ch.symbol || base;
  return core + slash;
}

/* akor sembolünden chroma → NOTA ADI haritası (enstrümanlarda gösterim;
   doğru yazımla: B♭ akorunda Bb, A# değil). Dereceler yalnız üst kartta kalır. */
function notaAdMap(symbol){
  const m = new Map();
  if (!symbol) return m;
  const ch = Chord.get(symbol);
  if (ch.empty) return m;
  ch.notes.forEach(n => m.set(Note.chroma(n), simpleNote(n)));
  return m;
}

/* aktif perdelerin chroma'larını bas-önce, oktav tekrarsız ad listesine çevir */
function aktifBasOnce(){
  const ms = [...state.notes.keys()].sort((a, b) => a - b);
  const seen = new Set(), out = [];
  for (const m of ms){ const c = chromaOf(m); if (!seen.has(c)){ seen.add(c); out.push(PC_AD[c]); } }
  return out;
}

/* çift değiştirgeçli adı sadeleştir (G## → A, Cbb → B♭); tek diyez/bemol korunur */
function simpleNote(n){ return /##|bb/.test(n) ? (Note.simplify(n) || n) : n; }

/* Chord.detect'i daha akıllı sırala: çift-değiştirgeçli (G## gibi) ve
   karmaşık aug/dim/#5 adları yerine sade Majör/minör adlarını öne al. */
function betterDetect(names){
  const raw = Chord.detect(names, { assumePerfectFifth: false }) || [];
  return raw.map(sym => ({ sym, sc: detectScore(sym) })).sort((a, b) => a.sc - b.sc).map(o => o.sym);
}
function detectScore(sym){
  const base = sym.split('/')[0];
  const ch = Chord.get(base);
  if (ch.empty) return 999;
  const dbl = ch.notes.filter(n => /##|bb/.test(n)).length;   // çift-değiştirgeç = enharmonik çirkinlik
  const t = ch.type, sy = ch.symbol || base;
  let cat;
  if (t === 'major' || t === 'minor') cat = 0;
  else if (['major seventh','minor seventh','dominant seventh','sixth','minor sixth','suspended fourth','suspended second'].includes(t)) cat = 1;
  else if (/ninth|eleventh|thirteenth/.test(t)) cat = 2;
  else if (/augmented|diminished|half/.test(t)) cat = 3;
  else cat = 2;
  if (/[#b]5/.test(sy) && (t === 'minor' || /maj/i.test(sy))) cat = Math.max(cat, 4); // m#5 / maj#5 saçmalığı
  return dbl * 10 + cat + sy.length * 0.01;
}

/* ===================== ses =====================
   Ayrı profiller: PİYANO = örneklenmiş akustik (Salamander grand, Tone.Sampler),
   GİTAR = Tone.PluckSynth (Karplus-Strong telden-çekme fiziksel modelleme);
   akor için 6 sesli havuz. İkisi de ortak 1.5sn Tone.Reverb'e bağlı. */
let reverb = null, piyanoSes = null, gitarBus = null, pluckVoices = [], pluckIdx = 0, sesAcik = false;
async function sesHazir(){
  if (!Tone) return false;
  if (sesAcik) return true;
  await Tone.start();
  reverb = new Tone.Reverb({ decay: 1.5, wet: 0.22 }).toDestination();
  piyanoSes = new Tone.Sampler({
    urls: { C2: 'C2.mp3', C3: 'C3.mp3', C4: 'C4.mp3', C5: 'C5.mp3', C6: 'C6.mp3' },
    baseUrl: 'https://tonejs.github.io/audio/salamander/', release: 1
  }).connect(reverb);
  piyanoSes.volume.value = -4;
  gitarBus = new Tone.Gain(0.7).connect(reverb);
  pluckVoices = Array.from({ length: 6 }, () =>
    new Tone.PluckSynth({ attackNoise: 0.9, dampening: 3600, resonance: 0.96, release: 1.4 }).connect(gitarBus));
  sesAcik = true;
  try { await Promise.race([Tone.loaded(), new Promise(r => setTimeout(r, 5000))]); } catch {}
  return true;
}
function pluk(midi, time){ pluckVoices[pluckIdx++ % pluckVoices.length].triggerAttack(Note.fromMidi(midi), time); }
async function calNota(midi, kind){
  if (!(await sesHazir())) return;
  if (kind === 'gitar') pluk(midi, Tone.now() + 0.02);
  else piyanoSes.triggerAttackRelease(Note.fromMidi(midi), '8n', Tone.now() + 0.02);
}
async function calMidis(midis, kind){
  if (!(await sesHazir())) return;
  const ms = [...midis].sort((a, b) => a - b);
  if (!ms.length) return;
  const now = Tone.now();
  if (kind === 'gitar') ms.forEach((m, i) => pluk(m, now + 0.02 + i * 0.045));      // strum
  else ms.forEach((m, i) => piyanoSes.triggerAttackRelease(Note.fromMidi(m), '2n', now + 0.02 + i * 0.012));
}

/* ===================== piyano çevrimleri ===================== */
function yiginla(adlar, taban){
  const out = []; let zemin = taban;
  for (const n of adlar){
    const pc = Note.chroma(n); let m = zemin;
    while (chromaOf(m) !== pc) m++;
    out.push(m); zemin = m + 1;
  }
  return out;
}
function piyanoCevrim(adlar, cevrim){
  const arr = adlar.slice();
  for (let i = 0; i < cevrim; i++) arr.push(arr.shift());
  return yiginla(arr, 52); // ~E3'ten başla, görünür alanda ortalı
}
const CEVRIM_AD = ['kök', '1. çevrim', '2. çevrim', '3. çevrim', '4. çevrim', '5. çevrim', '6. çevrim'];
function piyanoVoicings(symbol){
  const ch = Chord.get(symbol);
  if (ch.empty || !ch.notes.length) return [];
  return ch.notes.map((_, inv) => ({ label: CEVRIM_AD[inv] || (inv + '. çevrim'), midis: piyanoCevrim(ch.notes, inv) }));
}

/* ===================== gitar pozisyonları (oynanabilir) =====================
   CAGED taşınır barre şekilleri (E ve A şekli) + ezbere açık akorlar +
   anatomik kısıtlı genel arama. Her aday DOĞRULANIR: açılım ≤4 perde,
   açık tel varsa basılı notalar 1-4'te, ≤4 ayrı perde, kök sesi var. */
const OPENC = OPEN.map(chromaOf);                  // tellerin açık chroma'sı
const CAGED = { // rs = kökün bulunduğu tel; rel = barre perdesine göre [E A D G B e]
  maj:  [{ rs: 0, rel: [0, 2, 2, 1, 0, 0] }, { rs: 1, rel: [null, 0, 2, 2, 2, 0] }],
  min:  [{ rs: 0, rel: [0, 2, 2, 0, 0, 0] }, { rs: 1, rel: [null, 0, 2, 2, 1, 0] }],
  dom7: [{ rs: 0, rel: [0, 2, 0, 1, 0, 0] }, { rs: 1, rel: [null, 0, 2, 0, 2, 0] }],
  maj7: [{ rs: 0, rel: [0, 2, 1, 1, 0, 0] }, { rs: 1, rel: [null, 0, 2, 1, 2, 0] }],
  min7: [{ rs: 0, rel: [0, 2, 0, 0, 0, 0] }, { rs: 1, rel: [null, 0, 2, 0, 1, 0] }],
};
const ACIK = { // ezbere açık akorlar (E/A şeklinin açık biçimi CAGED'ten zaten çıkar)
  'C:maj': [null, 3, 2, 0, 1, 0], 'G:maj': [3, 2, 0, 0, 0, 3], 'D:maj': [null, null, 0, 2, 3, 2],
  'D:min': [null, null, 0, 2, 3, 1],
  'C:dom7': [null, 3, 2, 3, 1, 0], 'G:dom7': [3, 2, 0, 0, 0, 1], 'D:dom7': [null, null, 0, 2, 1, 2], 'B:dom7': [null, 2, 1, 2, 0, 2],
  'C:maj7': [null, 3, 2, 0, 0, 0], 'G:maj7': [3, 2, 0, 0, 0, 2], 'D:maj7': [null, null, 0, 2, 2, 2],
  'D:min7': [null, null, 0, 2, 1, 1],
};
function nitelikAnahtari(ch){
  const I = new Set(ch.intervals);
  const ext = ['6M', '6m', '9M', '9m', '9A', '11P', '11A', '13M', '13m'].some(x => I.has(x));
  const third = I.has('3M') ? 'M' : I.has('3m') ? 'm' : null;
  const sev = I.has('7M') ? 'maj' : I.has('7m') ? 'dom' : null;
  const fifth = I.has('5P') ? 'P' : null;
  if (ext || !third || !fifth) return null;        // genişletilmiş/aug/dim/sus → genel arama
  if (third === 'M' && !sev) return 'maj';
  if (third === 'm' && !sev) return 'min';
  if (third === 'M' && sev === 'dom') return 'dom7';
  if (third === 'M' && sev === 'maj') return 'maj7';
  if (third === 'm' && sev === 'dom') return 'min7';
  return null;
}
/* bir grip'i doğrula → geçerliyse {frets,minFret,strings,isRoot} */
function dogrula(sec, pcSet, rootC){
  const sesli = [];
  sec.forEach((f, s) => { if (f !== null && f >= 0 && f <= FRET) sesli.push({ s, f, midi: OPEN[s] + f }); });
  if (sesli.length < 4) return null;
  for (const x of sesli) if (!pcSet.has(chromaOf(x.midi))) return null;   // yabancı ses yok
  const chromas = new Set(sesli.map(x => chromaOf(x.midi)));
  if (!chromas.has(rootC)) return null;                                   // kök bulunmalı
  if (chromas.size < Math.min(pcSet.size, 3)) return null;
  const basili = sesli.map(x => x.f).filter(f => f > 0);
  const minF = basili.length ? Math.min(...basili) : 0;
  const maxF = basili.length ? Math.max(...basili) : 0;
  const acik = sesli.some(x => x.f === 0);
  if (maxF - minF > 4) return null;                                       // 4 perdeden geniş = olanaksız
  if (acik && maxF > 4) return null;                                      // açık tel + yüksek perde = olanaksız
  if (new Set(basili).size > 4) return null;                             // 4'ten çok ayrı perde (parmak)
  const bass = sesli.reduce((a, b) => a.midi < b.midi ? a : b);
  // çalan teller arasında SIKIŞMIŞ susturulmuş tel (ör. 6-4-3-1 çal, 5-2 sustur) → çirkin
  const teller = new Set(sesli.map(x => x.s)), sMin = Math.min(...teller), sMax = Math.max(...teller);
  let trapped = 0; for (let s = sMin + 1; s < sMax; s++) if (!teller.has(s)) trapped++;
  return { frets: sesli, minFret: minF, span: maxF - minF, strings: sesli.length, isRoot: chromaOf(bass.midi) === rootC, acik, trapped };
}
function genelGritler(pcSet){
  const grids = [], pick = (lo, hi, acikIzin) => {
    const sec = [];
    for (let s = 0; s < 6; s++){
      const ops = [];
      if (acikIzin && pcSet.has(OPENC[s])) ops.push(0);
      for (let f = Math.max(lo, 1); f <= hi; f++) if (pcSet.has(chromaOf(OPEN[s] + f))) ops.push(f);
      sec.push(ops.length ? Math.min(...ops) : null);
    }
    return sec;
  };
  grids.push(pick(1, 4, true));                                  // açık pozisyon
  for (let b = 1; b <= 11; b++) grids.push(pick(b, b + 4, false)); // taşınır pozisyonlar
  return grids;
}
function gitarEtiket(v){
  if (v.minFret === 0 || (v.acik && v.minFret <= 3)) return v.isRoot ? 'açık akor' : 'açık · çevrim';
  return `${v.minFret}. perde${v.isRoot ? '' : ' · çevrim'}`;
}
function gitarVoicings(symbol){
  const ch = Chord.get(symbol);
  if (ch.empty || !ch.notes.length) return [];
  const pcSet = new Set(ch.notes.map(n => Note.chroma(n)));
  const rootC = Note.chroma(ch.tonic || ch.notes[0]);
  const anahtar = nitelikAnahtari(ch), rootName = PC_AD[rootC];
  const cands = []; // {sec, tier}  (tier küçük = daha pratik/öncelikli)
  if (anahtar && ACIK[rootName + ':' + anahtar]) cands.push({ sec: ACIK[rootName + ':' + anahtar], tier: 0 });
  if (anahtar) for (const sh of CAGED[anahtar]){
    const barre = ((rootC - OPENC[sh.rs]) % 12 + 12) % 12;
    const sec = sh.rel.map(r => r === null ? null : barre + r);
    if (sec.every(f => f === null || f <= FRET)) cands.push({ sec, tier: barre === 0 ? 0 : 1 }); // açık cowboy / CAGED barre
    if (barre + 12 <= FRET - 2) cands.push({ sec: sh.rel.map(r => r === null ? null : barre + 12 + r), tier: 1 });
  }
  genelGritler(pcSet).forEach(sec => cands.push({ sec, tier: 2 }));   // diğer pratik diziliş
  const gor = new Set(), out = [];
  for (const c of cands){
    const v = dogrula(c.sec, pcSet, rootC); if (!v) continue;
    const sig = v.frets.map(x => x.s + '.' + x.f).sort().join('-');
    if (gor.has(sig)) continue; gor.add(sig);
    v.tier = c.tier; v.label = gitarEtiket(v);
    out.push(v);
  }
  // STANDART OYNANABİLİRLİK sırası (saf "0. perdeye yakınlık" değil):
  //   Sıra 1: açık "cowboy" akorları (E/A/C/G/D şekilleri)  → tier 0
  //   Sıra 2: CAGED barre (E-şekli / A-şekli)               → tier 1
  //   Sıra 3: diğer pratik dizilişler                        → tier 2
  // sonra: sıkışmış sus tel cezası, boyun aşağıda, kök-bas, dolu, derli toplu.
  out.sort((a, b) =>
    a.tier - b.tier || a.trapped - b.trapped || a.minFret - b.minFret ||
    (b.isRoot - a.isRoot) || (b.strings - a.strings) || (a.span - b.span));
  return out.slice(0, 8);
}

/* ===================== tespit + diziliş ===================== */
/* elle seçimden akoru tespit et VE her iki enstrümanın diziliş listesini üret;
   indeksleri -1'e al (çalınanı göster) — kumandalar yine de etkin olur. */
function tespitEt(){
  state.detected = state.notes.size >= 2 ? betterDetect(aktifBasOnce()) : [];
  state.symbol = state.detected[0] || null;
  if (state.symbol && state.notes.size){
    // kullanıcının elle kurduğu şekli "senin seçimin" olarak index 0'a koy;
    // kullanıcı çevrimlerde gezip kendi şekline geri dönebilsin.
    const gFrets = [...guitarPlacements()].map(([midi, fr]) => ({ s: fr.s, f: fr.f, midi }));
    state.gVoicings = [{ label: 'senin seçimin', manual: true, frets: gFrets }, ...gitarVoicings(state.symbol)];
    state.pVoicings = [{ label: 'senin seçimin', manual: true, midis: [...state.notes.keys()].sort((a, b) => a - b) }, ...piyanoVoicings(state.symbol)];
    state.gIndex = 0; state.pIndex = 0;
  } else {
    state.gVoicings = []; state.pVoicings = [];
    state.gIndex = -1; state.pIndex = -1;
  }
}

/* ===================== eylemler ===================== */
function akorUygula(symbol){
  let ch = Chord.get(symbol);
  if ((ch.empty || !ch.notes.length) && symbol.includes('/')){ symbol = symbol.split('/')[0]; ch = Chord.get(symbol); }
  if (ch.empty || !ch.notes.length) return false;
  state.symbol = ch.symbol || symbol;
  state.notes.clear();
  state.gVoicings = gitarVoicings(state.symbol);
  state.pVoicings = piyanoVoicings(state.symbol);
  state.gIndex = 0; state.pIndex = 0;   // ilk (en pes) gitar pozisyonu / piyano kök
  state.detected = betterDetect(ch.notes.map(n => PC_AD[Note.chroma(n)]));
  ciz();
  return true;
}
function temizle(){
  state.notes.clear(); state.symbol = null; state.detected = [];
  state.gVoicings = []; state.pVoicings = []; state.gIndex = -1; state.pIndex = -1;
  ciz();
}
/* gösterilen üretilmiş dizilişten elle seçime geçerken tohumla */
function gitarVoicingNotalari(){
  const v = state.gVoicings[state.gIndex], m = new Map();
  if (v) v.frets.forEach(x => m.set(x.midi, { s: x.s, f: x.f }));
  return m;
}
function piyanoVoicingNotalari(){
  const v = state.pVoicings[state.pIndex], m = new Map();
  if (v) v.midis.forEach(mi => m.set(mi, null));
  return m;
}
function perdeTikla(s, f){
  if (state.gIndex >= 0) state.notes = gitarVoicingNotalari(); // gitar dizilişinden devam et
  state.gIndex = -1; state.pIndex = -1;
  const midi = OPEN[s] + f, cur = state.notes.get(midi);
  if (state.notes.has(midi) && cur && cur.s === s && cur.f === f){ state.notes.delete(midi); }
  else { state.notes.set(midi, { s, f }); calNota(midi, 'gitar'); }
  tespitEt(); ciz();
}
function tusTikla(midi){
  if (state.pIndex >= 0) state.notes = piyanoVoicingNotalari(); // piyano dizilişinden devam et
  state.gIndex = -1; state.pIndex = -1;
  if (state.notes.has(midi)){ state.notes.delete(midi); }
  else { state.notes.set(midi, null); calNota(midi, 'piyano'); }
  tespitEt(); ciz();
}
/* çal düğmelerinin çalacağı: o an enstrümanda GÖRÜNEN tam notalar */
function aktifGitarMidis(){
  if (state.gIndex >= 0 && state.gVoicings[state.gIndex]) return state.gVoicings[state.gIndex].frets.map(x => x.midi);
  return [...guitarPlacements().keys()];
}
function aktifPiyanoMidis(){
  if (state.pIndex >= 0 && state.pVoicings[state.pIndex]) return state.pVoicings[state.pIndex].midis.slice();
  return [...state.notes.keys()];
}

/* ===================== çizim ===================== */
const fb = $('#fretboard');
const piano = $('#piano');

function fretboardKur(){
  // perde numarası satırı
  const numRow = document.createElement('div'); numRow.className = 'fb-row';
  numRow.appendChild(cell('fb-num', '')); numRow.appendChild(cell('fb-num', '0'));
  for (let f = 1; f <= FRET; f++) numRow.appendChild(cell('fb-num' + (ISARET.has(f) ? ' mark' : ''), String(f)));
  fb.appendChild(numRow);
  // her tel bir satır — TAB düzeni: tepede ince mi (s=5), altta kalın Mi (s=0)
  for (let s = 5; s >= 0; s--){
    const row = document.createElement('div'); row.className = 'fb-row';
    const nm = document.createElement('div'); nm.className = 'fb-name'; nm.textContent = TEL_AD[s];
    row.appendChild(nm);
    for (let f = 0; f <= FRET; f++){
      const b = document.createElement('button');
      b.className = 'cell' + (f === 0 ? ' acik' : '');
      b.dataset.s = s; b.dataset.f = f;
      const dot = document.createElement('span'); dot.className = 'dot';
      b.appendChild(dot);
      b.onclick = () => perdeTikla(s, f);
      row.appendChild(b);
    }
    fb.appendChild(row);
  }
  function cell(cls, txt){ const d = document.createElement('div'); d.className = cls; d.textContent = txt; return d; }
}

let whiteW = 38;
function piyanoKur(){
  piano.innerHTML = '';
  const whites = [], blacks = [];
  for (let m = P_LOW; m <= P_HIGH; m++){
    if (SIYAH_PC.has(chromaOf(m))) blacks.push({ m, before: whites.length - 1 });
    else whites.push({ m });
  }
  piano.style.width = (whites.length * whiteW) + 'px';
  whites.forEach(w => {
    const k = document.createElement('button');
    k.className = 'wkey'; k.dataset.midi = w.m; k.style.width = whiteW + 'px'; k.style.flex = '0 0 auto';
    const lab = document.createElement('span'); lab.className = 'klab';
    if (chromaOf(w.m) === 0){ lab.textContent = 'C' + (Math.floor(w.m / 12) - 1); lab.classList.add('do-isaret'); }
    k.appendChild(lab);
    k.onclick = () => tusTikla(w.m);
    piano.appendChild(k);
  });
  const bw = whiteW * 0.62;
  blacks.forEach(b => {
    const k = document.createElement('button');
    k.className = 'bkey'; k.dataset.midi = b.m; k.style.width = bw + 'px';
    k.style.left = ((b.before + 1) * whiteW - bw / 2) + 'px';
    const lab = document.createElement('span'); lab.className = 'klab'; k.appendChild(lab);
    k.onclick = () => tusTikla(b.m);
    piano.appendChild(k);
  });
}

function ciz(){
  const sym = state.symbol;
  const nmap = notaAdMap(sym);   // enstrümanlarda nota adı göster (derece değil)
  const kokChroma = sym ? Note.chroma(Chord.get(sym).tonic || '') : -1;

  // gitar ve piyano BAĞIMSIZ: ≥0 → üretilmiş diziliş; -1 → çalınan (elle notalar)
  const gOn = new Map();   // "s:f" -> midi
  const pOn = new Set();   // midi
  if (state.gIndex >= 0 && state.gVoicings[state.gIndex]) state.gVoicings[state.gIndex].frets.forEach(x => gOn.set(x.s + ':' + x.f, x.midi));
  else for (const [midi, fr] of guitarPlacements()) gOn.set(fr.s + ':' + fr.f, midi);
  if (state.pIndex >= 0 && state.pVoicings[state.pIndex]) state.pVoicings[state.pIndex].midis.forEach(m => pOn.add(m));
  else for (const midi of state.notes.keys()) pOn.add(midi);

  fb.querySelectorAll('.cell').forEach(c => {
    const midi = gOn.get(c.dataset.s + ':' + c.dataset.f);
    const on = midi !== undefined;
    c.classList.toggle('on', on);
    c.classList.toggle('kok', on && chromaOf(midi) === kokChroma);
    if (on) c.querySelector('.dot').textContent = nmap.get(chromaOf(midi)) || pcName(midi);
  });
  piano.querySelectorAll('.wkey,.bkey').forEach(k => {
    const midi = +k.dataset.midi, on = pOn.has(midi);
    k.classList.toggle('on', on);
    k.classList.toggle('kok', on && chromaOf(midi) === kokChroma);
    const lab = k.querySelector('.klab');
    if (on) lab.textContent = nmap.get(chromaOf(midi)) || pcName(midi);
    else if (k.classList.contains('wkey') && chromaOf(midi) === 0) lab.textContent = 'C' + (Math.floor(midi / 12) - 1);
    else lab.textContent = '';
  });

  okumaCiz();
  cyclersCiz();
}

function okumaCiz(){
  const ad = $('#ad'), adAlt = $('#adAlt'), bilgi = $('#bilgi');
  if (!state.symbol && !state.notes.size){
    ad.firstChild.nodeValue = '—'; adAlt.textContent = 'bir akor seç';
    bilgi.innerHTML = '<span class="et">Gitar perdesine ya da piyano tuşuna bas; akoru yaz ya da kur.</span>';
    return;
  }
  if (state.symbol){
    const ch = Chord.get(state.symbol);
    ad.firstChild.nodeValue = prettySym(state.symbol);
    adAlt.textContent = ch.name || '';
    const notes = ch.notes.map(simpleNote).join(' · ');
    const ints = ch.intervals.map(t => IV[t] || t).join(' ');
    const primary = prettySym(state.symbol), gor = new Set([primary]), alts = [];
    for (const d of state.detected){ const p = prettySym(d); if (!gor.has(p)){ gor.add(p); alts.push(d); } if (alts.length >= 4) break; }
    const alt = alts.length ? `<div class="alt-akorlar">${alts.map(a => `<button data-a="${a}">${prettySym(a)}</button>`).join('')}</div>` : '';
    bilgi.innerHTML = `<span class="et">Notalar:</span> ${notes}<br><span class="et">Dereceler:</span> ${ints}${alt}`;
    bilgi.querySelectorAll('.alt-akorlar button').forEach(b => b.onclick = () => akorUygula(b.dataset.a));
  } else {
    ad.firstChild.nodeValue = '?'; adAlt.textContent = 'tanımlanamadı';
    const ms = [...state.notes.keys()].sort((a, b) => a - b);
    bilgi.innerHTML = `<span class="et">Seçili notalar:</span> ${ms.map(pcName).join(' · ')} <span class="et">(akor tanınmadı — birkaç nota daha?)</span>`;
  }
}

function cyclersCiz(){
  const gv = state.gVoicings, gOk = gv.length > 0;
  $('#gPrev').disabled = !gOk; $('#gNext').disabled = !gOk;
  $('#gLab').textContent = !gOk ? '—' : (state.gIndex < 0 ? 'çalınan' : `${gv[state.gIndex].label} · ${state.gIndex + 1}/${gv.length}`);
  const pv = state.pVoicings, pOk = pv.length > 0;
  $('#pPrev').disabled = !pOk; $('#pNext').disabled = !pOk;
  $('#pLab').textContent = !pOk ? '—' : (state.pIndex < 0 ? 'çalınan' : `${pv[state.pIndex].label} · ${state.pIndex + 1}/${pv.length}`);
}

/* ===================== düğmeler + bağımsız çevrim okları + çal ===================== */
function gStep(d){ const n = state.gVoicings.length; if (!n) return; state.gIndex = state.gIndex < 0 ? (d > 0 ? 0 : n - 1) : (state.gIndex + d + n) % n; ciz(); }
function pStep(d){ const n = state.pVoicings.length; if (!n) return; state.pIndex = state.pIndex < 0 ? (d > 0 ? 0 : n - 1) : (state.pIndex + d + n) % n; ciz(); }
$('#temizleTus').onclick = temizle;
$('#kaydet').onclick = kaydet;
$('#gPrev').onclick = () => gStep(-1);
$('#gNext').onclick = () => gStep(1);
$('#pPrev').onclick = () => pStep(-1);
$('#pNext').onclick = () => pStep(1);
$('#gCal').onclick = () => calMidis(aktifGitarMidis(), 'gitar');
$('#pCal').onclick = () => calMidis(aktifPiyanoMidis(), 'piyano');

/* ===================== arama ===================== */
const ara = $('#ara'), araMesaj = $('#araMesaj');
let araT;
ara.oninput = () => {
  clearTimeout(araT);
  araT = setTimeout(() => {
    const q = ara.value.trim();
    if (!q){ araMesaj.textContent = ''; araMesaj.className = 'mesaj'; return; }
    const ch = Chord.get(q);
    if (ch.empty || !ch.notes.length){ araMesaj.textContent = 'tanınmadı'; araMesaj.className = 'mesaj hata'; return; }
    akorUygula(q);
    araMesaj.textContent = `${ch.name || ch.symbol} — ${ch.notes.join(' ')}`;
    araMesaj.className = 'mesaj ok';
  }, 180);
};
ara.onkeydown = e => { if (e.key === 'Enter') ara.blur(); };
const ORNEK = ['Cmaj7', 'Am7', 'F#m7b5', 'G13', 'Em(add9)', 'Cmaj11', 'Daug', 'Bdim7', 'A7sus4'];
$('#ornekler').innerHTML = ORNEK.map(s => `<button>${s}</button>`).join('');
$('#ornekler').querySelectorAll('button').forEach(b => b.onclick = () => { ara.value = b.textContent; ara.oninput(); });

/* ===================== akor kurucu ===================== */
const NITELIK = [['maj', ''], ['min', 'm'], ['dim', 'dim'], ['aug', 'aug'], ['sus2', 'sus2'], ['sus4', 'sus4']];
const YAPI = [['—', ''], ['6', '6'], ['7', '7'], ['maj7', 'maj7'], ['9', '9'], ['maj9', 'maj9'],
  ['11', '11'], ['maj11', 'maj11'], ['13', '13'], ['maj13', 'maj13']];
const EK = ['add9', 'b5', '#5', 'b9', '#9', '#11', 'b13'];
const kur = { kok: 'C', nitelik: '', yapi: '', ek: new Set() };

function cipler(host, items, aktifTest, onSec, ekMi){
  host.innerHTML = '';
  items.forEach(it => {
    const [lab, val] = Array.isArray(it) ? it : [it, it];
    const b = document.createElement('button');
    b.className = 'cip' + (ekMi ? ' ek' : '') + (aktifTest(val) ? ' sec' : '');
    b.textContent = lab; b.onclick = () => onSec(val, b);
    host.appendChild(b);
  });
}
function kurCiz(){
  cipler($('#kurKok'), PC_AD, v => kur.kok === v, v => { kur.kok = v; kurCiz(); kurOnizle(); });
  cipler($('#kurNitelik'), NITELIK, v => kur.nitelik === v, v => { kur.nitelik = v; kurCiz(); kurOnizle(); });
  cipler($('#kurYapi'), YAPI, v => kur.yapi === v, v => { kur.yapi = v; kurCiz(); kurOnizle(); });
  cipler($('#kurEk'), EK, v => kur.ek.has(v), v => { kur.ek.has(v) ? kur.ek.delete(v) : kur.ek.add(v); kurCiz(); kurOnizle(); }, true);
  kurOnizle();
}
function kurSembolDene(){
  // sembolü kur ve tonal'da geçerli bir varyant bul (sözlük değil; doğrulama)
  const adaylar = [];
  const base = kur.nitelik, yapi = kur.yapi, ek = [...kur.ek].join('');
  adaylar.push(kur.kok + base + yapi + ek);
  if (base === 'm' && yapi === 'maj7') adaylar.push(kur.kok + 'mM7' + ek, kur.kok + 'minMaj7' + ek);
  if (base === 'aug') adaylar.push(kur.kok + '+' + yapi + ek, kur.kok + 'aug' + yapi + ek);
  if (yapi === 'maj7') adaylar.push(kur.kok + base + 'M7' + ek);
  for (const a of adaylar){ const ch = Chord.get(a); if (!ch.empty && ch.notes.length) return { ok: true, symbol: ch.symbol || a, ch }; }
  return { ok: false };
}
function kurOnizle(){
  const r = kurSembolDene(), el = $('#kurSembol'), btn = $('#kurUygula');
  if (r.ok){ el.textContent = r.symbol; el.className = 'sembol'; btn.disabled = false; btn.dataset.symbol = r.symbol; }
  else { el.textContent = 'bu birleşim geçersiz'; el.className = 'sembol gecersiz'; btn.disabled = true; }
}
$('#kurUygula').onclick = e => { const s = e.target.dataset.symbol; if (s) akorUygula(s); };

/* ===================== favoriler · gam · öneri ===================== */
function kaydet(){
  if (!state.symbol && !state.notes.size) return;
  const sym = state.symbol;
  const noteNames = sym && !Chord.get(sym).empty ? Chord.get(sym).notes.map(simpleNote) : aktifBasOnce();
  const label = sym ? prettySym(sym) : noteNames.join(' ');
  state.favorites.push({ symbol: sym, label, noteNames });
  persist(); favCiz();
}
function favCiz(){
  const host = $('#favList');
  if (!state.favorites.length){ host.innerHTML = '<span class="fav-bos">Henüz kayıt yok — bir akor seçip ★ Kaydet de.</span>'; }
  else {
    host.innerHTML = '';
    state.favorites.forEach((f, i) => {
      const el = document.createElement('span'); el.className = 'fav';
      el.innerHTML = `<b class="ac">${f.label}</b><button class="sil" title="sil">×</button>`;
      el.querySelector('.ac').onclick = () => { if (f.symbol) akorUygula(f.symbol); };
      el.querySelector('.sil').onclick = () => { state.favorites.splice(i, 1); persist(); favCiz(); };
      host.appendChild(el);
    });
  }
  gamCiz();
}
function tumNotalar(){
  const seen = new Set();
  state.favorites.forEach(f => (f.noteNames || []).forEach(n => seen.add(PC_AD[Note.chroma(n)])));
  return [...seen];
}
function gamCiz(){
  const sk = $('#skala'), on = $('#oneri');
  const pcs = tumNotalar();
  if (pcs.length < 2){ sk.textContent = '— en az iki farklı akor kaydet'; on.textContent = '—'; return; }
  const scales = Scale.detect(pcs);
  sk.textContent = scales.length ? scales.slice(0, 3).join('  ·  ') : 'belirgin bir gam çıkmadı';
  // öneri
  const sug = oneriHesap(scales);
  if (!sug.length){ on.textContent = '—'; return; }
  on.innerHTML = sug.map(s => `<button class="chip">${s}</button>`).join('');
  on.querySelectorAll('.chip').forEach(b => b.onclick = () => akorUygula(b.textContent));
}
function oneriHesap(scales){
  if (!scales.length || !state.favorites.length) return [];
  const top = scales[0];                       // örn. "C major"
  const sp = top.split(' '); const tonic = sp[0]; const type = sp.slice(1).join(' ');
  let triads = null;
  if (type === 'major') triads = Key.majorKey(tonic).triads;
  else if (type === 'minor' || type === 'aeolian') triads = Key.minorKey(tonic).natural.triads;
  if (!triads) return [];
  const scaleNotes = Scale.get(top).notes;
  const son = state.favorites[state.favorites.length - 1];
  const kok = son.symbol ? (Chord.get(son.symbol).tonic || son.noteNames[0]) : son.noteNames[0];
  let deg = scaleNotes.findIndex(n => Note.chroma(n) === Note.chroma(kok));
  // yaygın ilerleme hareketleri (derece → hedef dereceler)
  const HAREKET = { 0: [3, 4, 5], 1: [4, 0], 2: [5, 3], 3: [4, 1, 0], 4: [0, 5, 3], 5: [3, 1, 4], 6: [0] };
  const hedef = (deg >= 0 ? HAREKET[deg] : [4, 5, 3]) || [4, 5, 3];
  const out = [];
  hedef.forEach(d => { if (triads[d] && !out.includes(triads[d])) out.push(triads[d]); });
  return out.slice(0, 3);
}

/* ===================== başlat ===================== */
fretboardKur();
piyanoKur();
kurCiz();
favCiz();
ciz();
$('#yukleniyor')?.remove();
</script>
