/* popover'ı yeniden çiz (geri-al sonrası blok nesnesi değişmiş olabilir → id ile yeniden bul) */
function arpPopYenile(){
  if (!arpPop) return;
  const f = bulBlok(arpPop.b.id);
  if (!f){ arpPopKapat(); return; }
  arpPopAc(f.blk, f.track, document.querySelector(`.lane-blok[data-bid="${f.blk.id}"]`));
}
/* sırayı bloğa yaz: boş dizi = varsayılana dön. Düzenleme arpeji açar, vuruşu sıra uzunluğuna eşitler. */
function arpYaz(seq){
  if (!arpPop) return;
  gecmisAl();
  const b = arpPop.b;
  if (seq.length){ b.arpSeq = seq; b.hits = Math.min(ARP_MAX, seq.length); b.arp = true; }
  else delete b.arpSeq;
  delete b.arpOff;
  if (looper.playing) looperBaslat();
  lanesCiz(); arpPopYenile();
}
function arpAdimEkle(n){
  if (!arpPop || !n) return;
  const seq = arpSira(arpPop.b, arpPop.tr).map(x => ({ ...x }));
  if (seq.length >= ARP_MAX) return;
  const i = arpPop.sel != null ? arpPop.sel + 1 : seq.length;
  seq.splice(i, 0, { ...n });
  arpPop.sel = i;                                   // art arda eklenenler sırayla dizilsin
  if (!n.r) tekNotaDinle(arpPop.tr, n.m);
  arpYaz(seq);
}
function arpAdimTasi(yon){
  if (!arpPop || arpPop.sel == null) return;
  const seq = arpSira(arpPop.b, arpPop.tr).map(x => ({ ...x })), i = arpPop.sel, j = i + yon;
  if (j < 0 || j >= seq.length) return;
  [seq[i], seq[j]] = [seq[j], seq[i]];
  arpPop.sel = j;
  arpYaz(seq);
}
function arpAdimSil(){
  if (!arpPop || arpPop.sel == null) return;
  const seq = arpSira(arpPop.b, arpPop.tr).map(x => ({ ...x }));
  if (seq.length <= 1) return;                      // son adım silinmez (sessiz arpej olmasın)
  seq.splice(arpPop.sel, 1);
  arpPop.sel = Math.min(arpPop.sel, seq.length - 1);
  arpYaz(seq);
}
async function arpDinle(){
  if (!arpPop || !(await sesHazir())) return;
  enstHazir(arpPop.tr);
  const { b, tr } = arpPop, sira = arpSira(b, tr);
  const adim = Math.min(0.45, b.dur * 60 / looper.bpm / sira.length), t0 = Tone.now() + 0.05;
  sira.forEach((n, i) => { if (!n.r) trackNota(tr, n.m, t0 + i * adim); });
}
function arpPopKapat(){ const pop = $('#arpPop'); if (pop){ pop.classList.remove('acik'); pop.setAttribute('aria-hidden', 'true'); } arpPop = null; }

  document.addEventListener('keydown', e => {
    if (!drumAcik()) return;
    if (e.key === 'Escape'){ e.preventDefault(); drumKapat(); }
    e.stopImmediatePropagation();
  }, true);
  // arpej voicing popover: dışarı tıkla / Esc ile kapat
  document.addEventListener('mousedown', e => { if (arpPop && !e.target.closest('#arpPop') && !e.target.closest('.lb-disli')) arpPopKapat(); });
  document.addEventListener('keydown', e => {
    if (!arpPop) return;
    if (e.key === 'Escape'){ e.stopImmediatePropagation(); arpPopKapat(); }
    else if (arpPop.sel != null && ['ArrowLeft', 'ArrowRight', 'Backspace', 'Delete'].includes(e.key)){   // seçili ADIM üzerinde çalış (blok değil)
      e.preventDefault(); e.stopImmediatePropagation();
      if (e.key === 'ArrowLeft') arpAdimTasi(-1); else if (e.key === 'ArrowRight') arpAdimTasi(1); else arpAdimSil();
    }
  }, true);
  const lanesEl = $('#lanes'); if (lanesEl) lanesEl.addEventListener('scroll', () => { if (arpPop) arpPopKapat(); });
  if (lanesEl){
    lanesEl.addEventListener('wheel', e => {
      if (e.ctrlKey || e.metaKey){ e.preventDefault(); zoomDegis(e.deltaY < 0 ? 1 : -1); return; }
      if (e.shiftKey || Math.abs(e.deltaX) > Math.abs(e.deltaY)){ looper.takipDur = performance.now() + 3000; return; }   // zaten yatay
      const max = lanesEl.scrollWidth - lanesEl.clientWidth; if (max <= 0) return;
      const yeni = Math.max(0, Math.min(max, lanesEl.scrollLeft + e.deltaY));
      if (yeni === lanesEl.scrollLeft) return;                 // uçtaysa sayfa kaymaya devam etsin
      e.preventDefault(); lanesEl.scrollLeft = yeni; looper.takipDur = performance.now() + 3000;
    }, { passive: false });
    let panYuttu = false;
    const yut = () => { panYuttu = true; setTimeout(() => { panYuttu = false; }, 0); };
    const surukTemizle = () => {
      const h = $('#surukHayalet'); if (h) h.remove();
      const im = $('#birakIm'); if (im) im.style.display = 'none';
      document.body.classList.remove('surukleniyor');
      document.querySelectorAll('.lane-blok.tasiniyor').forEach(x => x.classList.remove('tasiniyor'));
    };
    lanesEl.addEventListener('pointerdown', e => {
      if (e.pointerType !== 'mouse' || e.button !== 0) return;
      if (e.target.closest('.lane-bas, .cetvel, button, select, input')) return;
      const blokEl = e.target.closest('.lane-blok');
      if (blokEl && e.target.closest('.lb-kenar')){              // sağ kenar: süre
        const f = bulBlok(+blokEl.dataset.bid);
        if (f){ sr = { tip: 'sure', f, el: blokEl, x: e.clientX, w0: f.blk.dur * PXB, dur0: f.blk.dur, yeni: f.blk.dur }; e.preventDefault(); }
        return;
      }
      if (blokEl){                                               // blok: taşı (seçili grup varsa hepsi)
        const f = bulBlok(+blokEl.dataset.bid); if (!f) return;
        const sc = secilenler(), grup = sc && sc.bloklar.length > 1 && sc.bloklar.includes(f.blk) ? sc.bloklar : [f.blk];
        sr = { tip: 'blok', track: f.track, bloklar: grup, x: e.clientX, y: e.clientY, aktif: false, ad: grup.length > 1 ? grup.length + ' blok' : (f.blk.perc ? 'ritim' : f.blk.label) };
        return;
      }
      sr = { tip: 'pan', x: e.clientX, sl: lanesEl.scrollLeft, aktif: false };   // boş alan: kaydır
    });
    const hedefBul = e => {
      const alt = document.elementFromPoint(e.clientX, e.clientY), lane = alt && alt.closest && alt.closest('.lane');
      const trk = lane && lane.querySelector('.lane-track[data-tid]'), im = (() => { let x = $('#birakIm'); if (!x){ x = document.createElement('div'); x.id = 'birakIm'; $('#lanesIc').appendChild(x); } return x; })();
      const track = trk && looper.tracks.find(t => t.id === +trk.dataset.tid);
      const kaynakTur = sr.tip === 'blok' ? blokTur(sr.bloklar[0]) : 'akor';
      if (!track || kanalTur(track) !== kaynakTur){ sr.hedef = null; im.style.display = 'none'; return; }
      const haric = (sr.tip === 'blok' && !sr.kopya) ? new Set(sr.bloklar.map(b => b.id)) : new Set();
      const els = [...trk.querySelectorAll('.lane-blok')].filter(x => !haric.has(+x.dataset.bid));
      let idx = els.length, imX = els.length ? els[els.length - 1].getBoundingClientRect().right : trk.getBoundingClientRect().left;
      for (let i = 0; i < els.length; i++){ const r = els[i].getBoundingClientRect(); if (e.clientX < r.left + r.width / 2){ idx = i; imX = r.left; break; } }
      const icR = $('#lanesIc').getBoundingClientRect(), lr = lane.getBoundingClientRect();
      im.style.display = 'block'; im.style.left = (imX - icR.left - 2) + 'px'; im.style.top = (lr.top - icR.top) + 'px'; im.style.height = lr.height + 'px';
      sr.hedef = { track, idx };
    };
    window.addEventListener('pointermove', e => {
      if (!sr) return;
      const dx = e.clientX - sr.x;
      if (sr.tip === 'pan'){
        if (!sr.aktif && Math.abs(dx) < 6) return;
        sr.aktif = true; lanesEl.classList.add('kayiyor');
        lanesEl.scrollLeft = sr.sl - dx; looper.takipDur = performance.now() + 3000;
      } else if (sr.tip === 'sure'){
        const istenen = (sr.w0 + dx) / PXB; let en = DUR_BEATS[0];
        DUR_BEATS.forEach(d => { if (Math.abs(d - istenen) < Math.abs(en - istenen)) en = d; });
        sr.yeni = en; sr.el.style.width = (en * PXB - 4) + 'px'; sr.el.style.marginRight = '';
        const rz = sr.el.querySelector('.lb-sure'); if (rz && rz.firstChild) rz.firstChild.textContent = DUR_AD[en];
      } else {
        if (!sr.aktif && Math.hypot(dx, e.clientY - sr.y) < 6) return;
        if (!sr.aktif){
          sr.aktif = true; document.body.classList.add('surukleniyor');
          const h = document.createElement('div'); h.id = 'surukHayalet'; h.className = 'suruk-hayalet'; h.textContent = sr.ad; document.body.appendChild(h);
          if (sr.tip === 'blok') sr.bloklar.forEach(b => { const el = document.querySelector(`.lane-blok[data-bid="${b.id}"]`); if (el) el.classList.add('tasiniyor'); });
        }
        sr.kopya = e.altKey && sr.tip === 'blok';
        const h = $('#surukHayalet'); if (h){ h.style.left = e.clientX + 'px'; h.style.top = e.clientY + 'px'; h.textContent = (sr.kopya ? '+ ' : '') + sr.ad; }
        const lr = lanesEl.getBoundingClientRect();              // kenara yaklaşınca çizelge kayar
        if (e.clientX > lr.right - 40) lanesEl.scrollLeft += 14; else if (e.clientX < lr.left + LABEL_W + 30) lanesEl.scrollLeft -= 14;
        looper.takipDur = performance.now() + 3000;
        hedefBul(e);
      }
    });
    window.addEventListener('pointerup', () => {
      if (!sr) return;
      const s = sr; sr = null;
      if (s.tip === 'pan'){ if (s.aktif){ yut(); lanesEl.classList.remove('kayiyor'); } return; }
      if (s.tip === 'sure'){
        yut();
        if (s.yeni !== s.dur0){ gecmisAl(); s.f.blk.dur = s.yeni; if (looper.playing) looperBaslat(); }
        lanesCiz(); return;
      }
      if (!s.aktif) return;                                      // sürüklenmedi: normal tık
      yut(); surukTemizle();
      if (!s.hedef){ lanesCiz(); return; }
      gecmisAl();
      const hd = s.hedef; let yeni;
      if (s.tip === 'fav') yeni = [blokNesne(s.f, hd.track.blocks[hd.idx - 1])];
      else if (s.kopya) yeni = s.bloklar.map(b => Object.assign(dkopya(b), { id: ++blokId }));
      else { const ids = new Set(s.bloklar.map(b => b.id)); s.track.blocks = s.track.blocks.filter(b => !ids.has(b.id)); yeni = s.bloklar; }
      hd.track.blocks.splice(hd.idx, 0, ...yeni);
      looper.selId = yeni[0].id; looper.selCok = yeni.map(b => b.id); looper.selCokAna = looper.selId; looper.activeTrackId = hd.track.id;
      if (looper.playing) looperBaslat();
      lanesCiz(); gamCiz();
    });
    document.addEventListener('click', e => { if (panYuttu){ e.stopPropagation(); e.preventDefault(); } }, true);   // sürüklemenin sonundaki tık bir şey tetiklemesin
  }
  // Boşluk tuşunun odaktaki düğmeyi YENİDEN tetiklemesini engelle (keyup'taki etkinleştirmeyi de bastır)
  const bosTus = e => (e.code === 'Space' || e.key === ' ');
  const yaziAlani = () => { const t = document.activeElement && document.activeElement.tagName; return t === 'INPUT' || t === 'TEXTAREA' || t === 'SELECT'; };
  document.addEventListener('keyup', e => { if (bosTus(e) && !yaziAlani()) e.preventDefault(); });
  // klavye-öncelikli besteleme (WASD gez · oklar düzenle · Q arpej · Ctrl/Cmd+C/V · Backspace · Boşluk)
  document.addEventListener('keydown', e => {
    const yaziyor = yaziAlani();
    // Boşluk: SADECE tüm zaman çizelgesini çal/durdur (her sekmede); odaktaki düğmeyi tetiklemesin
    if (bosTus(e) && !yaziyor){
      e.preventDefault();
      const ae = document.activeElement; if (ae && /^(BUTTON|A)$/.test(ae.tagName)) ae.blur();
      if (e.shiftKey){                                         // Shift+Boşluk: seçili bloğun başından çal
        const f = bulBlok(looper.selId);
        if (f){ looper.startBeat = Math.floor(f.arr.slice(0, f.idx).reduce((t, b) => t + b.dur, 0)); baslaCiz(); }
        looperBaslat(true); return;
      }
      looper.playing ? looperDur() : looperBaslat();
      return;
    }
    // Çevirici sekmesi: 1-9,0 → kenardaki "Kayıtlı akorlar"ı yükle + çal
    const ceviriciAktif = $('#tab-cevirici') && $('#tab-cevirici').classList.contains('aktif');
    if (ceviriciAktif && !yaziyor && /^[0-9]$/.test(e.key) && !e.ctrlKey && !e.metaKey){
      const idx = e.key === '0' ? 9 : (+e.key - 1);
      if (state.favorites[idx]){ e.preventDefault(); favYukle(state.favorites[idx]); }
      return;
    }
    const looperAktif = $('#tab-looper') && $('#tab-looper').classList.contains('aktif');
    if (!looperAktif || yaziyor) return;
    if (key0(e) === 't' && !e.ctrlKey && !e.metaKey){ e.preventDefault(); tapTempo(); return; }
    if (e.key === 'Home'){ e.preventDefault(); baslaAyarla(0, true); const l = $('#lanes'); if (l) l.scrollLeft = 0; return; }
    const key = e.key.toLowerCase();
    // sayı tuşları 1-9,0 → havuzdaki o akoru seçili bloğun sağına HEMEN enjekte et
    if (/^[0-9]$/.test(e.key) && !e.ctrlKey && !e.metaKey){
      const idx = e.key === '0' ? 9 : (+e.key - 1);
      if (state.favorites[idx]){ e.preventDefault(); poolEkle(state.favorites[idx]); }
      return;
    }
    // geri al (Ctrl/Cmd+Z) · kopyala/yapıştır (Ctrl/Cmd+C/V)
    if (e.ctrlKey || e.metaKey){
      if (key === 'z'){ e.preventDefault(); e.shiftKey ? ileriAl() : geriAl(); return; }
      if (key === 'y'){ e.preventDefault(); ileriAl(); return; }
      if (key === 'c'){ const sc = secilenler(); if (sc){ clip = dkopya(sc.bloklar); e.preventDefault(); } return; }
      if (key === 'v'){ if (clip){ e.preventDefault(); blokYapistir(); } return; }
    }
    // WASD seçim gezintisi
    if (['w', 'a', 's', 'd'].includes(key)){ e.preventDefault(); nav(key); return; }
    // manipülasyon (seçili blok gerekir)
    if (!looper.selId) return;
    const f = bulBlok(looper.selId); if (!f) return;
    if (!['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'Backspace', 'Delete'].includes(e.key) && key !== 'q') return;
    e.preventDefault();
    if (e.key === 'Backspace' || e.key === 'Delete') secilenleriSil();   // seçim soldaki bloğa kayar (gecmisAl içeride)
    else if (e.key === 'ArrowLeft') blokTasi(f.track, f.idx, -1);               // diziyi yeniden sırala
    else if (e.key === 'ArrowRight') blokTasi(f.track, f.idx, 1);
    else if (key === 'q'){ gecmisAl(); f.blk.arp = !f.blk.arp; if (looper.playing) looperBaslat(); lanesCiz(); }   // arpej aç/kapa
    else { gecmisAl(); const di = DUR_BEATS.indexOf(f.blk.dur); f.blk.dur = DUR_BEATS[e.key === 'ArrowUp' ? Math.min(DUR_BEATS.length - 1, di + 1) : Math.max(0, di - 1)]; if (looper.playing) looperBaslat(); lanesCiz(); }
  });
  // varsayılan kanallar: bir gitar + bir piyano (kullanıcı ekleyip silebilir)
  oturumGeriYukle();                                           // yarım kalan çalışma varsa geri getir
  oturumHazir = true;
  if (!looper.tracks.length){ looper.tracks.push(trackNesne('gitar'), trackNesne('piyano')); looper.activeTrackId = looper.tracks[0].id; }
  window.addEventListener('pagehide', oturumYaz);
  document.addEventListener('visibilitychange', () => { if (document.hidden) oturumYaz(); });
  loopLibCiz();
  cikisCiz(); abCiz(); lanesCiz();
}

/* ===================== başlat ===================== */
fretboardKur();
piyanoKur();
kurCiz();
favCiz();
looperKur();
ciz();
$('#yukleniyor')?.remove();
</script>
