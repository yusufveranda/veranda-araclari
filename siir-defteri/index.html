<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>şiir defteri</title>
<meta name="description" content="Bir şair defteri: not gibi yaz, her hâli kendiliğinden saklanır, kitap gibi oku. Birden çok şiir, Drive eşitleme. Her şey yalnız sende.">
<meta name="theme-color" content="#2A2018">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%232A2018'/%3E%3Crect x='15' y='13' width='6' height='38' rx='2' fill='%23C2331F'/%3E%3Crect x='26' y='20' width='22' height='2.6' rx='1.3' fill='%23F4EDDD'/%3E%3Crect x='26' y='28' width='22' height='2.6' rx='1.3' fill='%23F4EDDD'/%3E%3Crect x='26' y='36' width='14' height='2.6' rx='1.3' fill='%231F6F5C'/%3E%3C/svg%3E">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,500&family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&display=swap">
<link rel="stylesheet" href="../ortak/stil.css">
<script src="https://accounts.google.com/gsi/client" async></script>
<style>
:root{
  --kagit:#F4EDDD; --kagit2:#EBE1CB; --kenar:#DED2B6;
  --murekkep:#2A2018; --soluk:#8C7C63; --cok-soluk:#B6A988;
  --kirmizi:#C2331F; --kirmizi-yum:rgba(194,51,31,.10);
  --yesil:#1F6F5C; --yesil-yum:rgba(31,111,92,.12);
}
body{background:#E9DFC6;color:var(--murekkep);font-family:'Libre Baskerville',Georgia,serif}
.wrap{max-width:1080px}
.eve-don{background:var(--kirmizi);color:#F4EDDD}
::selection{background:var(--kirmizi-yum)}

.tepe{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;border-bottom:1.5px solid var(--kenar);padding-bottom:14px;margin-bottom:18px}
.tepe .marka{font-family:'Playfair Display',Georgia,serif;font-weight:700;font-size:27px;color:var(--murekkep);letter-spacing:-.3px}
.tepe .alt{font-style:italic;color:var(--soluk);font-size:14px}
.tepe nav{margin-left:auto;display:flex;gap:14px;font-size:13.5px}
.tepe nav a{color:var(--soluk);text-decoration:none;border-bottom:1px solid transparent}
.tepe nav a:hover{color:var(--kirmizi);border-bottom-color:var(--kirmizi)}

.duzlem{display:grid;grid-template-columns:240px 1fr;gap:26px;align-items:start}
.duzlem>*{min-width:0}
@media(max-width:780px){.duzlem{grid-template-columns:1fr;gap:16px}}

/* ---- sol sırt ---- */
.sirt{position:sticky;top:18px}
@media(max-width:780px){.sirt{position:static}}
.sirt-bas{font-family:'Playfair Display',Georgia,serif;font-weight:600;font-size:13px;letter-spacing:.16em;text-transform:uppercase;color:var(--soluk);margin:0 0 8px 2px}
.defter-oge{border-left:2px solid transparent}
.ad-satir{display:flex;align-items:center;gap:7px;padding:7px 9px;border-radius:8px;cursor:pointer;font-size:15px;color:var(--murekkep)}
.ad-satir:hover{background:var(--kagit)}
.defter-oge.acik{border-left-color:var(--kirmizi)}
.defter-oge.acik .ad-satir{background:var(--kagit);font-weight:700}
.ad-satir .ad{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.p-grip{flex:none;color:var(--cok-soluk);cursor:grab;font-size:12px;opacity:0;user-select:none}
.defter-oge:hover .p-grip{opacity:.6}
.p-yil{flex:none;border:none;background:none;color:var(--cok-soluk);font-size:14px;padding:0 1px;cursor:pointer;line-height:1;align-self:center}
.p-yil.on{color:#c8932f}.p-yil:hover{color:#c8932f}
.ad-satir .sil{flex:none;border:none;background:none;color:var(--cok-soluk);font-size:15px;padding:0 3px;border-radius:5px;opacity:0}
.defter-oge:hover .sil{opacity:1}.ad-satir .sil:hover{color:var(--kirmizi)}
.defter-oge.po{box-shadow:inset 0 2px 0 var(--kirmizi)}

.icerik{padding:4px 0 8px 12px;margin-left:8px;border-left:1px dotted var(--kenar)}
.kucuk-bas{font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--cok-soluk);margin:6px 0 5px}
.hal-oge{display:flex;align-items:center;gap:7px;padding:6px 8px;border-radius:7px;cursor:pointer;font-size:13.5px}
.hal-oge:hover{background:var(--kagit)}
.hal-oge.bu{background:var(--kagit)}
.hal-oge.bu .sad{font-weight:700}
.hal-oge .sad{flex:1;color:var(--murekkep);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hal-oge .szm{font-size:11px;color:var(--cok-soluk);font-style:italic}
.hal-oge .vsil{flex:none;border:none;background:none;color:var(--cok-soluk);font-size:14px;padding:0 3px;border-radius:5px;opacity:0;align-self:center}
.hal-oge:hover .vsil{opacity:1}.hal-oge .vsil:hover{color:var(--kirmizi)}
.k-ad-giris{flex:1;border:1px solid var(--kirmizi);border-radius:6px;padding:3px 7px;font-size:13.5px;font-family:'Libre Baskerville',serif;background:#fff;min-width:0}
.k-ad-giris:focus{outline:none}
.bos-kucuk{font-size:12px;color:var(--cok-soluk);font-style:italic;padding:3px 8px;line-height:1.5}
.sirt-tus{display:flex;align-items:center;gap:6px;width:100%;justify-content:center;border:1px solid var(--kenar);background:var(--kagit);color:var(--murekkep);border-radius:9px;padding:7px 11px;font-size:13px;margin-top:6px;font-family:'Libre Baskerville',serif}
.sirt-tus:hover{border-color:var(--kirmizi);color:var(--kirmizi)}
.yeni-siir{margin-top:14px;border-style:dashed;color:var(--kirmizi);font-weight:700}
.yeni-hal{margin-top:10px;border-style:dashed;color:var(--kirmizi)}
.yeni-hal:disabled{opacity:.5;color:var(--cok-soluk);cursor:default;border-color:var(--kenar)}
.yeni-hal:disabled:hover{color:var(--cok-soluk);border-color:var(--kenar)}
.hal-not{font-size:11px;color:var(--yesil);font-style:italic;min-height:1em;text-align:center;margin-top:4px}
.drive-tus.on{border-color:var(--yesil);color:var(--yesil);background:var(--yesil-yum)}
.yedek{display:flex;gap:6px;margin-top:10px;padding-top:12px;border-top:1px solid var(--kenar)}
.yedek-tus{flex:1;border:1px solid var(--kenar);background:none;color:var(--soluk);border-radius:8px;padding:6px 8px;font-size:11.5px;font-family:'Libre Baskerville',serif}
.yedek-tus:hover{border-color:var(--kirmizi);color:var(--kirmizi)}

/* ---- sağ: sayfa ---- */
.sayfa{background:var(--kagit);border:1px solid var(--kenar);border-radius:6px;box-shadow:0 1px 0 var(--kenar),0 14px 34px rgba(42,32,24,.10);padding:28px 30px 36px;min-height:460px;position:relative}
.sayfa-bas{display:flex;align-items:center;gap:10px;margin-bottom:4px}
.baslik-giris{flex:1;min-width:0;font-family:'Playfair Display',Georgia,serif;font-weight:600;font-size:26px;color:var(--murekkep);background:none;border:none;border-bottom:1.5px solid transparent;padding:2px 0;letter-spacing:-.2px}
.baslik-giris::placeholder{color:var(--cok-soluk)}
.baslik-giris:hover{border-bottom-color:var(--kenar)}
.baslik-giris:focus{outline:none;border-bottom-color:var(--kirmizi)}
.bas-tus{flex:none;border:none;background:none;color:var(--soluk);width:34px;height:34px;border-radius:8px;display:inline-flex;align-items:center;justify-content:center;position:relative}
.bas-tus:hover{background:var(--kagit2);color:var(--kirmizi)}
.bas-tus svg{width:18px;height:18px}
.bas-tus.aktif{background:var(--kirmizi);color:#F4EDDD}
.bas-tus.ok{color:var(--yesil)}
.bas-tus.ok::after{content:'kopyalandı';position:absolute;top:38px;right:0;font-size:10.5px;font-style:italic;color:var(--yesil);white-space:nowrap}
.durum{font-size:11.5px;color:var(--cok-soluk);font-style:italic;margin:0 0 14px}
.durum b{color:var(--soluk);font-weight:400;font-style:normal}

/* yazı alanı: kâğıt, kırmızı kenar payı */
.kagit-alan{position:relative;padding-left:30px}
.kagit-alan::before{content:'';position:absolute;left:8px;top:2px;bottom:2px;width:1.5px;background:var(--kirmizi);opacity:.42;border-radius:2px}
.kagit-yazi{width:100%;border:none;background:none;resize:none;display:block;font-family:Georgia,'Times New Roman',serif;font-size:18px;line-height:1.95;color:var(--murekkep);min-height:340px;padding:2px;overflow:hidden}
.kagit-yazi:focus{outline:none}
.kagit-yazi::placeholder{color:var(--cok-soluk);font-style:italic}
.ipuc{font-size:12px;color:var(--soluk);font-style:italic;margin:18px 0 0;padding-left:30px;line-height:1.7}
.ipuc b{color:var(--kirmizi);font-weight:400;font-style:normal}

/* ---- modal ---- */
.kapak{position:fixed;inset:0;background:rgba(42,32,24,.42);z-index:150;display:flex;align-items:flex-start;justify-content:center;padding:48px 16px;overflow:auto}
.modal{background:var(--kagit);border:1px solid var(--kenar);border-radius:10px;box-shadow:0 24px 60px rgba(42,32,24,.4);max-width:560px;width:100%;padding:22px 24px}
.modal h3{font-family:'Playfair Display',serif;font-size:19px;font-weight:600;color:var(--murekkep);display:flex;align-items:center;gap:10px}
.modal h3 .kapat{margin-left:auto;border:none;background:none;color:var(--soluk);font-size:22px;line-height:1;padding:0 6px;border-radius:6px}
.modal h3 .kapat:hover{color:var(--kirmizi)}
.modal .not{font-size:13px;color:var(--soluk);font-style:italic;margin:6px 0 14px;line-height:1.5}
.modal-tus{display:flex;gap:9px;margin-top:16px;flex-wrap:wrap}
.dugme{border:1px solid var(--kenar);background:var(--kagit);color:var(--murekkep);border-radius:9px;padding:8px 15px;font-size:14px;font-family:'Libre Baskerville',serif}
.dugme:hover{border-color:var(--kirmizi);color:var(--kirmizi)}
.dugme.dol{background:var(--kirmizi);border-color:var(--kirmizi);color:#F4EDDD}
.dugme.dol:hover{filter:brightness(1.08);color:#F4EDDD}
.drive-adim{font-size:13px;line-height:1.85;color:var(--murekkep);background:#FBF6EA;border:1px solid var(--kenar);border-radius:9px;padding:12px 14px;margin-bottom:12px}
.drive-adim a{color:var(--kirmizi)}
.drive-adim code{display:inline-block;background:var(--kagit2);border-radius:5px;padding:2px 7px;font-size:12.5px;margin:3px 0;user-select:all}
.drive-giris{display:flex;gap:8px;flex-wrap:wrap}
.drive-giris input{flex:1;min-width:180px;border:1px solid var(--kenar);border-radius:8px;padding:9px 11px;font-size:14px;font-family:Menlo,monospace;background:#fff}
.drive-giris input:focus{outline:none;border-color:var(--kirmizi)}
/* hâl karşılaştırma (satır farkı) */
.diff-kutu{background:#FBF6EA;border:1px solid var(--kenar);border-radius:9px;padding:14px 16px;max-height:48vh;overflow:auto}
.diff-satir{font-family:Georgia,serif;font-size:15px;line-height:1.66;white-space:pre-wrap}
.diff-satir.eksi{color:var(--kirmizi);text-decoration:line-through;text-decoration-thickness:1px;opacity:.82}
.diff-satir.arti{color:var(--yesil)}
.diff-satir.bos{height:.7em;line-height:.7em}
.diff-bos{color:var(--soluk);font-style:italic;font-size:14px}

/* ---- kitap önizlemesi ---- */
.kagit-alan.onizleme::before{display:none}.kagit-alan.onizleme{padding-left:0}
.kitap-spread{display:flex;justify-content:center}
.kitap-sayfa{flex:1 1 0;min-width:0;width:50%;height:600px;box-sizing:border-box;background:#FCFBF6;padding:76px 42px 46px;position:relative;cursor:pointer;font-family:'Times New Roman',Times,Georgia,serif;color:#1a1611;overflow:hidden}
.kitap-sayfa:first-child{border-right:1px solid #e7dec9;border-radius:3px 0 0 3px;box-shadow:inset -16px 0 26px -20px rgba(42,32,24,.28)}
.kitap-sayfa:last-child{border-radius:0 3px 3px 0;box-shadow:inset 16px 0 26px -20px rgba(42,32,24,.28)}
.kitap-sayfa.bos{background:#F8F5EE;cursor:default}
.kitap-ic{max-width:21em;margin:0 auto}
.k-baslik{font-family:'Playfair Display',Georgia,serif;font-weight:600;font-size:15px;text-align:center;margin:0 0 16px;color:#1a1611;letter-spacing:.3px}
.k-dize{font-size:13px;line-height:1.62;padding-left:1.3em;text-indent:-1.3em;color:#1a1611}
.k-bosluk{height:1.62em}.k-bosbas{height:.4em}
.k-sayfano{position:absolute;bottom:20px;left:0;right:0;text-align:center;font-size:11.5px;color:#a99e86;font-family:'Times New Roman',serif}
.kitap-nav{display:flex;align-items:center;justify-content:center;gap:16px;margin-top:16px}
.knav{border:1px solid var(--kenar);background:var(--kagit);color:var(--murekkep);border-radius:18px;padding:6px 16px;font-size:14px;font-family:'Libre Baskerville',serif}
.knav:hover:not(:disabled){border-color:var(--kirmizi);color:var(--kirmizi)}
.knav:disabled{opacity:.35}
.knav-no{font-size:12.5px;color:var(--soluk);font-style:italic;min-width:56px;text-align:center}
@media(max-width:600px){.kitap-sayfa{height:auto;min-height:440px;box-shadow:none!important;border:1px solid #e7dec9!important;border-radius:3px!important;padding:48px 24px 44px}.kitap-spread{flex-direction:column;gap:14px}.kitap-sayfa.bos{display:none}.kitap-ic{max-width:none}}
@media(max-width:560px){.sayfa{padding:22px 16px 30px}.kagit-yazi,.baslik-giris{font-size:17px}.kagit-alan{padding-left:24px}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<a class="eve-don" href="../">veranda</a>

<div class="wrap">
<header class="tepe">
  <a href="../" style="text-decoration:none"><span class="marka">veranda</span></a>
  <span class="alt">şiir defteri</span>
  <nav><a href="../sozluk/">sözlük</a><a href="../wordle/">kelimece</a><a href="../bulmaca/">bulmaca</a></nav>
</header>

<div class="duzlem">
  <aside class="sirt">
    <div class="sirt-bas">defterim</div>
    <div id="defterler"></div>
    <button class="sirt-tus yeni-siir" id="yeniSiir">＋ yeni şiir</button>
    <div id="altArac"></div>
  </aside>

  <section class="sayfa">
    <div class="sayfa-bas">
      <input id="baslik" class="baslik-giris" placeholder="başlıksız şiir" aria-label="şiir başlığı">
      <button class="bas-tus" id="kopyala" title="Tüm şiiri kopyala" aria-label="Tüm şiiri kopyala"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h10"/></svg></button>
      <button class="bas-tus" id="onizle" title="Kitap gibi oku" aria-label="Kitap önizlemesi"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M3 5.5A2.5 2.5 0 0 1 5.5 3H12v17H5.5A2.5 2.5 0 0 0 3 22.5Z"/><path d="M21 5.5A2.5 2.5 0 0 0 18.5 3H12v17h6.5a2.5 2.5 0 0 1 2.5 2.5Z"/></svg></button>
    </div>
    <p class="durum" id="durum"></p>
    <div class="kagit-alan" id="kagitAlan"></div>
    <p class="ipuc" id="ipuc">Not defteri gibi yaz. Özgün hâlin <b>kendiliğinden korunur</b>. Yeni bir hâl denemek istediğinde soldan <b>＋ yeni hâl</b>’e bas — eskiler hep durur, ⇄ ile dize dize karşılaştırabilirsin.</p>
  </section>
</div>

<footer style="margin-top:46px;border-top:1px solid var(--kenar);padding-top:14px;color:var(--soluk);font-size:12px;text-align:center">veranda · yusuf veranda</footer>
</div>

<div id="kapakKok"></div>
<input type="file" id="iceDosya" accept="application/json" hidden>

<script>
"use strict";
(function(){
  var $=function(id){ return document.getElementById(id); };
  var el=function(t,c,h){ var e=document.createElement(t); if(c)e.className=c; if(h!=null)e.innerHTML=h; return e; };
  var esc=function(s){ return (s==null?'':String(s)).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); };
  function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,7); }
  function norm(s){ return (s||'').replace(/\r/g,'').replace(/[ \t]+$/gm,'').replace(/\n{3,}/g,'\n\n').trim(); }
  function kisaZaman(t){ try{ return new Date(t).toLocaleString('tr-TR',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'}); }catch(e){ return ''; } }

  /* ---------- model ----------
     durum = { aktif, taslaklar:[ {id,baslik,metin,haller:[hal],yildiz} ] }
     hal   = { id, ad, zaman, metin, oto, yildiz }                          */
  var ANAHTAR='siir_defteri_v1';
  function yeniTaslak(b){ return {id:uid(),baslik:b||'başlıksız şiir',metin:'',haller:[],yildiz:false}; }

  /* eski biçimleri (kitalar/kayitlar/surumler/yuvalar) düz metne taşı */
  function kitalarMetin(kl){ return (kl||[]).map(function(k){ return (k.dizeler||[]).map(function(d){ var s=d.surumler; if(!s) return ''; var v=s[d.aktif||0]; if(v&&typeof v==='object'&&v.yuvalar) return v.yuvalar.map(function(y){return y.sec[y.aktif];}).join(' '); return v||''; }).join('\n'); }).join('\n\n'); }
  function flatMetin(dz){ var by={},ord=[]; (dz||[]).forEach(function(x){ if(!(x.k in by)){ by[x.k]=[]; ord.push(x.k); } by[x.k].push(x.m); }); return ord.map(function(k){return by[k].join('\n');}).join('\n\n'); }
  function goc(d){
    if(!d.taslaklar) return {aktif:null,taslaklar:[yeniTaslak()]};
    d.taslaklar.forEach(function(t){
      if(typeof t.metin!=='string'){
        var kit = (t.kitalar&&t.kitalar.length)?t.kitalar : (t.surumler&&t.surumler[t.aktif||0]&&t.surumler[t.aktif||0].kitalar)||[];
        t.metin = norm(kitalarMetin(kit));
        var hl=[];
        (t.kayitlar||[]).forEach(function(k){ var m = (k.metin!=null)?k.metin:(k.kitalar?kitalarMetin(k.kitalar):flatMetin(k.dizeler)); hl.push({id:k.id||uid(),ad:k.ad||'hâl',zaman:k.zaman||Date.now(),metin:norm(m),oto:!!k.oto,yildiz:!!k.yildiz}); });
        if(t.surumler) t.surumler.forEach(function(s,i){ if(i!==(t.aktif||0)) hl.push({id:uid(),ad:s.ad||'hâl',zaman:s.zaman||Date.now(),metin:norm(kitalarMetin(s.kitalar)),oto:false,yildiz:false}); });
        t.haller=hl;
        delete t.kitalar; delete t.kayitlar; delete t.surumler; delete t.aktif; delete t.raf; delete t.ilkAlindi;
      }
      if(!Array.isArray(t.haller)) t.haller=[];
      t.haller.forEach(function(h){ if(typeof h.metin!=='string') h.metin=''; });
      if(typeof t.baslik!=='string') t.baslik='başlıksız şiir';
    });
    if(!d.aktif || !d.taslaklar.some(function(t){return t.id===d.aktif;})) d.aktif=d.taslaklar[0].id;
    return d;
  }
  function tumYukle(){ try{ var d=JSON.parse(localStorage.getItem(ANAHTAR)); if(d&&d.taslaklar&&d.taslaklar.length) return goc(d); }catch(e){} var t=yeniTaslak(); return {aktif:t.id,taslaklar:[t]}; }
  function kaydet(){ try{ localStorage.setItem(ANAHTAR, JSON.stringify(durum)); }catch(e){} try{ driveKaydetGecikmeli(); }catch(e){} }

  var durum=tumYukle();
  var ui={ onizleme:false, sayfaIdx:0, halDuzen:null, odakMetin:'' };

  function tas(){ for(var i=0;i<durum.taslaklar.length;i++) if(durum.taslaklar[i].id===durum.aktif) return durum.taslaklar[i]; durum.aktif=durum.taslaklar[0].id; return durum.taslaklar[0]; }
  function metinAl(){ return tas().metin||''; }
  function dolu(d){ return d&&d.taslaklar&&d.taslaklar.some(function(t){ return (t.metin||'').trim(); }); }

  /* ---------- hâller (sürümler) ----------
     Kendiliğinden sürüm ÜRETİLMEZ — "her yazdığımda yeni sürüm" derdi bitti.
     Tek otomatik dondurma: bir şiiri ilk kez değiştirince özgün hâli "ilk hâl"
     olarak bir kez saklarız (ana versiyon her zaman durur). Onun dışında yeni
     hâl yalnızca "＋ yeni hâl" düğmesiyle, kasıtlı olarak yaratılır.            */
  function halVar(m){ var hl=tas().haller; for(var i=0;i<hl.length;i++) if(norm(hl[i].metin)===m) return true; return false; }
  /* şimdiki hâli kasıtlı olarak dondur: eskisi korunur, yazmaya devam edince yeni hâl olur */
  function yeniHal(){
    if(yaziEl) tas().metin=yaziEl.value;
    var m=norm(metinAl()); if(!m) return;
    if(halVar(m)){ var e=$('halNot'); if(e){ e.textContent='bu hâl zaten saklı'; setTimeout(function(){ if(e.parentNode) e.textContent=''; },1800); } return; }
    tas().haller.push({ id:uid(), ad:'hâl '+(tas().haller.length+1), zaman:Date.now(), oto:false, metin:m });
    if(tas().haller.length>200) tas().haller.shift();
    kaydet(); cizSirt();
  }
  function halYukle(id){
    if(yaziEl) tas().metin=yaziEl.value;
    var h=tas().haller.filter(function(x){return x.id===id;})[0]; if(!h) return;
    /* mevcut iş hiçbir hâle eşit değilse güvenlik için sakla — açıkken iş kaybı olmasın */
    var m=norm(metinAl()); if(m && !halVar(m)) tas().haller.push({ id:uid(), ad:kisaZaman(Date.now()), zaman:Date.now(), oto:true, metin:m });
    tas().metin=h.metin; kaydet(); yaziTazele(); cizSirt();
  }
  function halSil(id){ tas().haller=tas().haller.filter(function(x){return x.id!==id;}); kaydet(); cizSirt(); }

  /* ---------- iki hâl arasında satır (dize) farkı ---------- */
  function satirDiff(a,b){
    var A=(a||'').split('\n'), B=(b||'').split('\n'), n=A.length, m=B.length, dp=[],i,j;
    for(i=0;i<=n;i++){ dp[i]=[]; for(j=0;j<=m;j++) dp[i][j]=0; }
    for(i=n-1;i>=0;i--) for(j=m-1;j>=0;j--) dp[i][j]=A[i]===B[j]?dp[i+1][j+1]+1:Math.max(dp[i+1][j],dp[i][j+1]);
    var out=[]; i=0; j=0;
    while(i<n&&j<m){ if(A[i]===B[j]){ out.push({t:'esit',m:A[i]}); i++; j++; } else if(dp[i+1][j]>=dp[i][j+1]){ out.push({t:'eksi',m:A[i]}); i++; } else { out.push({t:'arti',m:B[j]}); j++; } }
    while(i<n) out.push({t:'eksi',m:A[i++]});
    while(j<m) out.push({t:'arti',m:B[j++]});
    return out;
  }
  function halKarsilastir(id){
    if(yaziEl) tas().metin=yaziEl.value;
    var h=tas().haller.filter(function(x){return x.id===id;})[0]; if(!h) return;
    var d=satirDiff(norm(h.metin), norm(metinAl()));
    var mo=el('div','modal');
    mo.appendChild(el('h3',null,esc(h.ad)+' → şimdiki hâl<button class="kapat">×</button>')); mo.querySelector('.kapat').onclick=modalKapat;
    mo.appendChild(el('div','not','<span style="color:var(--kirmizi)">üstü çizili</span> = o hâlden çıkan dize · <span style="color:var(--yesil)">yeşil</span> = şimdi gelen dize'));
    var kut=el('div','diff-kutu');
    if(d.every(function(x){return x.t==='esit';})) kut.appendChild(el('div','diff-bos','İki hâl birebir aynı.'));
    else d.forEach(function(x){ if(x.m==='') kut.appendChild(el('div','diff-satir bos')); else kut.appendChild(el('div','diff-satir '+x.t, (x.t==='eksi'?'– ':x.t==='arti'?'＋ ':'   ')+esc(x.m))); });
    mo.appendChild(kut);
    var t=el('div','modal-tus');
    var g=el('button','dugme dol','bu hâle dön'); g.onclick=function(){ modalKapat(); halYukle(id); }; t.appendChild(g);
    var c=el('button','dugme','kapat'); c.onclick=modalKapat; t.appendChild(c);
    mo.appendChild(t); modalAc(mo);
  }

  function ciz(){ cizSirt(); cizSayfa(); }

  function yildizSirala(arr){ return arr.map(function(x,i){return {x:x,i:i};}).sort(function(a,b){ var ya=a.x.yildiz?1:0,yb=b.x.yildiz?1:0; if(ya!==yb) return yb-ya; return a.i-b.i; }); }

    var kok=$('defterler'); kok.innerHTML='';

    yildizSirala(durum.taslaklar).forEach(function(o){

      var yb=el('button','p-yil'+(t.yildiz?' on':''), t.yildiz?'★':'☆'); yb.title='Yıldızla'; yb.onclick=function(e){ e.stopPropagation(); t.yildiz=!t.yildiz; kaydet(); cizSirt(); }; satir.appendChild(yb);

      satir.onclick=function(e){ var c=e.target.classList; if(c.contains('sil')||c.contains('p-yil')||c.contains('p-grip')) return; if(!acik) taslakGec(t.id); };
      oge.appendChild(satir);
      if(acik){
        var ic=el('div','icerik');

        var kayitli = simdi && t.haller.some(function(h){return norm(h.metin)===simdi;});
        if(!t.haller.length) ic.appendChild(el('div','bos-kucuk', simdi?'henüz tek hâl var. ＋ yeni hâl ile şimdikini dondurabilirsin.':'yaz, sonra ＋ yeni hâl ile sakla'));
        yildizSirala(t.haller).forEach(function(ho){
          var h=ho.x;

          var yk=el('button','p-yil'+(h.yildiz?' on':''), h.yildiz?'★':'☆'); yk.title='Yıldızla'; yk.onclick=function(e){ e.stopPropagation(); h.yildiz=!h.yildiz; kaydet(); cizSirt(); }; hg.appendChild(yk);
          if(ui.halDuzen===h.id){

            var bitti=false; function bitir(){ if(bitti)return; bitti=true; h.ad=inp.value.trim()||h.ad; ui.halDuzen=null; kaydet(); cizSirt(); }
            inp.onkeydown=function(e){ if(e.key==='Enter'){e.preventDefault();bitir();} if(e.key==='Escape'){ bitti=true; ui.halDuzen=null; cizSirt(); } };
            inp.onblur=bitir; setTimeout(function(){ inp.focus(); inp.select(); },0);
          } else {
            var sad=el('span','sad', esc(h.ad)); if(norm(h.metin)===simdi) sad.title='şu an ekranda olan hâl'; hg.appendChild(sad);
            hg.appendChild(el('span','szm', kisaZaman(h.zaman)));

            hg.title='Tıkla: bu hâle dön · çift tık: adlandır';
            hg.ondblclick=function(e){ e.preventDefault(); ui.halDuzen=h.id; cizSirt(); };
            var cmp=el('button','vsil','⇄'); cmp.title='Şimdiki hâlle karşılaştır (dize farkı)'; cmp.onclick=function(e){ e.stopPropagation(); halKarsilastir(h.id); }; hg.appendChild(cmp);
            var x=el('button','vsil','×'); x.title='Hâli sil'; x.onclick=function(e){ e.stopPropagation(); halSil(h.id); }; hg.appendChild(x);
          }
          ic.appendChild(hg);

        var yh=el('button','sirt-tus yeni-hal','＋ yeni hâl'); yh.title='Şimdiki hâli dondurup sakla; yazmaya devam ettiğinde eskisi korunur'; yh.disabled=(!simdi||kayitli); yh.onclick=yeniHal; ic.appendChild(yh);

    var db=el('button','sirt-tus drive-tus'+(driveDurum==='bagli'?' on':'')); db.textContent=dlbl; db.style.marginTop='16px'; db.onclick=driveTikla; alt.appendChild(db);
    var yed=el('div','yedek');
    var ya=el('button','yedek-tus','⤓ yedekle'); ya.title='Tüm defterini indir'; ya.onclick=disaAktar; yed.appendChild(ya);
    var yg=el('button','yedek-tus','⤒ geri yükle'); yg.title='Yedek dosyası yükle'; yg.onclick=function(){ $('iceDosya').click(); }; yed.appendChild(yg);
    alt.appendChild(yed);
  }

  var yaziEl=null;
  function cizSayfa(){
    if(document.activeElement!==$('baslik')) $('baslik').value=tas().baslik;
    $('onizle').classList.toggle('aktif', ui.onizleme);
    $('kagitAlan').classList.toggle('onizleme', ui.onizleme);

  function cizYazi(){
    var kok=$('kagitAlan');
    if(!yaziEl || yaziEl.parentNode!==kok){
      kok.innerHTML='';
      yaziEl=el('textarea','kagit-yazi'); yaziEl.id='yazi'; yaziEl.spellcheck=false;
      yaziEl.placeholder='Şiiri buraya yaz…\n\nSatır başı yeni dize. İki kez Enter: yeni kıta.';
      yaziEl.value=tas().metin||'';
      kok.appendChild(yaziEl); baglaYazi(yaziEl); setTimeout(function(){ autoBoy(yaziEl); },0);
    }
  }
  function yaziTazele(){ if(yaziEl){ yaziEl.value=tas().metin||''; autoBoy(yaziEl); } else cizYazi(); }
  /* yükseklik otomatik büyür ama sayfa KAYMAZ — 'auto' sıfırlaması sırasında kaydırmayı koru */
  function autoBoy(ta){ var sc=window.pageYOffset; ta.style.height='auto'; ta.style.height=Math.max(340, ta.scrollHeight)+'px'; if(window.pageYOffset!==sc) window.scrollTo(0,sc); }
  var kaydZaman=null;
  function baglaYazi(ta){
    ta.addEventListener('focus', function(){ ui.odakMetin=norm(ta.value); });
    ta.addEventListener('input', function(){
      tas().metin=ta.value; autoBoy(ta);
      /* bir şiiri İLK kez değiştirince özgün hâli bir kez koru (tek otomatik dondurma) */
      if(ui.odakMetin && tas().haller.length===0 && norm(ta.value)!==ui.odakMetin){
        tas().haller.push({ id:uid(), ad:'ilk hâl', zaman:Date.now(), oto:true, metin:ui.odakMetin });
        ui.odakMetin=''; cizSirt();
      }
      clearTimeout(kaydZaman); kaydZaman=setTimeout(kaydet,500);
    });
    ta.addEventListener('blur', function(){ tas().metin=ta.value; kaydet(); });
  }

  /* ---------- şiir (taslak) ---------- */
  function taslakGec(id){ if(yaziEl){ tas().metin=yaziEl.value; } durum.aktif=id; ui.halDuzen=null; ui.onizleme=false; ui.odakMetin=''; kaydet(); yaziEl=null; ciz(); }
  var psuru=null;
  function poemSurukle(grip,oge,id){
    grip.addEventListener('dragstart', function(e){ psuru=id; e.dataTransfer.effectAllowed='move'; try{ e.dataTransfer.setDragImage(oge,10,10); }catch(_){} });
    grip.addEventListener('dragend', function(){ psuru=null; [].forEach.call(document.querySelectorAll('.defter-oge.po'),function(n){n.classList.remove('po');}); });
    oge.addEventListener('dragover', function(e){ if(!psuru||psuru===id) return; e.preventDefault(); oge.classList.add('po'); });
    oge.addEventListener('dragleave', function(){ oge.classList.remove('po'); });
    oge.addEventListener('drop', function(e){ if(!psuru) return; e.preventDefault(); oge.classList.remove('po'); var a=durum.taslaklar,si=a.findIndex(function(x){return x.id===psuru;}); if(si<0){psuru=null;return;} var it=a.splice(si,1)[0]; var hi=a.findIndex(function(x){return x.id===id;}); a.splice(hi<0?a.length:hi,0,it); psuru=null; kaydet(); cizSirt(); });
  }

  /* ---------- kopyala ---------- */
  function tumKopyala(){ if(yaziEl) tas().metin=yaziEl.value; var b=(tas().baslik||'').trim(); var metin=(b?b+'\n\n':'')+norm(metinAl());
    function ok(){ var x=$('kopyala'); x.classList.add('ok'); setTimeout(function(){ x.classList.remove('ok'); },1100); }
    function fb(){ var ta=document.createElement('textarea'); ta.value=metin; ta.style.position='fixed'; ta.style.opacity='0'; document.body.appendChild(ta); ta.select(); try{ document.execCommand('copy'); ok(); }catch(e){} document.body.removeChild(ta); }
    if(navigator.clipboard&&navigator.clipboard.writeText){ navigator.clipboard.writeText(metin).then(ok,fb); } else fb();
  }

  /* ---------- kitap önizlemesi ---------- */
  function stanzalar(metin){ return norm(metin).split(/\n[ \t]*\n+/).map(function(b){ return b.split('\n').map(function(l){return l.replace(/\s+$/,'');}).filter(function(l){return l.trim()!=='';}); }).filter(function(s){return s.length;}); }
  /* her şiir KENDİ sayfasında başlar (şiirler birbirine taşmaz); sayfalar eşit boyda */
  function kitapSayfalar(){
    var BUDGET=17, sayfalar=[], cur=[], used=0;
    function bitir(){ if(cur.length){ sayfalar.push(cur); cur=[]; used=0; } }
    function ekle(b,c){ cur.push(b); used+=c; }
    durum.taslaklar.forEach(function(t){
      var m=(t.id===durum.aktif&&yaziEl)?yaziEl.value:t.metin;
      var st=stanzalar(m); if(!st.length) return;
      bitir();
      ekle({tip:'baslik',metin:t.baslik||'başlıksız şiir'},2);
      ekle({tip:'bosbas'},1);
      st.forEach(function(dz,si){
        if(si>0){
          if(used+1+Math.min(2,dz.length)>BUDGET) bitir();   /* kıtayı tek dizeyle öksüz bırakma */
          else ekle({tip:'bosluk'},1);
        }
        dz.forEach(function(l){ if(used>=BUDGET) bitir(); ekle({tip:'dize',metin:l},1); });
      });
    });
    bitir();
    if(!sayfalar.length) sayfalar=[[]];
    return sayfalar;
  }
  function kitapSayfaEl(bloklar,no){
    var s=el('div','kitap-sayfa'); if(!bloklar){ s.classList.add('bos'); return s; }
    var ic=el('div','kitap-ic');
    bloklar.forEach(function(x){
      if(x.tip==='baslik') ic.appendChild(el('div','k-baslik', esc(x.metin)));
      else if(x.tip==='dize') ic.appendChild(el('div','k-dize', esc(x.metin)));
      else if(x.tip==='bosluk') ic.appendChild(el('div','k-bosluk'));
      else if(x.tip==='bosbas') ic.appendChild(el('div','k-bosbas'));
      else if(x.tip==='ara') ic.appendChild(el('div','k-ara'));
    });
    s.appendChild(ic);
    if(no) s.appendChild(el('div','k-sayfano', no));
    return s;
  }
  function kitapCizim(){
    var kok=$('kagitAlan'); kok.innerHTML='';
    var sf=kitapSayfalar();
    if(!sf.length || (sf.length===1 && !sf[0].length)){ kok.appendChild(el('div','bos-kucuk','Defter boş. Önce birkaç dize yaz, sonra kitap gibi gör.')); return; }
    var ss=Math.max(1,Math.ceil(sf.length/2)); if(ui.sayfaIdx>=ss) ui.sayfaIdx=ss-1; if(ui.sayfaIdx<0) ui.sayfaIdx=0;
    var spread=el('div','kitap-spread');
    var sagB=sf[ui.sayfaIdx*2+1];
    var sol=kitapSayfaEl(sf[ui.sayfaIdx*2], ui.sayfaIdx*2+1);
    var sag=kitapSayfaEl(sagB||null, sagB?ui.sayfaIdx*2+2:null);
    sol.onclick=function(){ if(getSelection().isCollapsed && ui.sayfaIdx>0){ ui.sayfaIdx--; cizSayfa(); } };
    sag.onclick=function(){ if(getSelection().isCollapsed && ui.sayfaIdx<ss-1){ ui.sayfaIdx++; cizSayfa(); } };
    spread.appendChild(sol); spread.appendChild(sag); kok.appendChild(spread);
    var nav=el('div','kitap-nav');
    var p=el('button','knav','‹ önceki'); p.disabled=ui.sayfaIdx<=0; p.onclick=function(){ ui.sayfaIdx--; cizSayfa(); };
    var n=el('button','knav','sonraki ›'); n.disabled=ui.sayfaIdx>=ss-1; n.onclick=function(){ ui.sayfaIdx++; cizSayfa(); };
    nav.appendChild(p); nav.appendChild(el('span','knav-no',(ui.sayfaIdx+1)+' / '+ss)); nav.appendChild(n);
    kok.appendChild(nav);
  }

  /* ===================== GOOGLE DRIVE (özel appDataFolder) ===================== */
  var driveToken=null, driveFileId=null, driveDurum='kapali', driveIstemci=null, driveZaman=null;
  function driveCid(){ return (localStorage.getItem('siir_drive_cid')||'').trim(); }
  function driveHazir(){ return window.google && google.accounts && google.accounts.oauth2; }
  function driveBaslik(){ return {'Authorization':'Bearer '+driveToken}; }
  function driveTikla(){ if(driveDurum==='bagli') driveDurumModal(); else if(driveCid()) driveBaglan(false); else driveKurModal(); }
  function driveBaglan(force){
    var cid=driveCid(); if(!cid){ driveKurModal(); return; }
    if(!driveHazir()){ driveDurum='baglaniyor'; cizSirt(); setTimeout(function(){ driveBaglan(force); },400); return; }
    if(!driveIstemci || driveIstemci._cid!==cid){
      driveIstemci=google.accounts.oauth2.initTokenClient({ client_id:cid, scope:'https://www.googleapis.com/auth/drive.file',
        callback:function(resp){ if(resp&&resp.access_token){ driveToken=resp.access_token; localStorage.setItem('siir_drive_on','1'); driveIlkEsit(); } else { driveDurum='kapali'; cizSirt(); } } });
      driveIstemci._cid=cid;
    }
    driveDurum='baglaniyor'; cizSirt();
    try{ driveIstemci.requestAccessToken({prompt: force?'consent':''}); }catch(e){ driveDurum='kapali'; cizSirt(); }
  }
  function driveIlkEsit(){
    driveDurum='bagli'; cizSirt();
    fetch("https://www.googleapis.com/drive/v3/files?q="+encodeURIComponent("name='siir-defteri.json' and trashed=false")+"&fields=files(id)", {headers:driveBaslik()})
      .then(function(r){return r.json();}).then(function(res){
        if(res.error){ driveTokenHata(res.error); return; }
        var f=res.files&&res.files[0];
        if(f){ driveFileId=f.id;
          fetch('https://www.googleapis.com/drive/v3/files/'+f.id+'?alt=media',{headers:driveBaslik()}).then(function(r){return r.text();}).then(function(txt){
            var uzak=null; try{ uzak=JSON.parse(txt); }catch(e){}
            var yd=dolu(durum), ud=uzak&&uzak.taslaklar&&dolu(goc(JSON.parse(JSON.stringify(uzak))));
            if(ud && !yd){ durum=goc(uzak); yaziEl=null; kaydet(); ciz(); driveNot('Drive’dan yüklendi'); }
            else if(ud && yd && txt!==JSON.stringify(durum)){ driveCakisma(uzak); }
            else { driveYukleHemen(); }
          });
        } else { driveYukleHemen(); }
      }).catch(function(){ driveNot('Drive’a ulaşılamadı'); });
  }
  function driveYukleHemen(){
    if(driveDurum!=='bagli'||!driveToken) return; if(yaziEl) tas().metin=yaziEl.value;
    var metin=JSON.stringify(durum), p;
    if(driveFileId){ p=fetch('https://www.googleapis.com/upload/drive/v3/files/'+driveFileId+'?uploadType=media',{method:'PATCH',headers:Object.assign({'Content-Type':'application/json'},driveBaslik()),body:metin}); }
    else { var b='----sd771'; var body='--'+b+'\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n'+JSON.stringify({name:'siir-defteri.json'})+'\r\n--'+b+'\r\nContent-Type: application/json\r\n\r\n'+metin+'\r\n--'+b+'--'; p=fetch('https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart&fields=id',{method:'POST',headers:Object.assign({'Content-Type':'multipart/related; boundary='+b},driveBaslik()),body:body}); }
    p.then(function(r){return r.json();}).then(function(res){ if(res.error){ driveTokenHata(res.error); return; } if(res.id) driveFileId=res.id; driveNot('eşitlendi'); }).catch(function(){ driveNot('eşitlenemedi'); });
  }
  function driveKaydetGecikmeli(){ if(driveDurum!=='bagli') return; clearTimeout(driveZaman); driveZaman=setTimeout(driveYukleHemen,1500); }
  function driveTokenHata(err){ if(err&&(err.code===401||err.code===403)){ driveToken=null; driveBaglan(false); } else driveNot('Drive hatası'); }
  function driveNot(msg){ var e=$('driveNot'); if(e) e.textContent=msg; }
  function driveCakisma(uzak){
    var mo=el('div','modal'); mo.appendChild(el('h3',null,'İki yerde de şiir var<button class="kapat">×</button>')); mo.querySelector('.kapat').onclick=modalKapat;
    mo.appendChild(el('div','not','Drive’daki defter ile bu cihazdaki farklı. Hangisini tutalım?'));
    var t=el('div','modal-tus');
    var a=el('button','dugme dol','Drive’dakini kullan'); a.onclick=function(){ durum=goc(uzak); yaziEl=null; kaydet(); ciz(); modalKapat(); driveNot('Drive’dan yüklendi'); }; t.appendChild(a);
    var c=el('button','dugme','Bu cihazdakini kullan'); c.onclick=function(){ modalKapat(); driveYukleHemen(); }; t.appendChild(c);
    mo.appendChild(t); modalAc(mo);
  }
  function driveKurModal(){
    var mo=el('div','modal'); mo.appendChild(el('h3',null,'Google Drive’a bağla<button class="kapat">×</button>')); mo.querySelector('.kapat').onclick=modalKapat;
    mo.appendChild(el('div','not','Şiirlerin kendi Drive’ına otomatik kaydolur; yalnız sen görürsün. Bir kerelik bir “Client ID” alman gerekiyor:'));
    var ad=el('div','drive-adim');
    ad.innerHTML='<b>1.</b> <a href="https://console.cloud.google.com/" target="_blank" rel="noopener">console.cloud.google.com</a> → yeni proje.<br>'+
      '<b>2.</b> “APIs &amp; Services → Enable APIs” → <b>Google Drive API</b>’yi aç.<br>'+
      '<b>3.</b> “OAuth consent screen” → <b>External</b> → uygulama adı + e-postan → <b>Test users</b>’a kendi Gmail’ini ekle.<br>'+
      '<b>4.</b> “Credentials → Create credentials → OAuth client ID” → <b>Web application</b>. <b>Authorized JavaScript origins</b>’e:<br><code>https://yusufveranda.github.io</code><br>Create → <b>Client ID</b>’yi kopyala.<br>'+
      '<b>5.</b> Aşağıya yapıştır:';
    mo.appendChild(ad);
    var g=el('div','drive-giris'); var inp=el('input'); inp.placeholder='….apps.googleusercontent.com'; inp.value=driveCid(); g.appendChild(inp);
    var kb=el('button','dugme dol','kaydet ve bağlan'); kb.onclick=function(){ var v=inp.value.trim(); if(!v) return; localStorage.setItem('siir_drive_cid',v); modalKapat(); driveBaglan(true); }; g.appendChild(kb);
    mo.appendChild(g); modalAc(mo);
  }
  function driveDurumModal(){
    var mo=el('div','modal'); mo.appendChild(el('h3',null,'Google Drive<button class="kapat">×</button>')); mo.querySelector('.kapat').onclick=modalKapat;
    mo.appendChild(el('div','not','<b id="driveNot">bağlı</b> — şiirlerin Drive’ında, otomatik eşitleniyor.'));
    var t=el('div','modal-tus');
    var s=el('button','dugme dol','şimdi eşitle'); s.onclick=driveYukleHemen; t.appendChild(s);
    var i=el('button','dugme','Drive’dan getir'); i.onclick=function(){ modalKapat(); if(driveToken) driveIlkEsit(); }; t.appendChild(i);
    var k=el('button','dugme','bağlantıyı kes'); k.onclick=function(){ localStorage.removeItem('siir_drive_on'); driveDurum='kapali'; driveToken=null; modalKapat(); cizSirt(); }; t.appendChild(k);
    mo.appendChild(t); modalAc(mo);
  }

  /* ---------- olaylar ---------- */
  $('baslik').addEventListener('input', function(){ tas().baslik=$('baslik').value; kaydet(); cizSirt(); });
  $('kopyala').onclick=tumKopyala;
  $('onizle').onclick=function(){ if(yaziEl) tas().metin=yaziEl.value; if(!ui.onizleme){ kaydet(); ui.sayfaIdx=0; } ui.onizleme=!ui.onizleme; yaziEl=null; cizSayfa(); };
  $('yeniSiir').onclick=function(){ if(yaziEl) tas().metin=yaziEl.value; var t=yeniTaslak(); durum.taslaklar.push(t); durum.aktif=t.id; ui.onizleme=false; ui.odakMetin=''; yaziEl=null; kaydet(); ciz(); setTimeout(function(){ $('baslik').focus(); $('baslik').select(); },0); };
  $('iceDosya').onchange=function(e){ if(e.target.files&&e.target.files[0]) iceAktar(e.target.files[0]); e.target.value=''; };
  document.addEventListener('keydown', function(e){
    if(ui.onizleme && (e.key==='ArrowLeft'||e.key==='ArrowRight') && !/^(textarea|input)$/i.test((e.target.tagName||''))){ var sf=kitapSayfalar(),ss=Math.max(1,Math.ceil(sf.length/2)); if(e.key==='ArrowLeft'&&ui.sayfaIdx>0){ ui.sayfaIdx--; cizSayfa(); } else if(e.key==='ArrowRight'&&ui.sayfaIdx<ss-1){ ui.sayfaIdx++; cizSayfa(); } return; }
    if(e.key==='Escape'){ if($('kapakKok').firstChild) modalKapat(); else if(ui.onizleme){ ui.onizleme=false; yaziEl=null; cizSayfa(); } }
  });
  window.addEventListener('beforeunload', function(){ if(yaziEl) tas().metin=yaziEl.value; try{ localStorage.setItem(ANAHTAR, JSON.stringify(durum)); }catch(e){} });

  try{ if(navigator.storage && navigator.storage.persist) navigator.storage.persist(); }catch(e){}
  ciz();
  if(localStorage.getItem('siir_drive_on') && driveCid()){ setTimeout(function(){ driveBaglan(false); }, 900); }
})();
</script>
