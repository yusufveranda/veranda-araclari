<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta http-equiv="Cache-Control" content="no-cache, must-revalidate">
<title>verandle — Türkçe Wordle</title>
<meta name="description" content="Verandle: veranda’nın üç kelime oyunu. harfiyat (klasik), taraça (3–8 harf altı kelime) ve karine (yakın anlam ipuçlu).">
<meta name="theme-color" content="#EFE4CB">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%23EFE4CB'/%3E%3Crect x='11' y='11' width='18' height='18' rx='3' fill='%235E7F4B'/%3E%3Crect x='35' y='11' width='18' height='18' rx='3' fill='%23CF9A3C'/%3E%3Crect x='11' y='35' width='18' height='18' rx='3' fill='%23C2331F'/%3E%3Crect x='35' y='35' width='18' height='18' rx='3' fill='%23988A79'/%3E%3C/svg%3E">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600;700;800&family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&display=swap">
<link rel="stylesheet" href="../ortak/stil.css">
<script src="../ortak/adlar.js"></script>
<style>
/* ===== oyuna özgü tema belirteçleri (sıcak Akdeniz / kâğıt) ===== */
body{
  --oyun-bg:#EFE4CB; --mat:#F8F1DE; --mat-golge:rgba(45,32,18,.20);
  --kutu-bos:#FCF6E7; --kutu-cizgi:#D7C7A2; --kutu-dolu:#B6A079;
  --mur:#241C16; --soluk:#7A6E59; --ince:#E3D6B8;
  --dogru:#5E7F4B; --dogru-ink:#F8F1DE;
  --varr:#CF9A3C; --varr-ink:#2B2117;
  --yok:#9A8C7A; --yok-ink:#F3EADB;
  --kirmizi:#C2331F; --kirmizi-yum:rgba(194,51,31,.12);
  --tus:#F7F0DE; --tus-cizgi:#DAC9A4; --tus-yok:#9A8C7A; --tus-yok-ink:#F3EADB;
  background:var(--oyun-bg);
  touch-action:manipulation;            /* telefonda çift-dokunma zoom yok */
}
body.gece{
  --oyun-bg:#16110C; --mat:#211A12; --mat-golge:rgba(0,0,0,.55);
  --kutu-bos:#241C13; --kutu-cizgi:#3A2E20; --kutu-dolu:#564636;
  --mur:#EFE2C6; --soluk:#9C8C70; --ince:#332919;
  --dogru:#6E9558; --dogru-ink:#16110C;
  --varr:#D8A845; --varr-ink:#1C1510;
  --yok:#615746; --yok-ink:#EAE0CC;
  --kirmizi:#E8472E; --kirmizi-yum:rgba(232,71,46,.16);
  --tus:#33291C; --tus-cizgi:#4A3A28; --tus-yok:#181109; --tus-yok-ink:#6A5E48;
  /* paylaşılan araç paleti (üst başlık/nav) koyuya çevrilir */
  --bg:#16110C; --card:#241C14; --ink:#EFE2C6; --muted:#9C8C70; --line:#3A2E20;
  --acc:#86B98E; --acc-soft:rgba(134,185,142,.14); --vurgu:#E0935A; --shadow:rgba(0,0,0,.4);
}
body{transition:background .4s,color .4s}

.oyun{max-width:464px;margin:0 auto;padding:0 4px;position:relative}

/* ----- üst: ortalı başlık + köşe araç düğmeleri ----- */
.ust-araclar{display:flex;justify-content:flex-end;gap:8px;margin-top:6px}
.adlik{text-align:center;margin-top:6px}
.adlik .ust{font-family:'Libre Baskerville',serif;font-size:10.5px;letter-spacing:.34em;text-transform:uppercase;color:var(--soluk)}
.adlik h2{font-family:'Playfair Display',serif;font-weight:800;font-size:42px;line-height:.96;color:var(--mur);letter-spacing:-.5px;margin-top:8px}
.adlik h2 .nokta{color:var(--kirmizi)}
.adlik .alt{font-family:'Libre Baskerville',serif;font-style:italic;font-size:13px;color:var(--soluk);margin-top:9px;min-height:16px}
.simge{width:38px;height:38px;border:1.5px solid var(--kutu-cizgi);border-radius:9px;background:var(--mat);color:var(--mur);
  display:flex;align-items:center;justify-content:center;cursor:pointer;box-shadow:2px 3px 0 var(--mat-golge);transition:transform .15s,box-shadow .15s}
.simge:hover{transform:translateY(-1px);box-shadow:2px 4px 0 var(--mat-golge)}
.simge:active{transform:translate(1px,2px);box-shadow:1px 1px 0 var(--mat-golge)}
.simge svg{width:19px;height:19px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.simge.kapali{color:var(--soluk);opacity:.7}

/* ----- seçiciler: kâğıt sekmeler ----- */
.secimler{margin-top:28px;display:flex;flex-direction:column;gap:11px;align-items:center}
.segment{display:inline-flex;background:var(--mat);border:1.5px solid var(--kutu-cizgi);border-radius:22px;padding:3px;box-shadow:2px 3px 0 var(--mat-golge)}
.segment button{font-family:'Libre Baskerville',serif;font-size:13px;letter-spacing:.04em;padding:7px 18px;border:none;background:transparent;color:var(--soluk);border-radius:18px;cursor:pointer;transition:color .15s}
.segment button.secili{background:var(--mur);color:var(--mat)}
.modbar{display:flex;gap:9px;align-items:center;justify-content:center}
.modbar .segment button.secili{background:var(--kirmizi);color:#fff}
.yenibtn{font-family:'Libre Baskerville',serif;font-size:12.5px;padding:8px 14px;border:1.5px solid var(--kutu-cizgi);border-radius:18px;background:var(--mat);color:var(--kirmizi);cursor:pointer;box-shadow:2px 3px 0 var(--mat-golge)}
.yenibtn:active{transform:translate(1px,2px);box-shadow:1px 1px 0 var(--mat-golge)}
.gizli{display:none!important}

/* ===== HUB: Verandle başlık + darağacı + oyun kartları ===== */
#hub{text-align:center;padding-top:6px}
.vhero-art{display:block;width:100%;max-width:340px;height:auto;margin:0 auto}
.vhero-art .asili{transform-box:fill-box;transform-origin:50% 0%;animation:sallan 3.8s ease-in-out infinite}
@keyframes sallan{0%,100%{transform:rotate(3deg)}50%{transform:rotate(-3deg)}}
@media(prefers-reduced-motion:reduce){.vhero-art .asili{animation:none}}
.vhero-ad{font-family:'Playfair Display',serif;font-weight:800;font-size:clamp(42px,12vw,60px);color:var(--mur);letter-spacing:-1.2px;line-height:.9;margin-top:2px}
.vhero-ad .nokta{color:var(--kirmizi)}
.vhero-slogan{font-family:'Libre Baskerville',serif;font-style:italic;color:var(--soluk);font-size:14px;margin-top:9px}
.kartlar-oyun{display:flex;flex-direction:column;gap:14px;max-width:430px;margin:30px auto 0}
.okart{display:block;text-align:left;width:100%;background:var(--mat);border:1.5px solid var(--kutu-cizgi);border-radius:13px;
  padding:16px 18px;box-shadow:5px 6px 0 var(--mat-golge);cursor:pointer;font-family:inherit;transition:transform .16s,box-shadow .16s}
.okart:nth-child(1){transform:rotate(-.5deg)} .okart:nth-child(2){transform:rotate(.5deg)} .okart:nth-child(3){transform:rotate(-.4deg)}
.okart:hover{transform:rotate(0) translateY(-3px);box-shadow:7px 9px 0 var(--mat-golge)}
.okart:active{transform:translate(1px,2px);box-shadow:2px 2px 0 var(--mat-golge)}
.okart-rozet{display:inline-block;font-family:'Libre Baskerville',serif;font-size:10px;letter-spacing:.16em;text-transform:uppercase;
  color:var(--soluk);border:1px solid var(--kutu-cizgi);border-radius:10px;padding:2px 9px}
.okart h3{font-family:'Playfair Display',serif;font-weight:700;font-size:25px;color:var(--mur);margin-top:10px}
.okart p{font-family:'Libre Baskerville',serif;font-size:13.5px;color:var(--soluk);line-height:1.55;margin-top:5px}

/* ===== üst bar (her iki görünümde): geri tuşu + ses/tema ===== */
.tepe-bar{display:flex;align-items:center;justify-content:space-between;margin-top:6px;min-height:38px}
.tepe-bar .ust-araclar{margin-top:0}
.sakli{visibility:hidden;pointer-events:none}
/* ===== oyun ekranı: mini wordmark + büyük tablar + farklı mod ===== */
.oyun-ust{display:flex;align-items:center;justify-content:space-between;margin-top:6px}
.oyun-ust .ust-araclar{margin-top:0}
.vmini{font-family:'Playfair Display',serif;font-weight:700;font-size:17px;color:var(--mur);background:none;border:none;cursor:pointer;padding:4px 0;letter-spacing:-.3px}
.vmini:hover{color:var(--kirmizi)}
/* büyük, önde oyun tabları */
.oyun-tablar{display:flex;gap:8px;justify-content:center;margin-top:16px}
.oyun-tablar button{flex:1;max-width:132px;font-family:'Playfair Display',serif;font-weight:700;font-size:17px;color:var(--soluk);
  background:var(--mat);border:1.5px solid var(--kutu-cizgi);border-radius:12px;padding:13px 6px;cursor:pointer;
  box-shadow:3px 4px 0 var(--mat-golge);transition:transform .12s,color .15s,background .15s}
.oyun-tablar button:active{transform:translate(1px,2px);box-shadow:1px 1px 0 var(--mat-golge)}
.oyun-tablar button.secili{background:var(--mur);color:var(--mat);border-color:var(--mur);box-shadow:3px 4px 0 var(--kirmizi-yum)}
.altYazi2{text-align:center;font-family:'Libre Baskerville',serif;font-style:italic;font-size:13px;color:var(--soluk);margin-top:11px;min-height:16px}
/* mod toggle: tablardan farklı — küçük, hafif çip */
.segment.mod{background:transparent;border:none;box-shadow:none;padding:0;gap:5px}
.segment.mod button{font-family:'Libre Baskerville',serif;font-size:12.5px;padding:6px 13px;border:1px solid var(--kutu-cizgi);border-radius:15px;color:var(--soluk);background:var(--mat)}
.segment.mod button.secili{background:var(--kirmizi-yum);color:var(--kirmizi);border-color:var(--kirmizi)}
.modbar{margin-top:14px}

/* ----- iskelime sekmeleri ----- */
.sekmeler{display:flex;gap:9px;justify-content:center;margin:26px auto 4px;flex-wrap:wrap}
.sekme{position:relative;font-family:'Playfair Display',serif;font-weight:600;font-size:16px;width:42px;height:42px;
  border:1.5px solid var(--kutu-cizgi);border-radius:11px;background:var(--mat);color:var(--mur);cursor:pointer;
  display:flex;align-items:center;justify-content:center;box-shadow:2px 3px 0 var(--mat-golge);transition:transform .15s}
.sekme:active{transform:translate(1px,2px)}
.sekme.aktif{border-color:var(--kirmizi);box-shadow:2px 3px 0 var(--kirmizi-yum),0 0 0 2px var(--kirmizi-yum)}
.sekme.cozuldu{background:var(--dogru);color:var(--dogru-ink);border-color:var(--dogru)}
.sekme.kayip{background:var(--yok);color:var(--yok-ink);border-color:var(--yok)}
.sekme .alt-no{position:absolute;bottom:-15px;left:0;right:0;font-family:'Libre Baskerville',serif;font-size:9.5px;color:var(--soluk)}

/* anlamca: yakın anlam ipuçları */
.ipuclar{text-align:center;margin:16px auto 0;font-family:'Libre Baskerville',serif}
.ipuclar .ip-et{display:block;font-size:10.5px;letter-spacing:.24em;text-transform:uppercase;color:var(--soluk);margin-bottom:4px}
.ipuclar b{font-family:'Playfair Display',serif;font-weight:700;font-size:20px;color:var(--kirmizi);letter-spacing:.02em;margin:0 3px}
.ipuclar .ip-kilit{display:block;margin-top:6px;font-size:11px;font-style:italic;color:var(--soluk);opacity:.85}
.ipuclar .ip-yeni{display:inline-block;animation:sonucGel .4s both}

/* ----- tahta: kâğıt zemin + dizgi blokları ----- */
.mat{background:var(--mat);border:1.5px solid var(--kutu-cizgi);border-radius:10px;box-shadow:5px 6px 0 var(--mat-golge);
  padding:12px;margin:26px auto 0}
.tahta{display:flex;flex-direction:column;gap:6px}
.satir{display:grid;gap:6px}
.kutu{aspect-ratio:1;border:1.6px solid var(--kutu-cizgi);border-radius:5px;display:flex;align-items:center;justify-content:center;
  font-family:'Playfair Display',serif;font-weight:700;font-size:clamp(18px,6.4vw,28px);text-transform:uppercase;
  background:var(--kutu-bos);color:var(--mur);user-select:none}
.kutu.dolu{border-color:var(--kutu-dolu)}
.kutu.imlec{border-color:var(--kirmizi);box-shadow:inset 0 0 0 1.5px var(--kirmizi)}
.kutu.tiklanir{cursor:pointer}
.kutu.hayalet{color:var(--soluk);opacity:.45;font-style:italic;font-weight:600}
.kutu.dogru{background:var(--dogru);border-color:var(--dogru);color:var(--dogru-ink)}
.kutu.varr{background:var(--varr);border-color:var(--varr);color:var(--varr-ink)}
.kutu.yok{background:var(--yok);border-color:var(--yok);color:var(--yok-ink)}
.kutu.gir{animation:harfGir .22s cubic-bezier(.3,1.4,.5,1)}
@keyframes harfGir{0%{transform:rotate(-14deg) translateY(-3px) scale(.6);opacity:.2}60%{transform:rotate(4deg) scale(1.07);opacity:1}100%{transform:none}}
/* gönderince: kutu yan döner, RENK tam ortada (yan haldeyken) belirir */
.kutu.cevir{animation-duration:.55s;animation-timing-function:ease;animation-fill-mode:both}
.kutu.cevir.dogru{animation-name:cevirDogru}
.kutu.cevir.varr{animation-name:cevirVar}
.kutu.cevir.yok{animation-name:cevirYok}
@keyframes cevirDogru{
  0%{transform:rotateX(0);background:var(--kutu-bos);color:var(--mur);border-color:var(--kutu-dolu)}
  50%{transform:rotateX(90deg);background:var(--kutu-bos);color:var(--mur);border-color:var(--kutu-dolu)}
  50.01%{background:var(--dogru);color:var(--dogru-ink);border-color:var(--dogru)}
  100%{transform:rotateX(0);background:var(--dogru);color:var(--dogru-ink);border-color:var(--dogru)}}
@keyframes cevirVar{
  0%{transform:rotateX(0);background:var(--kutu-bos);color:var(--mur);border-color:var(--kutu-dolu)}
  50%{transform:rotateX(90deg);background:var(--kutu-bos);color:var(--mur);border-color:var(--kutu-dolu)}
  50.01%{background:var(--varr);color:var(--varr-ink);border-color:var(--varr)}
  100%{transform:rotateX(0);background:var(--varr);color:var(--varr-ink);border-color:var(--varr)}}
@keyframes cevirYok{
  0%{transform:rotateX(0);background:var(--kutu-bos);color:var(--mur);border-color:var(--kutu-dolu)}
  50%{transform:rotateX(90deg);background:var(--kutu-bos);color:var(--mur);border-color:var(--kutu-dolu)}
  50.01%{background:var(--yok);color:var(--yok-ink);border-color:var(--yok)}
  100%{transform:rotateX(0);background:var(--yok);color:var(--yok-ink);border-color:var(--yok)}}
.satir.titre{animation:titre .34s}
@keyframes titre{0%,100%{transform:translateX(0)}20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}
@media(prefers-reduced-motion:reduce){.kutu.gir,.kutu.cevir,.kutu.cevir.dogru,.kutu.cevir.varr,.kutu.cevir.yok,.satir.titre{animation:none}}

.tahta-alt{text-align:center;min-height:20px;margin-top:12px;font-family:'Libre Baskerville',serif;font-size:13.5px;color:var(--soluk)}
.ta-sonuc{animation:sonucGel .42s cubic-bezier(.2,.85,.3,1) both}
.ta-bas{display:block;font-family:'Playfair Display',serif;font-weight:800;font-size:22px;line-height:1.1}
.ta-bas.ok{color:var(--dogru)} .ta-bas.yo{color:var(--yok)}
.ta-kel{display:inline-block;font-family:'Playfair Display',serif;font-size:27px;color:var(--kirmizi);letter-spacing:.06em;text-transform:uppercase;margin-top:3px}
.ta-not{display:block;font-family:'Libre Baskerville',serif;font-style:italic;font-size:12.5px;color:var(--soluk);margin-top:3px}

.mesaj{text-align:center;min-height:22px;color:var(--kirmizi);font-family:'Libre Baskerville',serif;font-style:italic;margin-top:8px;font-size:15px}

/* ----- skor / sonuç paneli ----- */
.sonuc{max-width:380px;margin:14px auto 0;background:var(--mat);border:1.5px solid var(--kutu-cizgi);border-radius:10px;
  box-shadow:5px 6px 0 var(--mat-golge);padding:18px 20px;text-align:center}
.sonuc.acilis{animation:sonucGel .5s cubic-bezier(.2,.85,.3,1) both}
@keyframes sonucGel{0%{opacity:0;transform:translateY(-12px) scale(.97)}100%{opacity:1;transform:none}}
.sonuc .baslik{font-family:'Playfair Display',serif;font-weight:800;font-size:25px;color:var(--mur);letter-spacing:.01em;margin-bottom:5px}
.sonuc .baslik.ok{color:var(--dogru)}
.sonuc .baslik.yo{color:var(--yok)}
.sonuc .alt2{font-family:'Libre Baskerville',serif;font-style:italic;font-size:13px;color:var(--soluk);margin-top:5px}
.sonuc .skor{font-family:'Playfair Display',serif;font-weight:800;font-size:34px;color:var(--mur);line-height:1}
.sonuc .skor small{font-size:18px;color:var(--soluk);font-weight:600}
.sonuc .not{font-family:'Libre Baskerville',serif;font-style:italic;color:var(--kirmizi);font-size:14px;margin-top:3px}
.sonuc .izgara{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;margin-top:13px}
.sonuc .hap{font-family:'Libre Baskerville',serif;font-size:11.5px;border:1px solid var(--kutu-cizgi);border-radius:9px;padding:5px 8px;color:var(--soluk);min-width:42px}
.sonuc .hap b{display:block;font-family:'Playfair Display',serif;font-size:14px;color:var(--mur)}
.sonuc .hap.ok{border-color:var(--dogru);color:var(--dogru)}
.sonuc .hap.ok b{color:var(--dogru)}
.sonuc .hap.yo{border-color:var(--yok)}
.sonuc .tek{font-family:'Libre Baskerville',serif;font-size:14px;color:var(--mur);line-height:1.4}
.sonuc .tek b{display:inline-block;font-family:'Playfair Display',serif;color:var(--kirmizi);font-size:27px;letter-spacing:.06em;text-transform:uppercase;margin-top:2px}

/* ----- klavye ----- */
.klavye-sar{display:flex;gap:6px;justify-content:center;align-items:stretch;margin-top:18px}
.klavye{user-select:none}
.ksira{display:flex;justify-content:center;gap:5px;margin-bottom:5px}
.ksira:last-child{margin-bottom:0}
.tus{font-family:'Libre Baskerville',serif;min-width:29px;padding:12px 7px;border-radius:7px;background:var(--tus);
  border:1.5px solid var(--tus-cizgi);color:var(--mur);font-size:14px;text-transform:uppercase;cursor:pointer;
  box-shadow:0 2px 0 var(--mat-golge);transition:transform .08s}
.tus:active{transform:translateY(1px);box-shadow:none}
/* sağ eylem sütunu: sil (üst) + dene (alt), alt alta */
.klavye-eylem{display:flex;flex-direction:column;gap:5px}
.tus.eylem{min-width:52px;flex:1;display:flex;align-items:center;justify-content:center;padding:0 9px;font-size:12px;letter-spacing:.07em}
.tus.eylem#silBtn{font-size:20px}
.tus.eylem.dene{background:var(--kirmizi);color:#fff;border-color:var(--kirmizi);font-weight:700}
.tus.dogru{background:var(--dogru);color:var(--dogru-ink);border-color:var(--dogru)}
.tus.varr{background:var(--varr);color:var(--varr-ink);border-color:var(--varr)}
.tus.yok{background:var(--tus-yok);color:var(--tus-yok-ink);border-color:var(--tus-yok);box-shadow:none;opacity:.92}

.istat{text-align:center;font-family:'Libre Baskerville',serif;font-size:12.5px;color:var(--soluk);margin-top:14px;min-height:16px}
.ipucu{text-align:center;font-family:'Libre Baskerville',serif;font-size:11.5px;color:var(--soluk);opacity:.85;margin-top:6px;font-style:italic}
@media(max-width:440px){
  .wrap{padding:12px 12px 26px}
  header.site h1{font-size:23px}
  nav.araclar{margin-top:7px;gap:6px}
  nav.araclar a{padding:3px 10px;font-size:13px}
  /* tuşlar büyük ve dolgun: satır genişliğini doldur + uzun (kolay basılır) */
  .tus{flex:1;min-width:0;max-width:54px;padding:18px 0;font-size:17px}
  .klavye{flex:1;min-width:0}
  .ksira{gap:3px;margin-bottom:5px}
  /* dene/sil ince (harflere yer açar) */
  .tus.eylem{max-width:none;min-width:30px;padding:0 2px;font-size:10px;letter-spacing:0}
  .tus.eylem#silBtn{font-size:16px}
  /* klavye ekranın altına sabit — tahta büyük olsa da hep görünür */
  .wrap{padding-bottom:212px}
  .klavye-sar{position:fixed;left:0;right:0;bottom:0;margin:0;gap:4px;z-index:30;
    justify-content:center;background:var(--oyun-bg);border-top:1.5px solid var(--kutu-cizgi);
    box-shadow:0 -4px 16px var(--mat-golge);
    padding:9px 4px calc(9px + env(safe-area-inset-bottom,0px))}
  .adlik .ust{font-size:9.5px;letter-spacing:.28em}
  .adlik h2{font-size:30px;margin-top:4px}
  .adlik .alt{font-size:12px;margin-top:5px}
  .adlik{margin-top:0}
  .ust-araclar{margin-top:0}

<script src="../ortak/harf-veri.js"></script>
<script src="../ortak/anlam-veri.js"></script>
<script>
const TRMAP={"İ":"i","I":"ı","Ş":"ş","Ğ":"ğ","Ü":"ü","Ö":"ö","Ç":"ç"};
const trLower=s=>s.replace(/[İIŞĞÜÖÇ]/g,c=>TRMAP[c]).toLowerCase();
const HARF=/^[abcçdefgğhıijklmnoöprsştuüvyz]$/;
const SIRALAR=["ertyuıopğü","asdfghjklşi","zcvbnmöç"];
const ISK_UZ=[3,4,5,6,7,8];
const RENKAD={dogru:'dogru',varr:'varr',yok:'yok'};
const CEVIR_SURE=0.78, CEVIR_GECIKME=0.21;   // flip süresi + sütun gecikmesi (saniye) — %25 daha yavaş
const REVEAL_NOTA={yok:262, varr:330, dogru:392};  // gri=do4, sarı=mi4, yeşil=sol4

const GSET={}; for(const L in HARF_GECERLI) GSET[L]=new Set(HARF_GECERLI[L]);

let oyun='harfiyat', mod='gun';
let tahtalar=[], aktif=0, oyunBitti=false;
let animHarf=null, animCevir=null;
let sonucHazir=false, sonucYeni=false;   // sonuç paneli: reveal sonrası göster + açılış animasyonu
let revealAnim=false, bekleyenMesaj='', bekleyenSes=null;  // reveal bitene kadar hayalet/mesaj/sonuç ertelenir
let revealTimer=null;   // bekleyen revealBitti zamanlayıcısı (yeni oyun/geçişte temizlenir)
let _ipSig='';          // ipucu imzası — her tuşta yeniden çizip zıplamasın diye
let bellek={};                 // oyun:mod -> devam eden durum
let ses=localStorage.getItem('harfiyat:ses')!=='0';
let tema=localStorage.getItem('harfiyat:tema')||'aydinlik';

/* ===== ses (WebAudio, dosyasız) ===== */
let actx=null;
function ac(){ try{ if(!actx) actx=new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} return actx; }
function ton(freq,dur,tip,vol){
  if(!ses) return; const c=ac(); if(!c) return;
  const o=c.createOscillator(), g=c.createGain();
  o.type=tip||'triangle'; o.frequency.value=freq;
  const t=c.currentTime;
  g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(vol||.1,t+.005);
  g.gain.exponentialRampToValueAtTime(.0001,t+dur);
  o.connect(g); g.connect(c.destination); o.start(t); o.stop(t+dur+.02);
}
function sHarf(){ ton(168+Math.random()*46,.08,'triangle',.075); }
function sSil(){ ton(120,.06,'sine',.06); }
function sGonder(){ ton(300,.07,'triangle',.06); }
function sIyi(){ ton(523,.12,'sine',.11); setTimeout(()=>ton(784,.18,'sine',.11),95); }
function sKotu(){ ton(196,.16,'sine',.08); setTimeout(()=>ton(165,.22,'sine',.08),110); }
function sBitis(k){ if(k){ ton(523,.12,'sine',.1); setTimeout(()=>ton(659,.12,'sine',.1),110); setTimeout(()=>ton(880,.22,'sine',.11),220);} else sKotu(); }
// reveal: girişten farklı enstrüman — temel + oktav (çan/marimba), renge göre nota
function sReveal(rk){
  if(!ses) return; const c=ac(); if(!c) return;
  const f=REVEAL_NOTA[rk]||300, t=c.currentTime;
  [[1,.10],[2,.05]].forEach(([m,v])=>{
    const o=c.createOscillator(), g=c.createGain();
    o.type='sine'; o.frequency.value=f*m;
    g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(v,t+.008);
    g.gain.exponentialRampToValueAtTime(.0001,t+.30);
    o.connect(g); g.connect(c.destination); o.start(t); o.stop(t+.33);
  });
}

/* ===== gün / cevap ===== */
function gunSayisi(){ return Math.floor((Date.now()-new Date(2026,0,1))/86400000); }
function rasgele(L){ const a=HARF_CEVAP[L]; return a[Math.floor(Math.random()*a.length)]; }
function gunlukCevap(L){ const a=HARF_CEVAP[L]; return a[(gunSayisi()*31+L*7)%a.length]; }

function yeniTahta(L,cevap){
  return {uz:L,cevap,gecmis:[],giris:Array(L).fill(''),imlec:0,bitti:false,kazandi:false,maxSatir:oyun==='iskelime'?7:6};
}
function tahtalariKur(){
  if(oyun==='iskelime') tahtalar = ISK_UZ.map(L=>yeniTahta(L, mod==='gun'?gunlukCevap(L):rasgele(L)));
  else if(oyun==='anlamca'){
    const ks=Object.keys(ANLAM_CEVAP);
    const c=mod==='gun'?ks[gunSayisi()%ks.length]:ks[Math.floor(Math.random()*ks.length)];
    const t=yeniTahta(5,c); t.maxSatir=3; t.ipucu=ANLAM_CEVAP[c]; tahtalar=[t];
  } else tahtalar=[ yeniTahta(5, mod==='gun'?gunlukCevap(5):rasgele(5)) ];
  aktif=0; oyunBitti=false; animHarf=null; animCevir=null; sonucHazir=false; sonucYeni=false;
  revealAnim=false; bekleyenMesaj=''; bekleyenSes=null; clearTimeout(revealTimer); revealTimer=null;
}

/* ===== değerlendirme ===== */
function degerlendir(tahmin,cevap){
  const c=cevap.split(''),kalan={}; c.forEach(h=>kalan[h]=(kalan[h]||0)+1);
  const r=Array(tahmin.length).fill('yok');
  for(let i=0;i<tahmin.length;i++) if(tahmin[i]===c[i]){ r[i]='dogru'; kalan[tahmin[i]]--; }
  for(let i=0;i<tahmin.length;i++) if(r[i]!=='dogru'&&kalan[tahmin[i]]>0){ r[i]='varr'; kalan[tahmin[i]]--; }
  return r;
}
function hayalet(b){
  const g=Array(b.uz).fill('');
  b.gecmis.forEach(row=>row.renkler.forEach((rk,i)=>{ if(rk==='dogru') g[i]=b.cevap[i]; }));
  return g;
}
function tusRenkleri(gecmis){
  const onc={yok:0,varr:1,dogru:2},renk={};
  gecmis.forEach(row=>row.harfler.forEach((h,i)=>{ const rk=row.renkler[i]; if((onc[renk[h]]??-1)<onc[rk]) renk[h]=rk; }));
  return renk;
}

/* ===== giriş ===== */
function aktifTahta(){ return tahtalar[aktif]; }
function sonrakiBos(b,from){
  for(let i=from+1;i<b.uz;i++) if(!b.giris[i]) return i;
  for(let i=0;i<b.uz;i++) if(!b.giris[i]) return i;
  return Math.min(from,b.uz-1);
}
function harfGir(h){
  const b=aktifTahta(); if(!b||b.bitti||oyunBitti) return;
  if(b.giris[b.imlec] && b.giris.some(x=>!x)) b.imlec=sonrakiBos(b,b.imlec);
  b.giris[b.imlec]=h; animHarf={t:aktif,c:b.imlec}; b.imlec=sonrakiBos(b,b.imlec);
  sHarf(); ciz();
}
function sil(){
  const b=aktifTahta(); if(!b||b.bitti) return;
  if(b.giris[b.imlec]){ b.giris[b.imlec]=''; }
  else { let i=b.imlec-1; while(i>=0&&!b.giris[i]) i--; if(i>=0){ b.giris[i]=''; b.imlec=i; } }
  sSil(); ciz();
}
function imlecTasi(yon){ const b=aktifTahta(); if(!b||b.bitti) return; b.imlec=Math.max(0,Math.min(b.uz-1,b.imlec+yon)); ciz(); }
function hucreSec(t,c){
  if(t<0||t>=tahtalar.length) return;
  if(t!==aktif){ aktif=t; ciz(); return; }
  const b=aktifTahta(); if(b.bitti) return; b.imlec=c; ciz();
}
function dene(){
  const b=aktifTahta(); if(!b||b.bitti||oyunBitti) return;
  const g=hayalet(b), dolu=b.giris.map((h,i)=>h||g[i]||'');
  if(dolu.some(x=>!x)){ mesaj('kalan boşlukları doldur'); return; }
  const kelime=dolu.join('');
  if(!GSET[b.uz].has(kelime)){ mesaj('listede yok: '+kelime); titret(); sKotu(); return; }
  mesaj('');
  const renk=degerlendir(kelime,b.cevap);
  b.gecmis.push({harfler:dolu.slice(),renkler:renk});
  animCevir={t:aktif,satir:b.gecmis.length-1};
  b.giris=Array(b.uz).fill(''); b.imlec=0;
  if(kelime===b.cevap){ b.bitti=true; b.kazandi=true; }
  else if(b.gecmis.length>=b.maxSatir){ b.bitti=true; }
  // reveal sesleri: her harf açılırken (flip ortasında) renk notası, tek tek
  if(ses) renk.forEach((rk,i)=>setTimeout(()=>sReveal(rk),(i*CEVIR_GECIKME+CEVIR_SURE*.5)*1000));
  revealAnim=true;   // bitene kadar hayalet/mesaj/sonuç gizli
  durumDegerlendir();
  durumKaydetBellek(); kaydet(); ciz(); mobilGorunur();
  const rms=(b.uz*CEVIR_GECIKME+CEVIR_SURE)*1000;
  clearTimeout(revealTimer); revealTimer=setTimeout(revealBitti, rms);
}
function revealBitti(){
  revealAnim=false;
  if(bekleyenMesaj){ mesaj(bekleyenMesaj); bekleyenMesaj=''; }
  if(oyunBitti){ sonucHazir=true; sonucYeni=true; }
  ciz(); mobilGorunur();
  if(bekleyenSes){ bekleyenSes(); bekleyenSes=null; }
  if(oyunBitti){ const el=document.getElementById('sonuc'); if(el && !el.classList.contains('gizli')) el.scrollIntoView({behavior:'smooth',block:'center'}); }
}
function mobilGorunur(){   // mobilde aktif satırı sabit klavyenin üstünde tut
  if((window.innerWidth||999)>440) return;
  const b=aktifTahta(); const idx=Math.min(b.gecmis.length,b.maxSatir-1);
  const sat=document.querySelectorAll('#tahta .satir')[idx];
  if(sat) sat.scrollIntoView({behavior:'smooth',block:'center'});
}
function titret(){ const s=document.querySelector('#tahta .satir.aktifsatir'); if(s){ s.classList.add('titre'); setTimeout(()=>s.classList.remove('titre'),340); } }

const OVGU=['dâhice!','harika!','bravo!','güzel!','oldu!','ucu ucuna!'];
function durumDegerlendir(){
  const b=aktifTahta();
  bekleyenMesaj=''; bekleyenSes=null;
  if(oyun!=='iskelime'){   // harfiyat + anlamca: tek tahta
    if(b.kazandi){ oyunBitti=true; bekleyenMesaj=OVGU[Math.min(b.gecmis.length-1,OVGU.length-1)]; bekleyenSes=()=>sBitis(true); istatleGuncelle(true); }
    else if(b.bitti){ oyunBitti=true; bekleyenSes=()=>sBitis(false); istatleGuncelle(false); }
    return;
  }
  // iskelime — otomatik geçiş yok; tüm tahtalar bitince skor paneli
  if(tahtalar.every(t=>t.bitti)){
    oyunBitti=true;
    const k=tahtalar.filter(t=>t.kazandi).length;
    bekleyenMesaj=k===6?'hepsi çözüldü! ✦':'oyun bitti';
    bekleyenSes=()=>sBitis(k>=4);
    istatleGuncelle(k===6);
  }
}

/* ===== skor ===== */
function skorHesapla(){
  const per=tahtalar.map(t=>({uz:t.uz,cozuldu:t.kazandi,deneme:t.gecmis.length,puan:t.kazandi?(t.maxSatir+1-t.gecmis.length):0}));
  const toplam=per.reduce((a,b)=>a+b.puan,0), max=tahtalar.reduce((a,t)=>a+t.maxSatir,0);
  return {per,toplam,max,cozulen:per.filter(p=>p.cozuldu).length};
}
function skorNot(r){
  if(r>=.88) return 'usta dizgici'; if(r>=.66) return 'çok iyi'; if(r>=.45) return 'iyi iş';
  if(r>.18) return 'olur böyle'; if(r>0) return 'bir dahaki sefere'; return 'hiç olmadı';
}

/* ===== istatistik (günlük) ===== */
const iA=()=> 'harfiyat:istat:'+oyun, iS=()=> 'harfiyat:istat-son:'+oyun;
function istatleGuncelle(kazandi){
  if(mod!=='gun') return;
  try{
    if(localStorage.getItem(iS())===String(gunSayisi())){ istatGoster(); return; }
    const s=JSON.parse(localStorage.getItem(iA())||'{"oyun":0,"galibiyet":0}');
    s.oyun++; if(kazandi) s.galibiyet++;
    localStorage.setItem(iA(),JSON.stringify(s)); localStorage.setItem(iS(),String(gunSayisi()));
  }catch(e){}
  istatGoster();
}
function istatGoster(){
  const el=document.getElementById('istat');
  if(mod!=='gun'){ el.textContent=''; return; }
  try{ const s=JSON.parse(localStorage.getItem(iA())||'{"oyun":0,"galibiyet":0}');
    el.textContent=s.oyun?`${s.oyun} oyun · %${Math.round(100*s.galibiyet/s.oyun)} galibiyet`:''; }
  catch(e){ el.textContent=''; }
}

/* ===== günlük ilerleme + bellek ===== */
const gA=()=> 'harfiyat:gun:'+oyun;
function kaydet(){
  if(mod!=='gun') return;
  try{ localStorage.setItem(gA(),JSON.stringify({gun:gunSayisi(),oyun,t:tahtalar.map(b=>({k:b.gecmis.map(g=>g.harfler.join('')),b:b.bitti,w:b.kazandi}))})); }catch(e){}
}
function yukle(){
  if(mod!=='gun') return false;
  try{ const v=JSON.parse(localStorage.getItem(gA())); if(!v||v.gun!==gunSayisi()||v.oyun!==oyun) return false;
    v.t.forEach((sv,i)=>{ const b=tahtalar[i]; if(!b) return;
      sv.k.forEach(kel=>b.gecmis.push({harfler:kel.split(''),renkler:degerlendir(kel,b.cevap)}));
      b.bitti=sv.b; b.kazandi=sv.w; });
    if(tahtalar.every(t=>t.bitti)){ oyunBitti=true; sonucHazir=true; }
    return true;
  }catch(e){ return false; }
}
function durumKaydetBellek(){ bellek[oyun+':'+mod]={tahtalar,aktif,oyunBitti,sonucHazir}; }
function durumYukleBellek(){ const d=bellek[oyun+':'+mod]; if(d){ tahtalar=d.tahtalar; aktif=d.aktif; oyunBitti=d.oyunBitti; sonucHazir=!!d.sonucHazir; sonucYeni=false; return true; } return false; }

/* ===== çizim ===== */
function mesaj(m){ document.getElementById('mesaj').textContent=m||''; }

function ciz(){
  const b=aktifTahta();
  // sekmeler
  const sek=document.getElementById('sekmeler');
  sek.classList.toggle('gizli', oyun!=='iskelime');
  if(oyun==='iskelime'){
    sek.innerHTML='';
    tahtalar.forEach((t,i)=>{
      const s=document.createElement('button');
      s.className='sekme'+(i===aktif?' aktif':'')+(t.kazandi?' cozuldu':(t.bitti?' kayip':''));
      s.textContent=t.uz; s.onclick=()=>{ aktif=i; ciz(); };
      sek.appendChild(s);
    });
  }
  // anlamca ipuçları: 1. ipucu baştan, 2. ipucu 2. tahminden sonra (reveal bitince)
  const ip=document.getElementById('ipuclar');
  if(oyun==='anlamca' && b.ipucu){
    ip.classList.remove('gizli');
    const ikiHazir=b.gecmis.length>=2 && !revealAnim && b.ipucu.length>=2;
    const sig=b.cevap+'|'+(ikiHazir?2:1)+'|'+b.bitti;
    if(sig!==_ipSig){   // sadece ipucu değişince yeniden çiz (her tuşta zıplamasın)
      _ipSig=sig;
      const goster=ikiHazir?b.ipucu.slice(0,2):b.ipucu.slice(0,1);
      ip.innerHTML='<span class="ip-et">yakın anlam</span>'+
        goster.map((s,i)=>'<b'+(i===1?' class="ip-yeni"':'')+'>'+s+'</b>').join('<span style="color:var(--soluk)">·</span>')+
        (!ikiHazir && b.ipucu.length>=2 && !b.bitti ? '<span class="ip-kilit">2. tahminden sonra bir ipucu daha</span>':'');
    }
  } else { ip.classList.add('gizli'); _ipSig=''; }
  // tahta — hücre boyutu pikselle hesaplanır (uzun kelimeler de sığsın)
  const t=document.getElementById('tahta');
  // Kare boyutu YALNIZ genişliğe göre (sabit; adres çubuğu/scroll ile zıplamaz)
  const dar=(window.innerWidth||404)<=440;
  const W=Math.min(460,(window.innerWidth||404)-(dar?14:32));
  const tile=Math.max(30,Math.min(dar?60:58,Math.floor((W-24-(b.uz-1)*6)/b.uz)));
  document.getElementById('mat').style.width=(b.uz*tile+(b.uz-1)*6+24)+'px';
  t.innerHTML='';
  const aktifSatirIdx=b.gecmis.length, g=hayalet(b);
  for(let r=0;r<b.maxSatir;r++){
    const sd=document.createElement('div'); sd.className='satir';
    if(r===aktifSatirIdx && !b.bitti) sd.classList.add('aktifsatir');
    sd.style.gridTemplateColumns=`repeat(${b.uz},${tile}px)`;
    for(let c=0;c<b.uz;c++){
      const k=document.createElement('div'); k.className='kutu';
      if(r<b.gecmis.length){
        const row=b.gecmis[r]; k.textContent=row.harfler[c]; k.classList.add('dolu',RENKAD[row.renkler[c]]);
        if(animCevir&&animCevir.t===aktif&&animCevir.satir===r){ k.classList.add('cevir'); k.style.animationDuration=CEVIR_SURE+'s'; k.style.animationDelay=(c*CEVIR_GECIKME)+'s'; }
      } else if(r===aktifSatirIdx && !b.bitti){
        const harf=b.giris[c];
        if(harf){ k.textContent=harf; k.classList.add('dolu'); }
        else if(g[c] && !revealAnim){ k.textContent=g[c]; k.classList.add('hayalet'); }
        if(c===b.imlec) k.classList.add('imlec');
        if(animHarf&&animHarf.t===aktif&&animHarf.c===c&&harf) k.classList.add('gir');
        k.classList.add('tiklanir'); k.onclick=()=>hucreSec(aktif,c);
      }
      sd.appendChild(k);
    }
    t.appendChild(sd);
  }
  animHarf=null; animCevir=null;
  // tahta altı — İskelime'de tahta sonucu (Harfiyat #sonuc panelini kullanır)
  const alt=document.getElementById('tahtaAlt');
  if(oyun==='iskelime' && b.bitti && !revealAnim){
    alt.innerHTML='<div class="ta-sonuc">'+(b.kazandi
      ? '<span class="ta-bas ok">bildin!</span><span class="ta-kel">'+b.cevap+'</span><span class="ta-not">'+b.gecmis.length+' denemede</span>'
      : '<span class="ta-bas yo">bilemedin</span><span class="ta-kel">'+b.cevap+'</span>')+'</div>';
  } else alt.innerHTML='';
  klavyeCiz();
  sonucCiz();
  // başlık / altyazı / ipucu
  document.getElementById('altYazi').textContent = oyun==='iskelime' ? 'üç’ten sekiz harfe · altı kelime, yedişer deneme'
    : oyun==='anlamca' ? 'beş harf · üç deneme · yakın anlam ipucuyla'
    : 'beş harf · altı deneme';
  document.getElementById('ipucu').textContent = oyunBitti ? '' : 'boş bırak, bildiğini yerine koy — yeşiller kendiliğinden gelir';
}

function sonucCiz(){
  const el=document.getElementById('sonuc');
  if(!(oyunBitti && sonucHazir)){ el.classList.add('gizli'); el.classList.remove('acilis'); return; }
  el.classList.remove('gizli');
  if(oyun==='iskelime'){
    const s=skorHesapla();
    const haplar=s.per.map(p=>`<span class="hap ${p.cozuldu?'ok':'yo'}">${p.uz}<b>${p.cozuldu?p.deneme:'—'}</b></span>`).join('');
    el.innerHTML=`<div class="baslik ${s.cozulen===6?'ok':''}">${s.cozulen}/6 kelime</div>
      <div class="skor">${s.toplam}<small> / ${s.max}</small></div>
      <div class="not">${skorNot(s.toplam/s.max)}</div>
      <div class="izgara">${haplar}</div>`;
  } else {
    const b=tahtalar[0];
    el.innerHTML = b.kazandi
      ? `<div class="baslik ok">bildin!</div><div class="tek"><b>${b.cevap}</b></div><div class="alt2">${b.gecmis.length}/${b.maxSatir} denemede</div>`
      : `<div class="baslik yo">bilemedin</div><div class="tek">cevap <b>${b.cevap}</b></div>`;
  }
  if(sonucYeni){ el.classList.remove('acilis'); void el.offsetWidth; el.classList.add('acilis'); sonucYeni=false; }
}

function klavyeCiz(){
  const b=aktifTahta();
  const renk=tusRenkleri(revealAnim ? b.gecmis.slice(0,-1) : b.gecmis);  // reveal sırasında son tahmin rengi gelmesin
  const kl=document.getElementById('klavye'); kl.innerHTML='';
  SIRALAR.forEach((sira)=>{
    const sd=document.createElement('div'); sd.className='ksira';
    for(const h of sira){ const b=tus(h,RENKAD[renk[h]]||''); b.onclick=()=>harfGir(h); sd.appendChild(b); }
    kl.appendChild(sd);
  });
}
function tus(h,ek){ const b=document.createElement('button'); b.className='tus'+(ek?' '+ek:''); b.textContent=h; return b; }

/* ===== mod / oyun / tema / ses ===== */
function oyunlaKur(){
  clearTimeout(revealTimer); revealTimer=null; revealAnim=false;
  if(!durumYukleBellek()){ tahtalariKur(); if(mod==='gun') yukle(); durumKaydetBellek(); }
  document.getElementById('yeniBtn').classList.toggle('gizli', mod!=='serbest');
  document.getElementById('ftnot').textContent = mod==='gun'?'her gün yeni':'sonsuz oyun';
  mesaj(''); ciz(); istatGoster(); window.scrollTo(0,0);
}
function oyunSec(o){ if(o===oyun) return; durumKaydetBellek(); oyun=o;
  document.querySelectorAll('#oyunSeg button').forEach(x=>x.classList.toggle('secili',x.dataset.oyun===o)); oyunlaKur(); }
function modSec(m){ if(m===mod) return; durumKaydetBellek(); mod=m;
  document.querySelectorAll('#modSeg button').forEach(x=>x.classList.toggle('secili',x.dataset.mod===m)); oyunlaKur(); }
function yeniOyun(){ const yb=document.getElementById('yeniBtn'); if(yb) yb.blur();
  tahtalariKur(); durumKaydetBellek(); mesaj(''); ciz(); window.scrollTo(0,0); }

const IK_SES_ON='<path d="M4 9v6h4l5 4V5L8 9H4z"/><path d="M16 9a3 3 0 010 6"/><path d="M18.5 7a6 6 0 010 10"/>';
const IK_SES_OFF='<path d="M4 9v6h4l5 4V5L8 9H4z"/><path d="M16 9l5 6M21 9l-5 6"/>';
const IK_GUN='<circle cx="12" cy="12" r="4.2"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>';
const IK_AY='<path d="M20 14.5A8 8 0 119.5 4a6.5 6.5 0 0010.5 10.5z"/>';
function temaUygula(){
  document.body.classList.toggle('gece', tema==='gece');
  document.getElementById('temaBtn').innerHTML='<svg viewBox="0 0 24 24">'+(tema==='gece'?IK_GUN:IK_AY)+'</svg>';
  document.querySelector('meta[name=theme-color]').setAttribute('content', tema==='gece'?'#16110C':'#EFE4CB');
}
function sesUygula(){
  const btn=document.getElementById('sesBtn');
  btn.innerHTML='<svg viewBox="0 0 24 24">'+(ses?IK_SES_ON:IK_SES_OFF)+'</svg>';
  btn.classList.toggle('kapali', !ses);
}

/* ===== hub <-> oyun geçişi ===== */
function hubGoster(){ document.getElementById('oyunEkran').classList.add('gizli'); document.getElementById('hub').classList.remove('gizli'); document.getElementById('hubDon').classList.add('sakli'); window.scrollTo(0,0); }
function hubaDon(){ if(tahtalar.length) durumKaydetBellek(); hubGoster(); }
function oyunaGir(g){
  document.getElementById('hub').classList.add('gizli');
  document.getElementById('oyunEkran').classList.remove('gizli');
  document.getElementById('hubDon').classList.remove('sakli');
  if(g!==oyun){ if(tahtalar.length) durumKaydetBellek(); oyun=g;
    document.querySelectorAll('#oyunSeg button').forEach(x=>x.classList.toggle('secili',x.dataset.oyun===g)); }
  oyunlaKur();
}
document.querySelectorAll('.okart').forEach(k=>k.onclick=()=>oyunaGir(k.dataset.git));
document.getElementById('hubDon').onclick=function(){ this.blur(); hubaDon(); };
document.querySelectorAll('#oyunSeg button').forEach(x=>x.onclick=()=>{ oyunSec(x.dataset.oyun); x.blur(); });
document.querySelectorAll('#modSeg button').forEach(x=>x.onclick=()=>{ modSec(x.dataset.mod); x.blur(); });
document.getElementById('yeniBtn').onclick=yeniOyun;
document.getElementById('silBtn').onclick=function(){ sil(); this.blur(); };
document.getElementById('deneBtn').onclick=function(){ dene(); this.blur(); };
document.getElementById('temaBtn').onclick=function(){ tema=tema==='gece'?'aydinlik':'gece'; localStorage.setItem('harfiyat:tema',tema); temaUygula(); this.blur(); };
document.getElementById('sesBtn').onclick=function(){ ses=!ses; localStorage.setItem('harfiyat:ses',ses?'1':'0'); sesUygula(); if(ses) sGonder(); this.blur(); };

document.addEventListener('keydown',e=>{
  if(e.ctrlKey||e.metaKey||e.altKey) return;
  if(document.getElementById('oyunEkran').classList.contains('gizli')) return;   // hub'dayken karışma (kartlar Enter'la açılsın)
  const ae=document.activeElement;
  if(ae && (ae.tagName==='BUTTON'||ae.tagName==='A')) ae.blur();   // odaktaki düğme/link Enter'ı yutup toggle/gezinme yapmasın
  if(e.key==='Enter'){ e.preventDefault(); dene(); }
  else if(e.key==='Backspace'){ e.preventDefault(); sil(); }
  else if(e.key==='ArrowLeft'){ e.preventDefault(); imlecTasi(-1); }
  else if(e.key==='ArrowRight'){ e.preventDefault(); imlecTasi(1); }
  else { const h=trLower(e.key); if(HARF.test(h)){ e.preventDefault(); harfGir(h); } }
});

let _rz; window.addEventListener('resize',()=>{ clearTimeout(_rz); _rz=setTimeout(ciz,120); });
temaUygula(); sesUygula(); hubGoster();
</script>
</body>
</html>
